<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Chairs - MicroVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-1: #0f2027;
            --bg-grad-2: #203a43;
            --bg-grad-3: #2c5364;
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff007f;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            text-decoration: none;
            color: #fff;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-nav:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 800px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .input-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .input-field {
            flex: 1;
            min-width: 150px;
        }

        label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            background: rgba(0,0,0,0.4);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        button {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            display: block;
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 25px rgba(0, 210, 255, 0.4);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        button:disabled {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.3);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 1rem;
            width: auto;
            background: rgba(255,255,255,0.1);
            box-shadow: none;
            border: 1px solid var(--glass-border);
        }
        
        .btn-small:hover {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .status-box {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .status-playing {
            color: var(--primary);
            border-color: rgba(0, 210, 255, 0.3);
            animation: pulse 2s infinite;
        }
        
        .status-stopped {
            color: var(--accent);
            border-color: rgba(255, 0, 127, 0.3);
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(0, 210, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
        }

        .video-container {
            margin-top: 30px;
            border-radius: 16px;
            overflow: hidden;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <a href="index.html" class="game-nav">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Games Hub
    </a>

    <div class="container">
        <h1>Musical Chairs</h1>
        <p class="subtitle">Enter a YouTube link and set random durations to start the ultimate party game!</p>

        <div class="input-group">
            <div class="preset-options" style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap;">
                <button type="button" class="btn-small" style="margin: 0; width: auto;" onclick="document.getElementById('yt-link').value='https://youtube.com/playlist?list=PLnGRV05XmAq2xzqAI9kr-9o11J7uLS19w'">Hindi Party Songs</button>
                <button type="button" class="btn-small" style="margin: 0; width: auto;" onclick="document.getElementById('yt-link').value='https://youtube.com/playlist?list=PLQ56vaftymdoZBDiHxspRgGbx6tSup0FE'">Telugu Party Songs</button>
            </div>
            <div class="input-field">
                <label>YouTube Video or Playlist Link</label>
                <input type="text" id="yt-link" placeholder="e.g. https://youtu.be/..." />
            </div>
            
            <div class="input-row">
                <div class="input-field">
                    <label>Start Time (m:s)</label>
                    <input type="text" id="start-time" value="0:00" />
                </div>
                <div class="input-field">
                    <label>Min Duration (m:s)</label>
                    <input type="text" id="min-time" value="0:05" />
                </div>
                <div class="input-field">
                    <label>Max Duration (m:s)</label>
                    <input type="text" id="max-time" value="0:15" />
                </div>
            </div>
        </div>

        <button id="play-btn" onclick="startRandomPlay()">Start Game 🎵</button>

        <div id="playlist-nav" class="controls" style="display:none;">
            <button class="btn-small" onclick="prevVideo()">⏮ Prev</button>
            <button class="btn-small" onclick="nextVideo()">Next ⏭</button>
        </div>

        <div id="status" class="status-box" style="display:none;">Ready to play!</div>

        <div id="video-box" class="video-container">
            <div id="player"></div>
        </div>
    </div>

    <!-- YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentRandomDuration = 0;
        let timerInterval = null;
        let isApiReady = false;
        let isPlaylist = false;
        let shouldSkipIntro = false;

        function onYouTubeIframeAPIReady() { 
            isApiReady = true; 
        }

        function parseTime(input) {
            if (!input) return 0;
            if (!input.includes(':')) return parseInt(input) || 0;
            const parts = input.split(':');
            const m = parseInt(parts[0]) || 0;
            const s = parseInt(parts[1]) || 0;
            return (m * 60) + s;
        }

        function parseYouTubeUrl(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            const videoId = (match && match[7].length == 11) ? match[7] : false;
            const listMatch = url.match(/[?&]list=([^#&?]+)/);
            const listId = listMatch ? listMatch[1] : false;
            return { videoId, listId };
        }

        function updateStatus(msg, stateClass = '') {
            const statusEl = document.getElementById('status');
            statusEl.style.display = 'block';
            statusEl.innerHTML = msg;
            statusEl.className = 'status-box ' + stateClass;
        }

        function startRandomPlay() {
            if (!isApiReady) { 
                alert("YouTube API is still loading. Please try again in a second."); 
                return; 
            }

            const url = document.getElementById('yt-link').value.trim();
            if (!url) { 
                alert("Please paste a valid YouTube link first!"); 
                return; 
            }

            const startSec = parseTime(document.getElementById('start-time').value);
            const minSec = parseTime(document.getElementById('min-time').value);
            const maxSec = parseTime(document.getElementById('max-time').value);

            if (minSec >= maxSec) { 
                alert("Max Duration must be strictly greater than Min Duration!"); 
                return; 
            }

            const ids = parseYouTubeUrl(url);
            if (!ids.videoId && !ids.listId) { 
                alert("Invalid YouTube URL"); 
                return; 
            }

            isPlaylist = !!ids.listId;
            document.getElementById('playlist-nav').style.display = isPlaylist ? 'flex' : 'none';
            document.getElementById('video-box').style.display = 'block';
            document.getElementById('play-btn').disabled = true;
            
            updateStatus("Loading Video...", "");
            prepareRandomTimer();

            const playerConfig = {
                playerVars: { 'start': startSec, 'autoplay': 1, 'controls': 1 },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            };

            if (player && typeof player.loadVideoById === 'function') {
                if (isPlaylist) {
                    player.loadPlaylist({list: ids.listId, listType: 'playlist', index: 0, startSeconds: startSec});
                    player.setShuffle(true);
                } else {
                    player.loadVideoById({videoId: ids.videoId, startSeconds: startSec});
                }
                startTracking();
            } else {
                if (isPlaylist) {
                    playerConfig.playerVars.listType = 'playlist';
                    playerConfig.playerVars.list = ids.listId;
                } else {
                    playerConfig.videoId = ids.videoId;
                }
                player = new YT.Player('player', playerConfig);
            }
        }

        function prepareRandomTimer() {
            const minSec = parseTime(document.getElementById('min-time').value);
            const maxSec = parseTime(document.getElementById('max-time').value);
            currentRandomDuration = Math.floor(Math.random() * (maxSec - minSec + 1)) + minSec;
        }

        function onPlayerReady(event) {
            if(isPlaylist) event.target.setShuffle(true);
            const startSec = parseTime(document.getElementById('start-time').value);
            event.target.seekTo(startSec);
            event.target.playVideo();
            startTracking();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (shouldSkipIntro) {
                    const startSec = parseTime(document.getElementById('start-time').value);
                    player.seekTo(startSec);
                    shouldSkipIntro = false; 
                    prepareRandomTimer();
                    startTracking();
                }
            } else if (event.data === YT.PlayerState.ENDED) {
                if(timerInterval) clearInterval(timerInterval);
                updateStatus("Finished.", "");
                document.getElementById('play-btn').disabled = false;
                document.getElementById('play-btn').innerText = "Play Again 🎵";
            }
        }

        function startTracking() {
            if (timerInterval) clearInterval(timerInterval);

            const startSec = parseTime(document.getElementById('start-time').value);
            let hasStarted = false;
            let targetTimestamp = 0;

            updateStatus("Buffering...", "");

            timerInterval = setInterval(() => {
                if (!player || !player.getCurrentTime) return;

                const currentTime = player.getCurrentTime();
                const playerState = player.getPlayerState();

                if (playerState === 1) { 
                    if (!hasStarted) {
                        if(Math.abs(currentTime - startSec) < 2 || currentTime > startSec) {
                            hasStarted = true;
                            targetTimestamp = startSec + currentRandomDuration;
                        }
                    }

                    if (hasStarted) {
                        updateStatus("Music is Playing... 🕺💃", "status-playing");

                        if (currentTime >= targetTimestamp) {
                            player.pauseVideo();
                            clearInterval(timerInterval);
                            
                            const playedTime = (currentTime - startSec).toFixed(1);
                            
                            updateStatus(`🛑 STOP! Find a chair!<br><span style="font-size:0.9rem; font-weight:400; opacity:0.8;">Played for ${playedTime}s</span>`, "status-stopped");
                            
                            const btn = document.getElementById('play-btn');
                            btn.disabled = false;
                            btn.innerText = "Next Round 🎵";
                        }
                    }
                }
            }, 100);
        }

        function nextVideo() {
            if(player && isPlaylist) {
                shouldSkipIntro = true; 
                player.nextVideo();
                updateUIForSkip();
            }
        }

        function prevVideo() {
            if(player && isPlaylist) {
                shouldSkipIntro = true;
                player.previousVideo();
                updateUIForSkip();
            }
        }

        function updateUIForSkip() {
            document.getElementById('play-btn').disabled = true;
            updateStatus("Skipping track...", "");
        }
    </script>
</body>
</html>
