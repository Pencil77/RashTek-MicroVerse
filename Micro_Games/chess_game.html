<!DOCTYPE html>
<html>
<head>
    <title>Chess Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 40px 30px; 
            border-radius: 16px; 
            width: 320px; 
            text-align: center; 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        h2 { margin-top: 0; font-weight: 600; font-size: 24px; letter-spacing: 1px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 12px 0; 
            border-radius: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #3b82f6; }
        input::placeholder { color: #ccc; }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            border: none; 
            color: white; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: 600; 
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .login-btn { 
            background: linear-gradient(135deg, #f39c12, #e67e22); 
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }
        .reg-btn { 
            background: linear-gradient(135deg, #2ecc71, #27ae60); 
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4);
        }
        .error { background: rgba(231, 76, 60, 0.2); color: #ff6b6b; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid rgba(231, 76, 60, 0.3); }
        .success { background: rgba(46, 204, 113, 0.2); color: #2ecc71; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid rgba(46, 204, 113, 0.3); }
    
        .game-nav {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;
            text-decoration: none;
            color: #fff;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: background 0.3s;
        }
        .game-nav:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <a href="index.html" class="game-nav">← Games</a>

    <div class="box">
        <h2>Termux Chess V3</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if msg %}<div class="success">{{ msg }}</div>{% endif %}
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" name="action" value="login" class="login-btn">Login</button>
            <button type="submit" name="action" value="register" class="reg-btn">Register</button>
        </form>
    </div>
</body>
</html>
