<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Mario Run | Microverse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #1CB5E0;
            --sky-bottom: #000046;
            --primary: #FF416C;
            --secondary: #FF4B2B;
            --ground: #38ef7d;
            --dirt: #11998e;
        }
        body {
            margin: 0;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            touch-action: none; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 65vh; 
            overflow: hidden;
            border-bottom: 6px solid #222;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas { display: block; }
        
        #controls {
            height: 35vh; 
            width: 100%;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(10px);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            padding: 20px 30px;
            box-sizing: border-box;
            align-items: center;
        }
        .btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            color: white;
            font-size: 30px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            height: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .btn:active { 
            background: rgba(255,255,255,0.25); 
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .dpad { display: flex; gap: 15px; grid-column: span 2; height: 80px;}
        .action-btn { 
            background: linear-gradient(45deg, var(--primary), var(--secondary)); 
            grid-column: 3; 
            border: none;
            height: 80px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            box-shadow: 0 8px 20px rgba(255, 75, 43, 0.4);
        }
        .action-btn:active { background: linear-gradient(45deg, var(--secondary), var(--primary)); }
        .arrow { flex: 1; height: 100%; }
        
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #score-board span { color: #f1c40f; }
        
        .overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
            color: white; font-family: 'Press Start 2P', cursive;
        }
        .overlay h1 { font-size: 24px; margin-bottom: 20px; text-shadow: 3px 3px 0 var(--primary); text-align: center; line-height: 1.5; }
        .overlay button {
            padding: 15px 30px; font-family: 'Press Start 2P', cursive;
            font-size: 14px; cursor: pointer; border: none;
            background: var(--ground); color: #000; border-radius: 8px;
            box-shadow: 0 5px 0 var(--dirt);
        }
        .overlay button:active { transform: translateY(5px); box-shadow: none; }
    
        .game-nav {
            position: fixed; top: 15px; right: 15px; z-index: 9999;
            text-decoration: none; color: #fff; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.25); padding: 8px 12px;
            border-radius: 20px; font-size: 12px; font-family: 'Poppins', sans-serif;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="game-nav">Exit</a>

    <div id="game-container">
        <div id="score-board">SCORE: <span id="coin-count">0</span></div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="game-over" class="overlay">
            <h1 id="go-msg">GAME OVER</h1>
            <button onclick="resetGame()">RESTART</button>
        </div>
    </div>

    <div id="controls">
        <div class="dpad">
            <div class="btn arrow" id="btn-left">◀</div>
            <div class="btn arrow" id="btn-right">▶</div>
        </div>
        <div class="btn action-btn" id="btn-jump">JUMP</div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    let viewWidth, viewHeight;
    function resize() {
        let container = document.getElementById('game-container');
        viewWidth = container.clientWidth;
        viewHeight = container.clientHeight;
        canvas.width = viewWidth;
        canvas.height = viewHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const GRAVITY = 0.55;
    const FRICTION = 0.82;
    const SPEED = 6;
    const JUMP_FORCE = 12.5;

    let keys = { right: false, left: false, up: false };

    let player = { x: 50, y: 100, width: 32, height: 32, velX: 0, velY: 0, grounded: false, squish: 1.0 };
    let camera = { x: 0 };
    let score = 0;
    let isGameOver = false;
    let particles = [];

    const tileSize = 40;
    const mapString = 
        "                                                                         5      " +
        "                                                                         1      " +
        "                 333                                                33   1      " +
        "                22222                                              2222  1      " +
        "                                222                  333                 1      " +
        "       3                      33   3                22222                1      " +
        "      222                    2222222                  4             4    1      " +
        "             4      33                        222    222           222   1      " +
        "111111111111111111111111  1111111111111111   11111111111111111111111111111111111";
    
    let platforms = [], coins = [], enemies = [], flag = null;
    const rows = 9, cols = mapString.length / rows;

    class MarioAudio {
        constructor() { this.ctx = null; }
        init() {
            if (!this.ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        }
        playJump() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(580, now + 0.16);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.16);
        }
        playCoin() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(987.77, now);
            osc.frequency.setValueAtTime(1318.51, now + 0.08);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.28);
        }
        playStomp() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now); osc.stop(now + 0.12);
        }
        playWin() {
            if (!this.ctx) return;
            [392, 523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                const now = this.ctx.currentTime + i * 0.1;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.25);
            });
        }
        playDie() {
            if (!this.ctx) return;
            [500, 400, 300, 200].forEach((f, i) => {
                const now = this.ctx.currentTime + i * 0.1;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.12);
            });
        }
    }
    const marioAudio = new MarioAudio();

    function initLevel() {
        platforms = []; coins = []; enemies = []; particles = [];
        score = 0; isGameOver = false;
        document.getElementById('coin-count').innerText = score;
        document.getElementById('game-over').style.display = 'none';
        
        let mapRows = [];
        for (let i = 0; i < rows; i++) mapRows.push(mapString.slice(i * cols, (i + 1) * cols));

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let type = mapRows[r][c];
                let x = c * tileSize;
                let y = viewHeight - ((rows - r) * tileSize); 

                if (type === '1' || type === '2') platforms.push({ x: x, y: y, width: tileSize, height: tileSize, type: type });
                else if (type === '3') coins.push({ x: x + 10, y: y + 10, width: 20, height: 20, active: true, float: Math.random()*Math.PI*2 });
                else if (type === '4') enemies.push({ x: x, y: y+8, width: 32, height: 32, velX: 1.5, startX: x });
                else if (type === '5') flag = { x: x, y: y, width: 10, height: tileSize * 8 }; 
            }
        }
    }

    function spawnParticles(x, y, color, count=10) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random()-0.5)*8, vy: (Math.random()-1)*8,
                life: 20 + Math.random()*20, color: color, size: 2+Math.random()*4
            });
        }
    }

    function update() {
        if (isGameOver) return;

        player.velY += GRAVITY;
        player.grounded = false;

        if (keys.right && player.velX < SPEED) player.velX += 1;
        if (keys.left && player.velX > -SPEED) player.velX -= 1;
        player.velX *= FRICTION;
        player.x += player.velX;
        
        platforms.forEach(p => {
            if (colCheck(player, p)) {
                if (player.velX > 0) player.x = p.x - player.width;
                else if (player.velX < 0) player.x = p.x + p.width;
                player.velX = 0;
            }
        });

        player.y += player.velY;
        platforms.forEach(p => {
            if (colCheck(player, p)) {
                if (player.velY > 0) { 
                    player.grounded = true; player.y = p.y - player.height; player.velY = 0;
                    if(player.squish === 1.0) player.squish = 0.7; // Landing squash
                } else if (player.velY < 0) { 
                    player.y = p.y + p.height; player.velY = 0; 
                }
            }
        });

        // Recover squish
        player.squish += (1.0 - player.squish) * 0.2;

        if (keys.up && player.grounded) {
            player.velY = -JUMP_FORCE;
            player.grounded = false;
            player.squish = 1.3; // Jump stretch
            marioAudio.init();
            marioAudio.playJump();
            spawnParticles(player.x + 16, player.y + 32, '#fff', 5);
        }

        // Camera interpolation for smooth follow
        let targetCamX = player.x - viewWidth / 2 + player.width / 2;
        if (targetCamX < 0) targetCamX = 0;
        camera.x += (targetCamX - camera.x) * 0.1;

        coins.forEach(c => {
            c.float += 0.1;
            c.y += Math.sin(c.float) * 0.5;
            if (c.active && colCheck(player, c)) {
                c.active = false;
                score += 100;
                marioAudio.playCoin();
                document.getElementById('coin-count').innerText = score;
                spawnParticles(c.x + 10, c.y + 10, '#f1c40f', 15);
            }
        });

        enemies.forEach(e => {
            e.x += e.velX;
            let hitWall = false;
            platforms.forEach(p => { if (colCheck(e, p)) hitWall = true; });
            if(hitWall || Math.abs(e.x - e.startX) > 150) e.velX *= -1;

            if (colCheck(player, e)) {
                if (player.velY > 0 && player.y < e.y + 16) {
                    e.y = 10000; 
                    player.velY = -8; 
                    score += 200;
                    marioAudio.playStomp();
                    document.getElementById('coin-count').innerText = score;
                    spawnParticles(e.x + 16, e.y, '#8B4513', 20);
                } else {
                    die("YOU DIED");
                }
            }
        });

        if (flag && colCheck(player, flag)) {
            die("LEVEL COMPLETE!<br>SCORE: " + score);
        }

        if (player.y > viewHeight + 50) die("YOU FELL");

        // Particles
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--;
            if(p.life <= 0) particles.splice(i,1);
        }
    }

    function die(msg) {
        if (isGameOver) return;
        isGameOver = true;
        if (msg.includes('COMPLETE')) {
            marioAudio.playWin();
        } else {
            marioAudio.playDie();
        }
        document.getElementById('go-msg').innerHTML = msg;
        document.getElementById('game-over').style.display = 'flex';
    }

    function colCheck(shapeA, shapeB) {
        return (shapeA.x < shapeB.x + shapeB.width && shapeA.x + shapeA.width > shapeB.x &&
                shapeA.y < shapeB.y + shapeB.height && shapeA.y + shapeA.height > shapeB.y);
    }

    function resetGame() {
        player.x = 50; player.y = 100; player.velX = 0; player.velY = 0;
        camera.x = 0;
        initLevel();
    }

    function draw() {
        // Sky Gradient (static background drawn on clear)
        let grad = ctx.createLinearGradient(0, 0, 0, viewHeight);
        grad.addColorStop(0, '#1CB5E0');
        grad.addColorStop(1, '#000046');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Clouds (parallax)
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        for(let i=0; i<5; i++) {
            ctx.beginPath();
            ctx.arc(((i*300 - camera.x*0.2) % (viewWidth+200)) - 100, 100 + (i%3)*40, 40, 0, Math.PI*2);
            ctx.arc(((i*300 - camera.x*0.2) % (viewWidth+200)) - 60, 100 + (i%3)*40, 50, 0, Math.PI*2);
            ctx.arc(((i*300 - camera.x*0.2) % (viewWidth+200)) - 20, 100 + (i%3)*40, 40, 0, Math.PI*2);
            ctx.fill();
        }

        ctx.save();
        ctx.translate(-Math.floor(camera.x), 0); 

        // Platforms
        platforms.forEach(p => {
            if(p.type === '1') {
                // Ground dirt with textured stone flecks
                ctx.fillStyle = '#8B5A2B';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                // Grass top with 3D overhang
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(p.x, p.y, p.width, 10);
                ctx.fillStyle = '#27ae60';
                for(let gx=p.x; gx<p.x+p.width; gx+=8) {
                    ctx.fillRect(gx, p.y+10, 4, 3);
                }
            } else {
                // Classic Super Mario Question Mark [?] Block
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(p.x+3, p.y+3, p.width-6, p.height-6);
                ctx.strokeStyle = '#d35400';
                ctx.lineWidth = 2;
                ctx.strokeRect(p.x+1, p.y+1, p.width-2, p.height-2);

                // 4 Corner Screws
                ctx.fillStyle = '#78350f';
                ctx.fillRect(p.x+4, p.y+4, 3, 3);
                ctx.fillRect(p.x+p.width-7, p.y+4, 3, 3);
                ctx.fillRect(p.x+4, p.y+p.height-7, 3, 3);
                ctx.fillRect(p.x+p.width-7, p.y+p.height-7, 3, 3);

                // Question Mark '?'
                ctx.fillStyle = '#78350f';
                ctx.font = 'bold 20px "Press Start 2P", monospace';
                ctx.fillText('?', p.x + 13, p.y + 28);
                ctx.fillStyle = '#ffffff';
                ctx.fillText('?', p.x + 11, p.y + 26);
            }
        });

        if (flag) {
            // Flagpole Base
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(flag.x - 10, flag.y + flag.height - 20, 30, 20);
            // Silver Pole
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(flag.x, flag.y, flag.width, flag.height - 20);
            // Golden Ball on top
            ctx.beginPath();
            ctx.arc(flag.x + 5, flag.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            // Red Pennant Flag
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(flag.x + 10, flag.y + 10);
            ctx.lineTo(flag.x + 55, flag.y + 25);
            ctx.lineTo(flag.x + 10, flag.y + 40);
            ctx.fill();
        }

        // Coins (Spinning Gold)
        coins.forEach(c => {
            if (c.active) {
                ctx.save();
                ctx.translate(c.x + 10, c.y + 10);
                const scaleX = Math.abs(Math.cos(c.float * 1.5));
                ctx.scale(Math.max(0.15, scaleX), 1);
                ctx.fillStyle = '#f1c40f';
                ctx.shadowColor = '#f39c12';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                // Inner rim
                ctx.strokeStyle = '#f39c12';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        });

        // Goombas (Authentic Mushroom Enemies)
        enemies.forEach(e => {
            ctx.save();
            ctx.translate(e.x + e.width/2, e.y + e.height/2);

            // Waddling Feet
            const legOffset = Math.sin(Date.now() * 0.01) * 3;
            ctx.fillStyle = '#2c1810';
            ctx.fillRect(-12, 10 + legOffset, 8, 6);
            ctx.fillRect(4, 10 - legOffset, 8, 6);

            // Brown Mushroom Cap
            ctx.beginPath();
            ctx.ellipse(0, -2, 16, 14, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#8B4513';
            ctx.fill();

            // Underside collar
            ctx.fillStyle = '#fce7b2';
            ctx.fillRect(-10, 4, 20, 8);

            // Angry Slanted Eyebrows & Eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-8, -2, 6, 8);
            ctx.fillRect(2, -2, 6, 8);

            // Black Pupils
            ctx.fillStyle = '#000000';
            const lookX = e.velX > 0 ? 1 : -1;
            ctx.fillRect(-7 + lookX, 0, 3, 5);
            ctx.fillRect(3 + lookX, 0, 3, 5);

            // Angry Eyebrows
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-9, -4); ctx.lineTo(-2, -1);
            ctx.moveTo(9, -4); ctx.lineTo(2, -1);
            ctx.stroke();

            ctx.restore();
        });

        // Super Mario Character
        ctx.save();
        ctx.translate(player.x + player.width/2, player.y + player.height);
        ctx.scale(1/player.squish, player.squish);

        const dir = player.velX > 0 ? 1 : (player.velX < 0 ? -1 : 1);
        ctx.scale(dir, 1);

        // Brown Shoes
        ctx.fillStyle = '#5c2d12';
        ctx.fillRect(-12, -6, 10, 6);
        ctx.fillRect(2, -6, 10, 6);

        // Blue Overalls & Red Shirt
        ctx.fillStyle = '#2563eb'; // Blue overalls
        ctx.fillRect(-10, -20, 20, 15);
        ctx.fillStyle = '#dc2626'; // Red shirt sleeves
        ctx.fillRect(-13, -20, 4, 10);
        ctx.fillRect(9, -20, 4, 10);

        // Yellow Overalls Buttons
        ctx.fillStyle = '#facc15';
        ctx.fillRect(-6, -17, 3, 3);
        ctx.fillRect(3, -17, 3, 3);

        // Peach Skin Face
        ctx.fillStyle = '#fbcfe8';
        ctx.fillRect(-8, -28, 16, 10);

        // Round Nose
        ctx.fillStyle = '#f472b6';
        ctx.beginPath();
        ctx.arc(6, -24, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Iconic Black Mustache
        ctx.fillStyle = '#000000';
        ctx.fillRect(-2, -22, 10, 4);

        // Eyes
        ctx.fillStyle = '#000000';
        ctx.fillRect(2, -27, 3, 4);

        // Red Mario Cap with Front Bill
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(-10, -32, 18, 6);
        ctx.fillRect(0, -30, 14, 4); // Visor bill

        ctx.restore();

        // Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 40;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.globalAlpha = 1.0;

        ctx.restore();
        requestAnimationFrame(loop);
    }

    function loop() {
        update();
        draw();
    }

    function setupControls(id, key) {
        const el = document.getElementById(id);
        const press = (e) => { e.preventDefault(); keys[key] = true; };
        const release = (e) => { e.preventDefault(); keys[key] = false; };
        el.addEventListener('touchstart', press);
        el.addEventListener('touchend', release);
        el.addEventListener('mousedown', press);
        el.addEventListener('mouseup', release);
        el.addEventListener('mouseleave', release);
    }

    setupControls('btn-left', 'left');
    setupControls('btn-right', 'right');
    setupControls('btn-jump', 'up');

    // Keyboard support for testing
    window.addEventListener('keydown', e => {
        if(e.code === 'ArrowLeft') keys.left = true;
        if(e.code === 'ArrowRight') keys.right = true;
        if(e.code === 'ArrowUp' || e.code === 'Space') keys.up = true;
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'ArrowLeft') keys.left = false;
        if(e.code === 'ArrowRight') keys.right = false;
        if(e.code === 'ArrowUp' || e.code === 'Space') keys.up = false;
    });

    initLevel();
    requestAnimationFrame(loop);

</script>
