<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Save the Dog - MicroVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #74ebd5;
            --bg-alt: #9face6;
            --primary: #ff6b6b;
            --dark: #2d3436;
            --light: #f5f6fa;
            --success: #2ecc71;
            --warning: #f1c40f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-alt) 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-nav {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            text-decoration: none;
            color: var(--dark);
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .game-nav:hover {
            background: rgba(255,255,255,0.7);
            transform: translateY(-2px);
        }

        canvas {
            display: block;
            touch-action: none; /* Prevent scroll on touch */
            width: 100%;
            height: 100%;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .hint {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: #fff;
            text-shadow: 2px 2px 0px var(--dark), -2px -2px 0px var(--dark), 2px -2px 0px var(--dark), -2px 2px 0px var(--dark);
            text-align: center;
            animation: bounce 2s infinite;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }

        .timer-container {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 150px;
            height: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border: 2px solid #fff;
            display: none;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #timer-bar {
            height: 100%;
            background: var(--warning);
            width: 100%;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .level-indicator {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.8);
            color: var(--dark);
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            pointer-events: auto;
            backdrop-filter: blur(10px);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 4px solid var(--light);
        }

        @keyframes popIn {
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        .modal h2 { margin-bottom: 15px; font-size: 3rem; font-weight: 700; }
        .modal p { font-size: 1.2rem; margin-bottom: 25px; color: #555; }
        
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-win { background: linear-gradient(135deg, var(--success), #27ae60); }
        .btn-lose { background: linear-gradient(135deg, var(--primary), #e74c3c); }

    </style>
</head>
<body>
    <a href="index.html" class="game-nav">← Back</a>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="level-indicator">Level <span id="lvl-num">1</span></div>
        <div class="hint" id="hint">Draw a line to protect Doge! ✍️</div>
        
        <div class="timer-container" id="timer-box">
            <div id="timer-bar"></div>
        </div>

        <div class="modal" id="modal">
            <h2 id="m-title">Result</h2>
            <p id="m-msg">Message</p>
            <button class="btn" id="m-btn">Next</button>
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Body = Matter.Body,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Vector = Matter.Vector;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let W = window.innerWidth;
    let H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;

    const engine = Engine.create();
    const world = engine.world;
    const runner = Runner.create();

    // --- GAME STATE ---
    let isDrawing = false;
    let points = [];
    let lineBody = null;
    
    let doge, hive;
    let bees = [];
    let walls = [];
    
    let hasStarted = false;
    let gameOver = false;
    let timeLeft = 10; 
    let currentLevel = 1;

    // Level Designs (Relative coordinates 0-1)
    const levels = [
        {
            dog: {x: 0.5, y: 0.8},
            hive: {x: 0.5, y: 0.2},
            walls: [
                {x: 0.5, y: 0.9, w: 0.4, h: 0.05}, // Floor
            ]
        },
        {
            dog: {x: 0.3, y: 0.7},
            hive: {x: 0.8, y: 0.2},
            walls: [
                {x: 0.3, y: 0.8, w: 0.3, h: 0.05}, // Floor left
                {x: 0.5, y: 0.6, w: 0.05, h: 0.3}, // Center wall
            ]
        },
        {
            dog: {x: 0.5, y: 0.6},
            hive: {x: 0.5, y: 0.1},
            walls: [
                {x: 0.5, y: 0.7, w: 0.3, h: 0.05}, // Platform
                {x: 0.5, y: 0.95, w: 1, h: 0.1}, // Lava floor (if dog falls off)
            ]
        }
    ];

    function initLevel(lvlIdx) {
        // Clear previous
        Composite.clear(world);
        Engine.clear(engine);
        points = [];
        bees = [];
        walls = [];
        lineBody = null;
        hasStarted = false;
        gameOver = false;
        timeLeft = 10;
        
        document.getElementById('modal').style.display = 'none';
        document.getElementById('hint').style.display = 'block';
        document.getElementById('timer-box').style.display = 'none';
        document.getElementById('timer-bar').style.width = "100%";
        document.getElementById('timer-bar').style.backgroundColor = "var(--warning)";
        document.getElementById('lvl-num').innerText = lvlIdx;

        const data = levels[lvlIdx - 1];

        // 1. Create Walls
        data.walls.forEach(w => {
            const wall = Bodies.rectangle(w.x * W, w.y * H, w.w * W, w.h * H, { 
                isStatic: true,
                render: { fillStyle: 'rgba(255,255,255,0.5)' }
            });
            walls.push(wall);
            Composite.add(world, wall);
        });

        // Add screen boundaries
        const boundProps = { isStatic: true, render: { visible: false } };
        Composite.add(world, [
            Bodies.rectangle(W/2, -50, W*2, 100, boundProps),
            Bodies.rectangle(-50, H/2, 100, H*2, boundProps),
            Bodies.rectangle(W+50, H/2, 100, H*2, boundProps),
            // Bottom boundary is open for falling out
        ]);

        // 2. Create Doge 
        doge = Bodies.circle(data.dog.x * W, data.dog.y * H, 25, {
            isStatic: true, 
            label: 'Doge',
            restitution: 0.5,
            density: 0.05
        });
        Composite.add(world, doge);

        // 3. Hive Position
        hive = { x: data.hive.x * W, y: data.hive.y * H };
    }

    // --- INPUT (DRAWING) ---
    function getCoords(e) {
        return {
            x: e.touches ? e.touches[0].clientX : e.clientX,
            y: e.touches ? e.touches[0].clientY : e.clientY
        };
    }

    function startDraw(e) {
        if(hasStarted || gameOver) return;
        isDrawing = true;
        points.push(getCoords(e));
    }

    function moveDraw(e) {
        if(!isDrawing) return;
        const pos = getCoords(e);
        const last = points[points.length-1];
        
        if(Math.hypot(pos.x - last.x, pos.y - last.y) > 10) {
            points.push(pos);
        }
    }

    function endDraw() {
        if(!isDrawing) return;
        isDrawing = false;
        
        if(points.length > 2) {
            const parts = [];
            for(let i=0; i<points.length-1; i++) {
                const p1 = points[i];
                const p2 = points[i+1];
                const cx = (p1.x + p2.x)/2;
                const cy = (p1.y + p2.y)/2;
                const len = Math.hypot(p2.x-p1.x, p2.y-p1.y);
                const ang = Math.atan2(p2.y-p1.y, p2.x-p1.x);
                
                parts.push(Bodies.rectangle(cx, cy, len + 5, 12, { angle: ang }));
            }
            
            lineBody = Body.create({
                parts: parts,
                restitution: 0.1,
                friction: 0.8,
                density: 0.01,
                label: 'Line'
            });
            Composite.add(world, lineBody);
            
            startGame();
        }
    }

    // --- GAME LOGIC ---
    function startGame() {
        hasStarted = true;
        document.getElementById('hint').style.display = 'none';
        document.getElementById('timer-box').style.display = 'block';

        Body.setStatic(doge, false);
        
        const tInt = setInterval(() => {
            if(gameOver) { clearInterval(tInt); return; }
            timeLeft -= 0.1;
            
            const p = (timeLeft / 10) * 100;
            const tBar = document.getElementById('timer-bar');
            tBar.style.width = p + "%";
            
            if(p < 30) tBar.style.backgroundColor = "var(--primary)";
            
            if(timeLeft <= 0) endGame(true);
        }, 100);

        let beeCount = 0;
        const bInt = setInterval(() => {
            if(gameOver || timeLeft <= 0 || beeCount > 25 + currentLevel*5) { clearInterval(bInt); return; }
            
            const b = Bodies.circle(hive.x, hive.y + 20, 10, { 
                restitution: 0.8, 
                frictionAir: 0.05,
                density: 0.001,
                label: 'Bee'
            });
            
            const dir = Vector.sub(doge.position, hive);
            Body.applyForce(b, b.position, Vector.mult(Vector.normalise(dir), 0.005));
            
            bees.push(b);
            Composite.add(world, b);
            beeCount++;
        }, 200);
    }

    // --- CUSTOM RENDER LOOP ---
    function draw() {
        ctx.clearRect(0, 0, W, H);

        // 1. Draw Walls
        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
        ctx.lineWidth = 4;
        walls.forEach(w => {
            ctx.beginPath();
            const v = w.vertices;
            ctx.moveTo(v[0].x, v[0].y);
            for(let i=1; i<v.length; i++) ctx.lineTo(v[i].x, v[i].y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        });

        // 2. Draw Doge
        const dPos = doge.position;
        ctx.font = "45px Arial";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.save();
        ctx.translate(dPos.x, dPos.y);
        ctx.rotate(doge.angle);
        ctx.fillText(gameOver && timeLeft > 0 ? "😵" : (timeLeft<=0?"😎":"🐶"), 0, 0);
        ctx.restore();

        // 3. Draw Hive
        ctx.font = "60px Arial";
        ctx.fillText("🪹", hive.x, hive.y);

        // 4. Draw Bees
        ctx.font = "25px Arial";
        bees.forEach(b => {
            ctx.save();
            ctx.translate(b.position.x, b.position.y);
            
            // Wobble effect
            if(!gameOver) {
                const speed = Vector.magnitude(b.velocity);
                ctx.rotate(Math.sin(Date.now()/50 + b.id) * 0.2 * speed);
            }
            
            ctx.fillText("🐝", 0, 0);
            ctx.restore();
            
            // Homing Physics
            if(hasStarted && !gameOver) {
                const dir = Vector.sub(doge.position, b.position);
                Body.applyForce(b, b.position, Vector.mult(Vector.normalise(dir), 0.00008 + (currentLevel*0.00002)));
            }
        });

        // 5. Draw Player Line
        if(lineBody) {
            ctx.fillStyle = "#2d3436";
            lineBody.parts.forEach((p, idx) => {
                if(idx === 0) return; // Skip composite parent body
                ctx.beginPath();
                const v = p.vertices;
                ctx.moveTo(v[0].x, v[0].y);
                for(let i=1; i<v.length; i++) ctx.lineTo(v[i].x, v[i].y);
                ctx.fill();
            });
        }
        
        // 6. Draw Current Drawing Stroke (Before physics)
        if(isDrawing && points.length > 1) {
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = "#2d3436";
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for(let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
        }

        requestAnimationFrame(draw);
    }

    // --- COLLISION & ENDING ---
    Events.on(engine, 'collisionStart', evt => {
        if(gameOver) return;
        evt.pairs.forEach(p => {
            const A = p.bodyA.label, B = p.bodyB.label;
            if((A==='Doge' && B==='Bee') || (B==='Doge' && A==='Bee')) endGame(false);
        });
    });

    Events.on(engine, 'beforeUpdate', () => {
        if(!gameOver && doge.position.y > H + 100) endGame(false, "Fell out of world!");
    });

    function endGame(win, reason = "") {
        if(gameOver) return;
        gameOver = true;
        const m = document.getElementById('modal');
        const t = document.getElementById('m-title');
        const msg = document.getElementById('m-msg');
        const btn = document.getElementById('m-btn');
        
        m.style.display = 'block';
        if(win) {
            t.innerText = "SAFE!"; 
            t.style.color = "var(--success)";
            msg.innerText = "Doge survived the swarm!";
            btn.innerText = currentLevel >= levels.length ? "Play Again" : "Next Level";
            btn.className = "btn btn-win";
            btn.onclick = () => { 
                currentLevel++; 
                if(currentLevel > levels.length) currentLevel = 1; 
                initLevel(currentLevel); 
            };
        } else {
            t.innerText = "OUCH!"; 
            t.style.color = "var(--primary)";
            msg.innerText = reason || "The bees got him!";
            btn.innerText = "Retry";
            btn.className = "btn btn-lose";
            btn.onclick = () => initLevel(currentLevel);
        }
    }

    // Resize handling
    window.addEventListener('resize', () => {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        // Don't auto re-init level, just let the physics world scale slightly oddly for now, 
        // to prevent game resets mid-play on mobile rotation
    });

    // --- EVENT LISTENERS ---
    window.addEventListener('mousedown', startDraw);
    window.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    
    // Support touch devices
    canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); startDraw(e); }, {passive:false});
    canvas.addEventListener('touchmove', (e)=>{ e.preventDefault(); moveDraw(e); }, {passive:false});
    canvas.addEventListener('touchend', (e)=>{ e.preventDefault(); endDraw(e); }, {passive:false});

    // START
    Runner.run(runner, engine);
    initLevel(1);
    draw(); 

</script>
</body>
</html>
