<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GTA: Vice City 3D - 80s Miami Drive | MicroVerse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- Three.js r128 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --vice-pink: #ff2a8d;
            --vice-cyan: #00f0ff;
            --vice-yellow: #ffd000;
            --vice-purple: #7a1fd6;
            --vice-green: #38ef7d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background: #080314;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        /* 80s CRT Scanline Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 26, 0) 50%, rgba(0, 0, 0, 0.18) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* Top HUD */
        .hud-top {
            position: absolute;
            top: 16px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 20;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .game-nav {
            background: rgba(14, 8, 30, 0.85);
            border: 2px solid var(--vice-pink);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 42, 141, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .game-nav:hover, .game-nav:active {
            background: var(--vice-pink);
            color: #000;
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(255, 42, 141, 0.8);
        }

        .cash-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            color: var(--vice-green);
            text-shadow: 3px 3px 0 #000, 0 0 12px rgba(56, 239, 125, 0.7);
            letter-spacing: 2px;
        }

        /* Health & Armor Bars */
        .stat-bars {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .bar-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .bar-icon { font-size: 14px; }

        .bar-outer {
            width: 75px;
            height: 10px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-inner {
            height: 100%;
            width: 100%;
            transition: width 0.2s ease;
        }

        .bar-hp { background: linear-gradient(90deg, #ff2a5f, #ff6b8b); }
        .bar-armor { background: linear-gradient(90deg, #00f0ff, #70f7ff); }

        /* Speedometer & Gear HUD */
        .speed-hud {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: var(--vice-cyan);
            text-shadow: 0 0 10px var(--vice-cyan);
            margin-top: 4px;
        }

        /* Wanted Stars */
        .wanted-stars {
            font-size: 22px;
            letter-spacing: 4px;
            color: #4a4e69;
            text-shadow: 2px 2px 0 #000;
        }

        .wanted-star.active {
            color: var(--vice-yellow);
            text-shadow: 0 0 14px var(--vice-yellow), 2px 2px 0 #000;
            animation: pulseStar 0.8s infinite alternate;
        }

        @keyframes pulseStar {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* Radio Station Banner */
        #radio-banner {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 42, 141, 0.9), rgba(122, 31, 214, 0.9));
            border: 2px solid var(--vice-cyan);
            border-radius: 20px;
            padding: 6px 22px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 25;
        }

        #radio-banner.show { opacity: 1; }

        /* Minimap Radar */
        #radar-canvas {
            position: absolute;
            bottom: 22px;
            left: 22px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--vice-pink);
            background: rgba(10, 4, 22, 0.88);
            box-shadow: 0 0 25px rgba(255, 42, 141, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 20;
        }

        /* Driving Controls for Mobile */
        .driving-controls {
            position: absolute;
            bottom: 22px;
            right: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
            pointer-events: auto;
        }

        .pedal-group {
            display: flex;
            gap: 12px;
        }

        .btn-pedal {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(18, 12, 36, 0.88);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            transition: all 0.15s;
        }

        .btn-pedal:active { transform: scale(0.92); }

        .btn-gas {
            border-color: var(--vice-green);
            color: var(--vice-green);
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.4);
        }
        .btn-gas:active { background: rgba(56, 239, 125, 0.35); }

        .btn-brake {
            border-color: var(--vice-pink);
            color: var(--vice-pink);
            box-shadow: 0 0 20px rgba(255, 42, 141, 0.4);
        }
        .btn-brake:active { background: rgba(255, 42, 141, 0.35); }

        .btn-handbrake {
            border-color: var(--vice-yellow);
            color: var(--vice-yellow);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            align-self: flex-end;
        }

        .btn-top-action {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-small {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(18, 12, 36, 0.85);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-radio { border-color: var(--vice-cyan); color: var(--vice-cyan); }
        .btn-camera { border-color: var(--vice-yellow); color: var(--vice-yellow); }

        /* Mobile Steering Buttons */
        .steer-controls {
            position: absolute;
            bottom: 22px;
            left: 145px;
            display: flex;
            gap: 12px;
            z-index: 30;
            pointer-events: auto;
        }

        .btn-steer {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: rgba(255, 42, 141, 0.2);
            border: 2px solid var(--vice-pink);
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 42, 141, 0.3);
            cursor: pointer;
        }

        .btn-steer:active { background: rgba(255, 42, 141, 0.6); transform: scale(0.92); }

        /* Wasted Screen */
        #wasted-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 2, 8, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 100;
        }

        #wasted-screen.show { opacity: 1; pointer-events: auto; }

        .wasted-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 48px;
            color: #ff0055;
            text-shadow: 0 0 30px #ff0055, 4px 4px 0 #000;
            letter-spacing: 6px;
            margin-bottom: 24px;
        }

        .respawn-btn {
            background: linear-gradient(135deg, var(--vice-pink), var(--vice-purple));
            color: #fff;
            border: 2px solid var(--vice-cyan);
            border-radius: 12px;
            padding: 14px 34px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 42, 141, 0.6);
            text-transform: uppercase;
        }
    </style>
</head>

<script>
/**
 * GTA: VICE CITY 3D - 80s MIAMI OPEN-WORLD DRIVE
 * Built for RashTek MicroVerse
 * Real 3D WebGL (Three.js) Chase Camera, Physics & Miami Sunset Strip
 */

// --- 80s SYNTHWAVE AUDIO SYNTHESIZER ---
class SynthwaveAudio {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.radioStation = 0;
        this.stations = ['FLASH FM 102.5', 'WAVE 103 SYNTH', 'RADIO OFF'];
        this.timer = null;
        this.step = 0;
        this.bassNotes = [65.41, 73.42, 82.41, 98.00];
        this.engineOsc = null;
        this.engineGain = null;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.startRadio();
            this.initEngineSound();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    initEngineSound() {
        if (!this.ctx) return;
        this.engineOsc = this.ctx.createOscillator();
        this.engineGain = this.ctx.createGain();
        this.engineOsc.type = 'sawtooth';
        this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime);
        this.engineGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(350, this.ctx.currentTime);

        this.engineOsc.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);
        this.engineOsc.start();
    }

    setEngineSpeed(speedRatio) {
        if (!this.engineOsc || !this.ctx) return;
        const targetFreq = 50 + speedRatio * 180;
        this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.05);
    }

    startRadio() {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
            if (!this.enabled || this.radioStation === 2 || !this.ctx) return;
            this.playSynthBeat();
        }, 140);
    }

    playSynthBeat() {
        const now = this.ctx.currentTime;
        const noteIdx = Math.floor(this.step / 8) % this.bassNotes.length;
        const freq = this.bassNotes[noteIdx];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450 + (this.step % 4) * 80, now);
        filter.Q.value = 4.0;

        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);

        this.step = (this.step + 1) % 32;
    }

    nextRadio() {
        this.radioStation = (this.radioStation + 1) % this.stations.length;
        return this.stations[this.radioStation];
    }

    playCrash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    playScreech() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.15;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800, now);
        filter.Q.value = 5.0;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
    }
}

const synthAudio = new SynthwaveAudio();

// --- 3D VICE CITY ENGINE ---
class ViceCity3D {
    constructor() {
        this.canvas = document.getElementById('canvas3d');
        this.radarCanvas = document.getElementById('radar-canvas');
        this.radarCtx = this.radarCanvas.getContext('2d');

        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Three.js Core
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(65, this.width / this.height, 0.5, 2500);
        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(this.width, this.height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Game State
        this.cash = 25000;
        this.wantedLevel = 0;
        this.hp = 100;
        this.armor = 100;
        this.cameraMode = 0; // 0: Close Chase, 1: High Chase, 2: Hood/Bumper

        // Vehicle Physics & Entity
        this.car = {
            mesh: null,
            wheels: [],
            headlights: [],
            x: 0,
            y: 0.6,
            z: 0,
            angle: 0,
            speed: 0,
            maxSpeed: 82,
            accel: 28,
            handling: 2.4,
            friction: 0.965,
            brakeForce: 42,
            steerAngle: 0,
            driftFactor: 0
        };

        this.buildings = [];
        this.traffic = [];
        this.palmTrees = [];
        this.skidMarks = [];
        this.keys = {};

        this.lastTime = performance.now();

        this.initEnvironment();
        this.initRoads();
        this.initBuildings();
        this.initPalmTrees();
        this.initPlayerCar();
        this.initDOM();
        this.initEvents();

        this.animate();
    }

    initEnvironment() {
        // 80s Miami Sunset Sky Gradient & Fog
        this.scene.background = new THREE.Color(0x280e3b);
        this.scene.fog = new THREE.FogExp2(0x280e3b, 0.0018);

        // Ambient Light
        const ambientLight = new THREE.AmbientLight(0xff99bb, 0.7);
        this.scene.add(ambientLight);

        // Golden Miami Sunset Sun
        const sunLight = new THREE.DirectionalLight(0xffaa44, 1.4);
        sunLight.position.set(-300, 250, -400);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 50;
        sunLight.shadow.camera.far = 1200;
        sunLight.shadow.camera.left = -400;
        sunLight.shadow.camera.right = 400;
        sunLight.shadow.camera.top = 400;
        sunLight.shadow.camera.bottom = -400;
        this.scene.add(sunLight);

        // Neon City Accent Lights
        const neonPink = new THREE.PointLight(0xff007f, 1.2, 500);
        neonPink.position.set(120, 40, -100);
        this.scene.add(neonPink);

        const neonCyan = new THREE.PointLight(0x00f0ff, 1.2, 500);
        neonCyan.position.set(-120, 40, 200);
        this.scene.add(neonCyan);
    }

    initRoads() {
        // Ocean Drive Boulevard (Length: 3000m)
        const roadGeo = new THREE.PlaneGeometry(60, 3200);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181822, roughness: 0.85 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        this.scene.add(road);

        // Yellow Dashed Center Lane
        const dashGeo = new THREE.PlaneGeometry(0.8, 12);
        const dashMat = new THREE.MeshBasicMaterial({ color: 0xffd000 });
        for (let z = -1500; z < 1500; z += 24) {
            const dash = new THREE.Mesh(dashGeo, dashMat);
            dash.rotation.x = -Math.PI / 2;
            dash.position.set(0, 0.02, z);
            this.scene.add(dash);
        }

        // Sidewalks
        const curbMat = new THREE.MeshStandardMaterial({ color: 0x888899, roughness: 0.9 });
        const leftCurb = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, 3200), curbMat);
        leftCurb.position.set(-34, 0.3, 0);
        this.scene.add(leftCurb);

        const rightCurb = new THREE.Mesh(new THREE.BoxGeometry(8, 0.6, 3200), curbMat);
        rightCurb.position.set(34, 0.3, 0);
        this.scene.add(rightCurb);

        // Sandy Miami Beach (West of Road)
        const sandGeo = new THREE.PlaneGeometry(280, 3200);
        const sandMat = new THREE.MeshStandardMaterial({ color: 0xe5ba73, roughness: 0.95 });
        const sand = new THREE.Mesh(sandGeo, sandMat);
        sand.rotation.x = -Math.PI / 2;
        sand.position.set(178, -0.1, 0);
        sand.receiveShadow = true;
        this.scene.add(sand);

        // Ocean Water
        const oceanGeo = new THREE.PlaneGeometry(600, 3200);
        const oceanMat = new THREE.MeshStandardMaterial({ color: 0x006699, roughness: 0.2, metalness: 0.6 });
        const ocean = new THREE.Mesh(oceanGeo, oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.set(600, -0.4, 0);
        this.scene.add(ocean);
    }

    initBuildings() {
        const hotelNames = [
            { name: 'OCEAN VIEW HOTEL', color: 0xff2a8d, height: 75 },
            { name: 'THE MALIBU CLUB', color: 0x00f0ff, height: 60 },
            { name: 'VERCETTI TOWER', color: 0xffd000, height: 110 },
            { name: 'DOWNTOWN BANK', color: 0x38ef7d, height: 85 },
            { name: 'COLONEL PENTHOUSE', color: 0x7a1fd6, height: 95 }
        ];

        // Place 3D Art Deco Buildings along East Side (x = -75)
        let z = -1400;
        let idx = 0;
        while (z < 1400) {
            const hData = hotelNames[idx % hotelNames.length];
            const width = 60 + Math.random() * 20;
            const depth = 55 + Math.random() * 25;
            const height = hData.height + Math.random() * 20;

            const bGroup = new THREE.Group();

            // Main Building Mass
            const bMat = new THREE.MeshStandardMaterial({ color: 0x1f2233, roughness: 0.7 });
            const bMesh = new THREE.Mesh(new THREE.BoxGeometry(depth, height, width), bMat);
            bMesh.position.y = height / 2;
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            bGroup.add(bMesh);

            // Glowing Art Deco Neon Trim / Sign
            const neonMat = new THREE.MeshBasicMaterial({ color: hData.color });
            const neonTrim = new THREE.Mesh(new THREE.BoxGeometry(depth + 2, 2.5, width + 2), neonMat);
            neonTrim.position.y = height - 2;
            bGroup.add(neonTrim);

            const neonTrim2 = new THREE.Mesh(new THREE.BoxGeometry(depth + 2, 2.5, width + 2), neonMat);
            neonTrim2.position.y = height * 0.45;
            bGroup.add(neonTrim2);

            bGroup.position.set(-75, 0, z);
            this.scene.add(bGroup);

            this.buildings.push({
                x: -75,
                z: z,
                minX: -75 - depth/2,
                maxX: -75 + depth/2,
                minZ: z - width/2,
                maxZ: z + width/2
            });

            z += width + 25;
            idx++;
        }
    }

    initPalmTrees() {
        const createPalm = (x, z) => {
            const palmGroup = new THREE.Group();

            // Trunk (Segmented curve)
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3418, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.1, 18, 7), trunkMat);
            trunk.position.y = 9;
            trunk.castShadow = true;
            palmGroup.add(trunk);

            // Palm Leaf Fronds
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x059669, side: THREE.DoubleSide });
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2;
                const leafGeo = new THREE.PlaneGeometry(9, 3);
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                leaf.position.set(Math.cos(angle) * 3.5, 18.5, Math.sin(angle) * 3.5);
                leaf.rotation.y = -angle;
                leaf.rotation.x = Math.PI * 0.35;
                palmGroup.add(leaf);
            }

            palmGroup.position.set(x, 0, z);
            this.scene.add(palmGroup);
            this.palmTrees.push({ x, z, radius: 2.5 });
        };

        for (let z = -1400; z < 1400; z += 40) {
            createPalm(-34, z); // Left sidewalk palm
            createPalm(34, z);  // Boardwalk beach palm
        }
    }

    initPlayerCar() {
        // Detailed 3D Procedural Sports Car (Infernus / Wedge Supercar)
        const carGroup = new THREE.Group();

        // 1. Sleek 80s Wedge Chassis (Magenta / Vice Pink)
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff2a8d, roughness: 0.3, metalness: 0.5 });
        const bodyGeo = new THREE.BoxGeometry(4.2, 1.1, 9.2);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.8;
        body.castShadow = true;
        carGroup.add(body);

        // 2. Cockpit / Windshield Cabin
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 0.1, metalness: 0.8 });
        const cabinGeo = new THREE.BoxGeometry(3.6, 0.95, 4.4);
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.7, -0.4);
        cabin.castShadow = true;
        carGroup.add(cabin);

        // 3. Rear Spoiler
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x111118, roughness: 0.4 });
        const wing = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.25, 1.4), wingMat);
        wing.position.set(0, 1.8, 3.8);
        carGroup.add(wing);

        // 4. Glowing Headlights & Projections
        const lightGeo = new THREE.BoxGeometry(0.8, 0.3, 0.2);
        const lightMat = new THREE.MeshBasicMaterial({ color: 0xffea75 });

        const lLight = new THREE.Mesh(lightGeo, lightMat);
        lLight.position.set(-1.4, 0.85, -4.6);
        carGroup.add(lLight);

        const rLight = new THREE.Mesh(lightGeo, lightMat);
        rLight.position.set(1.4, 0.85, -4.6);
        carGroup.add(rLight);

        // Real 3D Headlight Spotlights projecting onto road
        const headSpot = new THREE.SpotLight(0xffea75, 2.5, 95, Math.PI * 0.25, 0.5);
        headSpot.position.set(0, 1.2, -4.5);
        headSpot.target.position.set(0, 0, -60);
        carGroup.add(headSpot);
        carGroup.add(headSpot.target);

        // 5. Taillights (Neon Red)
        const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
        const tailLight = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.3, 0.2), tailMat);
        tailLight.position.set(0, 0.9, 4.6);
        carGroup.add(tailLight);

        // 6. Wheels (4 Rotating Rubber Tires with Silver Rims)
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.85 });
        const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 });

        const createWheel = (x, z) => {
            const wGroup = new THREE.Group();
            const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.75, 16), wheelMat);
            tire.rotation.z = Math.PI / 2;
            tire.castShadow = true;
            wGroup.add(tire);

            const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.77, 10), rimMat);
            rim.rotation.z = Math.PI / 2;
            wGroup.add(rim);

            wGroup.position.set(x, 0.85, z);
            carGroup.add(wGroup);
            return wGroup;
        };

        this.car.wheels.push(createWheel(-2.0, -2.8)); // Front Left
        this.car.wheels.push(createWheel(2.0, -2.8));  // Front Right
        this.car.wheels.push(createWheel(-2.0, 2.8));   // Rear Left
        this.car.wheels.push(createWheel(2.0, 2.8));    // Rear Right

        carGroup.position.set(0, 0, 0);
        this.scene.add(carGroup);
        this.car.mesh = carGroup;
    }

    initDOM() {
        this.cashEl = document.getElementById('cash-val');
        this.hpBar = document.getElementById('hp-bar');
        this.armorBar = document.getElementById('armor-bar');
        this.speedEl = document.getElementById('speed-display');
        this.radioBanner = document.getElementById('radio-banner');
        this.wastedScreen = document.getElementById('wasted-screen');

        document.getElementById('btn-radio-toggle').addEventListener('click', () => {
            synthAudio.init();
            const station = synthAudio.nextRadio();
            this.showBanner(this.radioBanner, `📻 ${station}`);
        });

        document.getElementById('btn-camera').addEventListener('click', () => {
            this.cameraMode = (this.cameraMode + 1) % 3;
            const names = ['CHASE VIEW', 'HIGH ANGLE', 'HOOD CAM'];
            this.showBanner(this.radioBanner, `📹 ${names[this.cameraMode]}`);
        });

        document.getElementById('btn-respawn').addEventListener('click', () => {
            this.respawn();
        });

        // Touch Control Bindings
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); synthAudio.init(); this.keys[key] = true; };
            const end = (e) => { e.preventDefault(); this.keys[key] = false; };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        };

        bindBtn('btn-gas', 'w');
        bindBtn('btn-brake', 's');
        bindBtn('btn-steer-left', 'a');
        bindBtn('btn-steer-right', 'd');
        bindBtn('btn-handbrake', 'space');
    }

    initEvents() {
        window.addEventListener('resize', () => {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.camera.aspect = this.width / this.height;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(this.width, this.height);
        });

        window.addEventListener('keydown', (e) => {
            synthAudio.init();
            const k = e.key.toLowerCase();
            this.keys[k] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                this.keys['space'] = true;
            }
            if (k === 'c') {
                this.cameraMode = (this.cameraMode + 1) % 3;
            }
            if (k === 'r') {
                const station = synthAudio.nextRadio();
                this.showBanner(this.radioBanner, `📻 ${station}`);
            }
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            this.keys[k] = false;
            if (e.code === 'Space') this.keys['space'] = false;
        });
    }

    showBanner(el, text) {
        el.textContent = text;
        el.classList.add('show');
        clearTimeout(el.fadeTimer);
        el.fadeTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    respawn() {
        this.wastedScreen.classList.remove('show');
        this.car.x = 0;
        this.car.z = 0;
        this.car.speed = 0;
        this.car.angle = 0;
        this.hp = 100;
        this.armor = 100;
        this.cash = Math.max(0, this.cash - 2500);
        this.updateHUD();
    }

    // --- GAME ENGINE LOOP ---
    animate() {
        requestAnimationFrame(() => this.animate());
        const now = performance.now();
        const dt = Math.min((now - this.lastTime) / 1000, 0.05);
        this.lastTime = now;

        this.update(dt);
        this.renderer.render(this.scene, this.camera);
        this.renderRadar();
    }

    update(dt) {
        const c = this.car;

        // Input Polling
        const gas = this.keys['w'] || this.keys['arrowup'];
        const brake = this.keys['s'] || this.keys['arrowdown'];
        const left = this.keys['a'] || this.keys['arrowleft'];
        const right = this.keys['d'] || this.keys['arrowright'];
        const handbrake = this.keys['space'];

        // Acceleration & Braking
        if (gas) {
            c.speed = Math.min(c.maxSpeed, c.speed + c.accel * dt);
        } else if (brake) {
            c.speed = Math.max(-c.maxSpeed * 0.4, c.speed - c.brakeForce * dt);
        } else {
            c.speed *= Math.pow(c.friction, dt * 60);
            if (Math.abs(c.speed) < 0.2) c.speed = 0;
        }

        // Steering & Drift Dynamics
        let steerTarget = 0;
        if (left) steerTarget = 0.42;
        if (right) steerTarget = -0.42;

        c.steerAngle += (steerTarget - c.steerAngle) * 0.18;

        if (Math.abs(c.speed) > 1.0) {
            const dir = c.speed > 0 ? 1 : -1;
            const turnRate = c.handling * (handbrake ? 1.6 : 1.0);
            c.angle += c.steerAngle * turnRate * dt * dir;

            if (handbrake && Math.abs(c.speed) > 25) {
                synthAudio.playScreech();
                c.speed *= 0.985;
            }
        }

        // Rotate Front Wheels for visual steering
        if (c.wheels.length >= 2) {
            c.wheels[0].rotation.y = c.steerAngle * 1.2;
            c.wheels[1].rotation.y = c.steerAngle * 1.2;
        }

        // Spin Wheels based on velocity
        c.wheels.forEach(w => {
            w.children[0].rotation.x += (c.speed * dt * 0.8);
        });

        // Translate Vehicle Position in 3D Space
        // Forward is -Z in Three.js coordinates
        const moveDist = c.speed * dt;
        c.x -= Math.sin(c.angle) * moveDist;
        c.z -= Math.cos(c.angle) * moveDist;

        // Loop / Wrap City Road seamlessly
        if (c.z < -1400) c.z = 1380;
        if (c.z > 1400) c.z = -1380;

        // Road Curb Collision
        if (c.x > 38 || c.x < -38) {
            c.speed *= 0.65;
            c.x = Math.max(-38, Math.min(38, c.x));
            synthAudio.playCrash();
        }

        // Building Collision Checks
        for (let b of this.buildings) {
            if (c.x > b.minX - 2.5 && c.x < b.maxX + 2.5 && c.z > b.minZ - 4.5 && c.z < b.maxZ + 4.5) {
                c.speed = -c.speed * 0.5;
                synthAudio.playCrash();
                this.hp = Math.max(0, this.hp - 10);
                this.updateHUD();
                if (this.hp <= 0) this.wastedScreen.classList.add('show');
                break;
            }
        }

        // Update Car Mesh in Three.js
        c.mesh.position.set(c.x, c.y, c.z);
        c.mesh.rotation.y = c.angle;

        // Body roll / tilt during steering
        c.mesh.rotation.z = -c.steerAngle * 0.15 * Math.min(1.0, Math.abs(c.speed) / 30);

        // Update Engine Sound Audio pitch
        synthAudio.setEngineSpeed(Math.abs(c.speed) / c.maxSpeed);

        // Update 3D Chase Camera
        this.updateCamera(dt);
        this.updateHUD();
    }

    updateCamera(dt) {
        const c = this.car;

        let camDist = 18;
        let camHeight = 6.5;

        if (this.cameraMode === 1) { // High angle
            camDist = 26;
            camHeight = 16;
        } else if (this.cameraMode === 2) { // Hood / Bumper cam
            camDist = -2;
            camHeight = 2.4;
        }

        // Camera target behind car
        const targetCamX = c.x + Math.sin(c.angle) * camDist;
        const targetCamZ = c.z + Math.cos(c.angle) * camDist;
        const targetCamY = c.y + camHeight;

        // Smooth camera dampening
        this.camera.position.x += (targetCamX - this.camera.position.x) * 0.14;
        this.camera.position.y += (targetCamY - this.camera.position.y) * 0.14;
        this.camera.position.z += (targetCamZ - this.camera.position.z) * 0.14;

        // Look at point ahead of car
        const lookTarget = new THREE.Vector3(
            c.x - Math.sin(c.angle) * 15,
            c.y + 1.2,
            c.z - Math.cos(c.angle) * 15
        );
        this.camera.lookAt(lookTarget);
    }

    updateHUD() {
        this.cashEl.textContent = `$${this.cash.toString().padStart(8, '0')}`;
        this.hpBar.style.width = `${Math.max(0, this.hp)}%`;
        this.armorBar.style.width = `${Math.max(0, this.armor)}%`;
        const mph = Math.round(Math.abs(this.car.speed) * 1.5);
        this.speedEl.textContent = `${mph.toString().padStart(3, '0')} MPH`;
    }

    // --- CIRCULAR NEON RADAR MINIMAP ---
    renderRadar() {
        const rCtx = this.radarCtx;
        const rw = 110;
        const rh = 110;
        rCtx.clearRect(0, 0, rw, rh);

        // Dark radar background
        rCtx.fillStyle = 'rgba(12, 6, 26, 0.95)';
        rCtx.beginPath();
        rCtx.arc(rw/2, rh/2, rw/2 - 2, 0, Math.PI * 2);
        rCtx.fill();

        // Ocean Drive vertical strip on radar
        const scaleZ = rh / 3000;
        const scaleX = rw / 300;

        rCtx.strokeStyle = 'rgba(255, 42, 141, 0.35)';
        rCtx.lineWidth = 12;
        rCtx.beginPath();
        rCtx.moveTo(rw/2, 0);
        rCtx.lineTo(rw/2, rh);
        rCtx.stroke();

        // Player Arrow (Cyan neon triangle centered)
        rCtx.save();
        rCtx.translate(rw/2, rh/2);
        rCtx.rotate(-this.car.angle);

        rCtx.fillStyle = '#00f0ff';
        rCtx.shadowColor = '#00f0ff';
        rCtx.shadowBlur = 8;
        rCtx.beginPath();
        rCtx.moveTo(0, -7);
        rCtx.lineTo(5, 6);
        rCtx.lineTo(0, 4);
        rCtx.lineTo(-5, 6);
        rCtx.closePath();
        rCtx.fill();

        rCtx.restore();

        // Outer Neon Rim
        rCtx.strokeStyle = '#ff2a8d';
        rCtx.lineWidth = 2.5;
        rCtx.beginPath();
        rCtx.arc(rw/2, rh/2, rw/2 - 2, 0, Math.PI * 2);
        rCtx.stroke();
    }
}

// Start Game on load
window.addEventListener('load', () => {
    new ViceCity3D();
});
</script>
