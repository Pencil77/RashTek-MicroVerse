<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GTA: Vice City 3D - 80s Miami Open-World | MicroVerse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- Three.js r128 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --vice-pink: #ff2a8d;
            --vice-cyan: #00f0ff;
            --vice-yellow: #ffd000;
            --vice-purple: #7a1fd6;
            --vice-green: #38ef7d;
            --vice-blue: #0066ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background: #080314;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        /* 80s CRT Scanline Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 26, 0) 50%, rgba(0, 0, 0, 0.16) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        /* Top HUD */
        .hud-top {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 20;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .game-nav {
            background: rgba(14, 8, 30, 0.85);
            border: 2px solid var(--vice-pink);
            color: #fff;
            padding: 7px 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 900;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 42, 141, 0.4);
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .game-nav:hover, .game-nav:active {
            background: var(--vice-pink);
            color: #000;
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(255, 42, 141, 0.8);
        }

        .cash-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            color: var(--vice-green);
            text-shadow: 3px 3px 0 #000, 0 0 12px rgba(56, 239, 125, 0.7);
            letter-spacing: 2px;
        }

        /* Health, Armor, Nitro Bars */
        .stat-bars {
            display: flex;
            gap: 10px;
            margin-top: 3px;
        }

        .bar-wrap {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.65);
            padding: 4px 7px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .bar-icon { font-size: 13px; }

        .bar-outer {
            width: 70px;
            height: 9px;
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-inner {
            height: 100%;
            width: 100%;
            transition: width 0.15s ease;
        }

        .bar-hp { background: linear-gradient(90deg, #ff2a5f, #ff6b8b); }
        .bar-armor { background: linear-gradient(90deg, #00f0ff, #70f7ff); }
        .bar-nitro { background: linear-gradient(90deg, #ffd000, #ff8c00); }

        /* Speedometer & Vehicle Name */
        .speed-hud {
            font-family: 'Orbitron', sans-serif;
            font-size: 17px;
            font-weight: 900;
            color: var(--vice-cyan);
            text-shadow: 0 0 10px var(--vice-cyan);
        }

        /* Wanted Stars */
        .wanted-stars {
            font-size: 24px;
            letter-spacing: 4px;
            color: #383a52;
            text-shadow: 2px 2px 0 #000;
        }

        .wanted-star.active {
            color: var(--vice-yellow);
            text-shadow: 0 0 16px var(--vice-yellow), 2px 2px 0 #000;
            display: inline-block;
            animation: pulseStar 0.7s infinite alternate;
        }

        @keyframes pulseStar {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.22); filter: brightness(1.5); }
        }

        .vehicle-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--vice-cyan);
            text-shadow: 0 0 8px var(--vice-cyan), 2px 2px 0 #000;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* Notification Banners */
        #notification-banner {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 42, 141, 0.92), rgba(122, 31, 214, 0.92));
            border: 2px solid var(--vice-cyan);
            border-radius: 20px;
            padding: 6px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 25;
            white-space: nowrap;
        }

        #notification-banner.show { opacity: 1; }

        /* Minimap Radar */
        #radar-canvas {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            border: 3px solid var(--vice-pink);
            background: rgba(10, 4, 22, 0.9);
            box-shadow: 0 0 25px rgba(255, 42, 141, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 20;
        }

        /* Mobile Controls */
        .driving-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 30;
            pointer-events: auto;
        }

        .pedal-group {
            display: flex;
            gap: 10px;
        }

        .btn-pedal {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(18, 12, 36, 0.88);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            transition: all 0.12s;
        }

        .btn-pedal:active { transform: scale(0.92); }

        .btn-gas {
            border-color: var(--vice-green);
            color: var(--vice-green);
            box-shadow: 0 0 20px rgba(56, 239, 125, 0.4);
        }
        .btn-gas:active { background: rgba(56, 239, 125, 0.35); }

        .btn-brake {
            border-color: var(--vice-pink);
            color: var(--vice-pink);
            box-shadow: 0 0 20px rgba(255, 42, 141, 0.4);
        }
        .btn-brake:active { background: rgba(255, 42, 141, 0.35); }

        .btn-handbrake {
            border-color: var(--vice-yellow);
            color: var(--vice-yellow);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            align-self: flex-end;
        }

        .btn-nitro {
            border-color: #ff8c00;
            color: #ffd000;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            align-self: flex-end;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }
        .btn-nitro:active { background: rgba(255, 140, 0, 0.4); }

        .btn-top-action {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-small {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(18, 12, 36, 0.85);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-radio { border-color: var(--vice-cyan); color: var(--vice-cyan); }
        .btn-camera { border-color: var(--vice-yellow); color: var(--vice-yellow); }
        .btn-jack {
            border-color: #38ef7d;
            color: #38ef7d;
            width: 56px;
            height: 56px;
            box-shadow: 0 0 15px rgba(56, 239, 125, 0.4);
        }

        /* Mobile Steering Buttons */
        .steer-controls {
            position: absolute;
            bottom: 20px;
            left: 145px;
            display: flex;
            gap: 10px;
            z-index: 30;
            pointer-events: auto;
        }

        .btn-steer {
            width: 62px;
            height: 62px;
            border-radius: 16px;
            background: rgba(255, 42, 141, 0.2);
            border: 2px solid var(--vice-pink);
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 15px rgba(255, 42, 141, 0.3);
            cursor: pointer;
        }

        .btn-steer:active { background: rgba(255, 42, 141, 0.6); transform: scale(0.92); }

        /* Wasted / Busted Screens */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 100;
        }

        .overlay-screen.show { opacity: 1; pointer-events: auto; }

        #wasted-screen { background: rgba(18, 2, 8, 0.9); }
        #busted-screen { background: rgba(4, 12, 32, 0.92); }

        .overlay-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 46px;
            letter-spacing: 6px;
            margin-bottom: 24px;
        }

        .wasted-text {
            color: #ff0055;
            text-shadow: 0 0 35px #ff0055, 4px 4px 0 #000;
        }

        .busted-text {
            color: #00d2ff;
            text-shadow: 0 0 35px #00d2ff, 4px 4px 0 #000;
        }

        .respawn-btn {
            background: linear-gradient(135deg, var(--vice-pink), var(--vice-purple));
            color: #fff;
            border: 2px solid var(--vice-cyan);
            border-radius: 12px;
            padding: 14px 34px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 42, 141, 0.6);
            text-transform: uppercase;
        }

        /* Desktop Controls Cheat Sheet */
        .desktop-hints {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(10, 4, 22, 0.85);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 42, 141, 0.3);
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: #bbb;
            pointer-events: none;
            z-index: 20;
        }
        .desktop-hints span b { color: var(--vice-cyan); }

        @media (max-width: 768px) {
            .desktop-hints { display: none; }
            .cash-display { font-size: 18px; }
            .bar-outer { width: 55px; }
            .steer-controls { left: 135px; }
            .btn-steer { width: 54px; height: 54px; }
            .btn-pedal { width: 62px; height: 62px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="scanlines"></div>
    <canvas id="canvas3d"></canvas>
    <canvas id="radar-canvas" width="115" height="115"></canvas>

    <!-- Top HUD -->
    <div class="hud-top">
        <div class="hud-left">
            <a href="index.html" class="game-nav">← Microverse</a>
            <div class="cash-display" id="cash-val">$00025000</div>
            <div class="stat-bars">
                <div class="bar-wrap">
                    <span class="bar-icon">❤️</span>
                    <div class="bar-outer"><div id="hp-bar" class="bar-inner bar-hp"></div></div>
                </div>
                <div class="bar-wrap">
                    <span class="bar-icon">🛡️</span>
                    <div class="bar-outer"><div id="armor-bar" class="bar-inner bar-armor"></div></div>
                </div>
                <div class="bar-wrap">
                    <span class="bar-icon">⚡</span>
                    <div class="bar-outer"><div id="nitro-bar" class="bar-inner bar-nitro"></div></div>

        <div class="hud-right">

                <span class="wanted-star" id="star-1">★</span>
                <span class="wanted-star" id="star-2">★</span>
                <span class="wanted-star" id="star-3">★</span>
                <span class="wanted-star" id="star-4">★</span>
                <span class="wanted-star" id="star-5">★</span>
            </div>
            <div class="vehicle-badge" id="car-model-display">INFERNUS</div>

    <!-- Notification / Radio Banner -->
    <div id="notification-banner">📻 FLASH FM 102.5</div>

    <!-- Desktop Controls Helper -->
    <div class="desktop-hints">
        <span><b>WASD/Arrows</b>: Drive / Walk</span>
        <span><b>SPACE</b>: Drift / Jump</span>

    <!-- Mobile Steering Controls -->
    <div class="steer-controls">
        <div id="btn-steer-left" class="btn-steer">◀</div>

    <!-- Mobile Action & Pedals -->
    <div class="driving-controls">
        <div class="btn-top-action">
            <button id="btn-jack" class="btn-small btn-jack">🏃 JACK</button>
            <button id="btn-camera" class="btn-small btn-camera">📹 CAM</button>
            <button id="btn-radio-toggle" class="btn-small btn-radio">📻 FM</button>
        </div>
        <div class="pedal-group" style="justify-content: flex-end;">
            <button id="btn-nitro" class="btn-pedal btn-nitro">
                <span>🔥</span>
                <span>NITRO</span>
            </button>
            <button id="btn-handbrake" class="btn-pedal btn-handbrake">
                <span>⚡</span>
                <span id="handbrake-label">DRIFT</span>
            </button>
        </div>
        <div class="pedal-group">
            <button id="btn-brake" class="btn-pedal btn-brake">
                <span id="brake-icon">◀◀</span>
                <span id="brake-label">BRAKE</span>
            </button>
            <button id="btn-gas" class="btn-pedal btn-gas">
                <span id="gas-icon">▲▲</span>
                <span id="gas-label">GAS</span>
            </button>
        </div>
    </div>

    <!-- Wasted Screen -->
    <div id="wasted-screen" class="overlay-screen">
        <div class="overlay-title wasted-text">WASTED</div>
        <button id="btn-respawn-wasted" class="respawn-btn">Respawn at Ocean View</button>
    </div>

    <!-- Busted Screen -->
    <div id="busted-screen" class="overlay-screen">
        <div class="overlay-title busted-text">BUSTED</div>
        <button id="btn-respawn-busted" class="respawn-btn">Bail Out at VCPD</button>
    </div>
</div>

<script>
/**
 * GTA: VICE CITY 3D - 80s MIAMI OPEN WORLD
 * Authentic 3D WebGL (Three.js r128) Experience
 * - 3D Ocean Drive with Neon Art Deco Hotels & Sandy Miami Beach
 * - 3D Vehicles (Infernus, VCPD Cruiser, Taxi, Oceanic, Banshee)
 * - 3D Pedestrians with Animated Walk Cycles & Sidewalk Wandering
 * - Living AI Traffic Flow in North and South Lanes
 * - Car-Jacking & Disembark (Play as Tommy Vercetti on Foot)
 * - High-Speed Nitrous Boost with Camera FOV Warping & Exhaust Flames
 * - Dynamic VCPD Police Pursuit with Flashing Red/Blue Lightbars & Sirens
 * - 3D Collectibles (Spinning Cash Stacks & Police Bribes)
 * - 80s Synthwave Radio Engine & Interactive Web Audio Synthesizer
 */

// --- 80s SYNTHWAVE & SFX AUDIO ENGINE ---
class ViceCityAudio {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.radioStation = 0;
        this.stations = ['FLASH FM 102.5', 'WAVE 103 SYNTH', 'V-ROCK', 'RADIO OFF'];
        this.timer = null;
        this.step = 0;
        this.bassNotes = [65.41, 73.42, 82.41, 98.00, 65.41, 87.31];
        this.engineOsc = null;
        this.engineGain = null;
        this.sirenOsc = null;
        this.sirenGain = null;
        this.sirenTimer = null;
        this.sirenHigh = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.startRadio();
            this.initEngineSound();
            this.initSirenSound();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    initEngineSound() {
        if (!this.ctx) return;
        this.engineOsc = this.ctx.createOscillator();
        this.engineGain = this.ctx.createGain();
        this.engineOsc.type = 'sawtooth';
        this.engineOsc.frequency.setValueAtTime(55, this.ctx.currentTime);
        this.engineGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(320, this.ctx.currentTime);

        this.engineOsc.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);
        this.engineOsc.start();
    }

    setEngineSpeed(speedRatio, isDriving) {
        if (!this.engineOsc || !this.ctx) return;
        if (!isDriving) {
            this.engineGain.gain.setTargetAtTime(0.001, this.ctx.currentTime, 0.1);
            return;
        }
        this.engineGain.gain.setTargetAtTime(0.045, this.ctx.currentTime, 0.1);
        const targetFreq = 50 + speedRatio * 190;
        this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.05);
    }

    startRadio() {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
            if (!this.enabled || this.radioStation === 3 || !this.ctx) return;
            this.playSynthBeat();
        }, 135);
    }

    playSynthBeat() {
        const now = this.ctx.currentTime;
        const noteIdx = Math.floor(this.step / 8) % this.bassNotes.length;
        const freq = this.bassNotes[noteIdx];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = this.radioStation === 2 ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450 + (this.step % 4) * 90, now);
        filter.Q.value = 3.5;

        gain.gain.setValueAtTime(0.065, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.12);

        this.step = (this.step + 1) % 32;
    }

    nextRadio() {
        this.radioStation = (this.radioStation + 1) % this.stations.length;
        return this.stations[this.radioStation];
    }

    initSirenSound() {
        if (!this.ctx) return;
        this.sirenOsc = this.ctx.createOscillator();
        this.sirenGain = this.ctx.createGain();
        this.sirenOsc.type = 'sine';
        this.sirenOsc.frequency.setValueAtTime(650, this.ctx.currentTime);
        this.sirenGain.gain.setValueAtTime(0.0, this.ctx.currentTime);

        this.sirenOsc.connect(this.sirenGain);
        this.sirenGain.connect(this.ctx.destination);
        this.sirenOsc.start();
    }

    setSirenActive(active) {
        if (!this.sirenGain || !this.ctx) return;
        if (active) {
            this.sirenGain.gain.setTargetAtTime(0.06, this.ctx.currentTime, 0.2);
            if (!this.sirenTimer) {
                this.sirenTimer = setInterval(() => {
                    if (!this.ctx || !this.sirenOsc) return;
                    this.sirenHigh = !this.sirenHigh;
                    const freq = this.sirenHigh ? 880 : 620;
                    this.sirenOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.18);
                }, 400);
            }
        } else {
            this.sirenGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.2);
            if (this.sirenTimer) {
                clearInterval(this.sirenTimer);
                this.sirenTimer = null;
            }
        }
    }

    playCrash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.26);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.26);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
    }

    playScreech() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1900, now);
        filter.Q.value = 5.0;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
    }

    playCashChime() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.12, now + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.05);
            osc.stop(now + idx * 0.05 + 0.18);
        });
    }

    playBribeSound() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    playCarJack() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Heavy door slam
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.2);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
    }

    playPedHit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
    }

    playNitroSound() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.25);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }
}

// --- 3D VICE CITY OPEN-WORLD ENGINE ---
class ViceCity3D {

            speed: 0,

            angle: 0,

            walkSpeed: 14,

        this.initPedestrians();

    initEnvironment() {
        // 80s Miami Sunset Sky Gradient & Fog
        this.scene.background = new THREE.Color(0x280e3b);
        this.scene.fog = new THREE.FogExp2(0x280e3b, 0.0016);

        // Ambient Light

        // Miami Sunset Directional Light

    initBuildings() {
        const hotelData = [
            { name: 'OCEAN VIEW HOTEL', color: 0xff2a8d, height: 75 },
            { name: 'THE MALIBU CLUB', color: 0x00f0ff, height: 85 },
            { name: 'VERCETTI TOWER', color: 0xffd000, height: 110 },
            { name: 'DOWNTOWN BANK', color: 0x38ef7d, height: 95 },
            { name: 'COLONEL PENTHOUSE', color: 0x9b51e0, height: 80 }
        ];

        let zIndex = -1300;
        let count = 0;
        while (zIndex < 1300) {
            const h = hotelData[count % hotelData.length];
            const width = 45 + (count % 3) * 15;
            const depth = 55;
            const height = h.height + ((count * 7) % 25);

            // Hotel Main Body
            const bGeo = new THREE.BoxGeometry(depth, height, width);
            const bMat = new THREE.MeshStandardMaterial({
                color: (count % 2 === 0) ? 0x221c35 : 0x181428,
                roughness: 0.8
            });
            const bMesh = new THREE.Mesh(bGeo, bMat);
            bMesh.position.set(-68, height / 2, zIndex + width / 2);
            bMesh.castShadow = true;
            bMesh.receiveShadow = true;
            this.scene.add(bMesh);

            // Glowing Neon Trim on Rooftop
            const neonTrimGeo = new THREE.BoxGeometry(depth + 1, 1.8, width + 1);
            const neonTrimMat = new THREE.MeshBasicMaterial({ color: h.color });
            const neonTrim = new THREE.Mesh(neonTrimGeo, neonTrimMat);
            neonTrim.position.set(-68, height, zIndex + width / 2);
            this.scene.add(neonTrim);

            // Neon Signboard facing road
            const signGeo = new THREE.PlaneGeometry(width * 0.7, 5.5);
            const signCanvas = document.createElement('canvas');
            signCanvas.width = 512;
            signCanvas.height = 128;
            const sCtx = signCanvas.getContext('2d');
            sCtx.fillStyle = '#0a0518';
            sCtx.fillRect(0, 0, 512, 128);
            sCtx.strokeStyle = '#' + h.color.toString(16).padStart(6, '0');
            sCtx.lineWidth = 8;
            sCtx.strokeRect(6, 6, 500, 116);
            sCtx.font = 'bold 36px sans-serif';
            sCtx.fillStyle = '#' + h.color.toString(16).padStart(6, '0');
            sCtx.textAlign = 'center';
            sCtx.textBaseline = 'middle';
            sCtx.fillText(h.name, 256, 64);

            const signTex = new THREE.CanvasTexture(signCanvas);
            const signMat = new THREE.MeshBasicMaterial({ map: signTex, transparent: true });
            const signMesh = new THREE.Mesh(signGeo, signMat);
            signMesh.position.set(-41.8, height * 0.45, zIndex + width / 2);
            signMesh.rotation.y = Math.PI / 2;
            this.scene.add(signMesh);

            // Building Bounding Box for Collision
            this.buildings.push({
                minX: -68 - depth / 2,
                maxX: -68 + depth / 2,
                minZ: zIndex,
                maxZ: zIndex + width
            });

            zIndex += width + 28;
            count++;
        }
    }

    initPalmTrees() {
        const createPalm = (x, z) => {
            const palmGroup = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3418, roughness: 0.9 });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 1.1, 18, 7), trunkMat);
            trunk.position.y = 9;
            trunk.castShadow = true;
            palmGroup.add(trunk);

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x059669, side: THREE.DoubleSide });
            for (let i = 0; i < 7; i++) {
                const angle = (i / 7) * Math.PI * 2;
                const leaf = new THREE.Mesh(new THREE.PlaneGeometry(9, 3), leafMat);
                leaf.position.set(Math.cos(angle) * 3.5, 18.5, Math.sin(angle) * 3.5);
                leaf.rotation.y = -angle;
                leaf.rotation.x = Math.PI * 0.35;
                palmGroup.add(leaf);
            }

            palmGroup.position.set(x, 0, z);
            this.scene.add(palmGroup);
            this.palmTrees.push({ x, z, radius: 2.5 });
        };

        for (let z = -1400; z < 1400; z += 40) {
            createPalm(-35, z);
            createPalm(35, z);
        }
    }

        this.bannerEl = document.getElementById('notification-banner');
        this.carModelEl = document.getElementById('car-model-display');
        this.wastedScreen = document.getElementById('wasted-screen');
        this.bustedScreen = document.getElementById('busted-screen');

        this.brakeLabel = document.getElementById('brake-label');
        this.handbrakeLabel = document.getElementById('handbrake-label');

            audio.init();
            const station = audio.nextRadio();

        });

            this.cameraMode = (this.cameraMode + 1) % 3;

        });

        document.getElementById('btn-respawn-busted').addEventListener('click', () => {
            this.respawn('BUSTED');
        });

        // Touch Control Bindings
        const bindBtn = (id, key) => {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); audio.init(); this.keys[key] = true; };
            const end = (e) => { e.preventDefault(); this.keys[key] = false; };
            el.addEventListener('touchstart', start);
            el.addEventListener('touchend', end);
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        };

        bindBtn('btn-gas', 'w');
        bindBtn('btn-brake', 's');
        bindBtn('btn-steer-left', 'a');
        bindBtn('btn-steer-right', 'd');
        bindBtn('btn-handbrake', 'space');
        bindBtn('btn-nitro', 'shift');

    initEvents() {
        window.addEventListener('resize', () => {
            this.width = window.innerWidth;
            this.height = window.innerHeight;
            this.camera.aspect = this.width / this.height;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(this.width, this.height);
        });

        window.addEventListener('keydown', (e) => {
            audio.init();
            const k = e.key.toLowerCase();
            this.keys[k] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                this.keys['space'] = true;
            }
            if (e.key === 'Shift') {
                this.keys['shift'] = true;
            }
            if (k === 'c') {
                this.cameraMode = (this.cameraMode + 1) % 3;
                const names = ['CHASE VIEW', 'HIGH ANGLE', 'BUMPER / HOOD'];
                this.showBanner(`📹 ${names[this.cameraMode]}`);
            }
            if (k === 'r') {
                const station = audio.nextRadio();
                this.showBanner(`📻 ${station}`);
            }
            if (k === 'f' || e.code === 'Enter') {
                this.toggleCarJack();
            }
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            this.keys[k] = false;
            if (e.code === 'Space') this.keys['space'] = false;
            if (e.key === 'Shift') this.keys['shift'] = false;
        });
    }

    showBanner(text) {
        this.bannerEl.textContent = text;
        this.bannerEl.classList.add('show');
        clearTimeout(this.bannerTimer);
        this.bannerTimer = setTimeout(() => this.bannerEl.classList.remove('show'), 2200);
    }

    toggleCarJack() {
        if (this.isDriving) {
            // Exit vehicle onto sidewalk or beside car
            this.isDriving = false;
            this.tommy.x = this.car.x + (this.car.x > 0 ? 5 : -5);
            this.tommy.z = this.car.z;
            this.tommy.y = 0;
            this.tommy.angle = this.car.angle;
            this.tommy.speed = 0;
            this.tommy.data.mesh.position.set(this.tommy.x, this.tommy.y, this.tommy.z);
            this.tommy.data.mesh.visible = true;

            this.car.speed = 0;
            this.carModelEl.textContent = 'ON FOOT';
            this.showBanner('🏃 TOMMY VERCETTI ON FOOT');
            audio.playCarJack();
            this.updateControlLabels();
        } else {
            // Try to jack nearest vehicle
            let targetCar = null;
            let minDist = 14;

            // Check player's original car
            const distCar = Math.hypot(this.tommy.x - this.car.x, this.tommy.z - this.car.z);
            if (distCar < minDist) {
                targetCar = { type: 'ORIGINAL', ref: this.car, dist: distCar };
                minDist = distCar;
            }

            // Check traffic vehicles
            this.traffic.forEach(t => {
                const d = Math.hypot(this.tommy.x - t.x, this.tommy.z - t.z);
                if (d < minDist) {
                    targetCar = { type: 'TRAFFIC', ref: t, dist: d };
                    minDist = d;
                }
            });

            // Check police vehicles
            this.policeCars.forEach(p => {
                const d = Math.hypot(this.tommy.x - p.x, this.tommy.z - p.z);
                if (d < minDist) {
                    targetCar = { type: 'POLICE', ref: p, dist: d };
                    minDist = d;
                }
            });

            if (targetCar) {
                this.isDriving = true;
                this.tommy.data.mesh.visible = false;
                audio.playCarJack();

                if (targetCar.type === 'TRAFFIC') {
                    // Swap player car with traffic vehicle
                    const oldModel = this.currentVehicleName;
                    this.currentVehicleName = targetCar.ref.model;
                    this.car.x = targetCar.ref.x;
                    this.car.z = targetCar.ref.z;
                    this.car.angle = targetCar.ref.angle;
                    this.car.speed = 0;

                    this.scene.remove(this.car.data.mesh);
                    this.car.data = targetCar.ref.data;
                    this.car.data.mesh.position.set(this.car.x, this.car.y, this.car.z);

                    // Remove traffic car from array
                    const idx = this.traffic.indexOf(targetCar.ref);
                    if (idx > -1) this.traffic.splice(idx, 1);

                    this.showBanner(`🚗 CARJACKED: ${this.currentVehicleName}`);
                    this.wantedLevel = Math.min(5, this.wantedLevel + 1);
                    this.updateWantedHUD();
                } else if (targetCar.type === 'POLICE') {
                    this.currentVehicleName = 'VCPD CRUISER';
                    this.car.x = targetCar.ref.x;
                    this.car.z = targetCar.ref.z;
                    this.car.angle = targetCar.ref.angle;
                    this.car.speed = 0;

                    this.scene.remove(this.car.data.mesh);
                    this.car.data = targetCar.ref.data;
                    this.car.data.mesh.position.set(this.car.x, this.car.y, this.car.z);

                    const idx = this.policeCars.indexOf(targetCar.ref);
                    if (idx > -1) this.policeCars.splice(idx, 1);

                    this.showBanner(`🚨 JACKED VCPD CRUISER!`);
                    this.wantedLevel = Math.min(5, this.wantedLevel + 2);
                    this.updateWantedHUD();
                } else {
                    this.showBanner(`🚗 ENTERED ${this.currentVehicleName}`);
                }

                this.carModelEl.textContent = this.currentVehicleName;
                this.updateControlLabels();
            } else {
                this.showBanner(`⚠️ NO VEHICLE NEARBY TO JACK`);
            }
        }
    }

    updateControlLabels() {
        if (this.isDriving) {
            this.gasLabel.textContent = 'GAS';
            this.brakeLabel.textContent = 'BRAKE';
            this.handbrakeLabel.textContent = 'DRIFT';
        } else {
            this.gasLabel.textContent = 'WALK';
            this.brakeLabel.textContent = 'BACK';
            this.handbrakeLabel.textContent = 'JUMP';
        }

    respawn(reason) {
        this.wastedScreen.classList.remove('show');
        this.bustedScreen.classList.remove('show');

        this.hp = 100;
        this.armor = 100;
        this.nitro = 100;
        this.wantedLevel = 0;
        this.updateWantedHUD();

        if (reason === 'WASTED') {
            this.cash = Math.max(0, this.cash - 2000);
            this.car.x = 0;
            this.car.z = 0;
            this.car.speed = 0;
            this.car.angle = 0;
        } else if (reason === 'BUSTED') {
            this.cash = Math.max(0, this.cash - 3500);
            this.car.x = -15;
            this.car.z = 600;
            this.car.speed = 0;
            this.car.angle = 0;
        }

        this.isDriving = true;
        this.tommy.data.mesh.visible = false;
        this.currentVehicleName = 'INFERNUS';
        this.carModelEl.textContent = this.currentVehicleName;

        this.scene.remove(this.car.data.mesh);
        this.car.data = createVehicleMesh('INFERNUS');
        this.scene.add(this.car.data.mesh);

        // Despawn all police cars
        this.policeCars.forEach(p => this.scene.remove(p.data.mesh));
        this.policeCars = [];
        audio.setSirenActive(false);

        this.updateHUD();
        this.updateControlLabels();
    }

    // --- GAME ENGINE LOOP ---
    animate() {
        requestAnimationFrame(() => this.animate());
        const now = performance.now();
        const dt = Math.min((now - this.lastTime) / 1000, 0.05);
        this.lastTime = now;

        this.update(dt);
        this.renderer.render(this.scene, this.camera);
        this.renderRadar();
    }

    update(dt) {
        if (this.isDriving) {
            this.updateVehicle(dt);
        } else {
            this.updateTommy(dt);
        }

        this.updateTraffic(dt);
        this.updatePedestrians(dt);
        this.updateCollectibles(dt);
        this.updatePolice(dt);
        this.updateCamera(dt);
        this.updateHUD();
    }

    updateVehicle(dt) {
        const c = this.car;

        const gas = this.keys['w'] || this.keys['arrowup'];
        const brake = this.keys['s'] || this.keys['arrowdown'];
        const left = this.keys['a'] || this.keys['arrowleft'];
        const right = this.keys['d'] || this.keys['arrowright'];
        const handbrake = this.keys['space'];
        const nitroKey = this.keys['shift'];

        // Nitrous Activation
        let maxSpd = c.maxSpeed;
        let accelForce = c.accel;
        if (nitroKey && this.nitro > 0 && Math.abs(c.speed) > 10) {
            c.isNitro = true;
            this.nitro = Math.max(0, this.nitro - dt * 28);
            maxSpd = 118;
            accelForce = 50;
            audio.playNitroSound();

            if (c.data.flameL && c.data.flameR) {
                c.data.flameL.visible = true;
                c.data.flameR.visible = true;
                c.data.flameL.scale.set(1, 1 + Math.random() * 0.8, 1);
                c.data.flameR.scale.set(1, 1 + Math.random() * 0.8, 1);
            }
        } else {
            c.isNitro = false;
            this.nitro = Math.min(100, this.nitro + dt * 10); // Recharge
            if (c.data.flameL && c.data.flameR) {
                c.data.flameL.visible = false;
                c.data.flameR.visible = false;
            }
        }

        // Acceleration & Braking
        if (gas) {
            c.speed = Math.min(maxSpd, c.speed + accelForce * dt);
        } else if (brake) {
            c.speed = Math.max(-c.maxSpeed * 0.4, c.speed - c.brakeForce * dt);
        } else {
            c.speed *= Math.pow(c.friction, dt * 60);
            if (Math.abs(c.speed) < 0.2) c.speed = 0;
        }

        // Steering & Drift
        let steerTarget = 0;
        if (left) steerTarget = 0.44;
        if (right) steerTarget = -0.44;

        c.steerAngle += (steerTarget - c.steerAngle) * 0.18;

        if (Math.abs(c.speed) > 1.0) {
            const dir = c.speed > 0 ? 1 : -1;
            const turnRate = c.handling * (handbrake ? 1.7 : 1.0);
            c.angle += c.steerAngle * turnRate * dt * dir;

            if (handbrake && Math.abs(c.speed) > 22) {
                audio.playScreech();
                c.speed *= 0.985;
            }
        }

        // Front Wheel Steering & Rotation
        if (c.data.wheels.length >= 2) {
            c.data.wheels[0].rotation.y = c.steerAngle * 1.2;
            c.data.wheels[1].rotation.y = c.steerAngle * 1.2;
        }

        c.data.wheels.forEach(w => {
            if (w.children.length > 0) {
                w.children[0].rotation.x += (c.speed * dt * 0.8);
            }
        });

        // Translate Vehicle in 3D Space (Forward is -Z)
        const moveDist = c.speed * dt;
        c.x -= Math.sin(c.angle) * moveDist;
        c.z -= Math.cos(c.angle) * moveDist;

        // Wrap City Road seamlessly
        if (c.z < -1400) c.z = 1380;
        if (c.z > 1400) c.z = -1380;

        // Curb collision
        if (c.x > 38 || c.x < -38) {
            c.speed *= 0.7;
            c.x = Math.max(-38, Math.min(38, c.x));
            audio.playCrash();
        }

        // Building Collisions
        for (let b of this.buildings) {
            if (c.x > b.minX - 2.5 && c.x < b.maxX + 2.5 && c.z > b.minZ - 4.5 && c.z < b.maxZ + 4.5) {
                c.speed = -c.speed * 0.5;
                audio.playCrash();
                this.damagePlayer(12);
                break;
            }
        }

        // Update Car Mesh Position & Tilt
        c.data.mesh.position.set(c.x, c.y, c.z);
        c.data.mesh.rotation.y = c.angle;
        c.data.mesh.rotation.z = -c.steerAngle * 0.15 * Math.min(1.0, Math.abs(c.speed) / 30);

        // Audio Pitch
        audio.setEngineSpeed(Math.abs(c.speed) / c.maxSpeed, true);
    }

    updateTommy(dt) {
        const t = this.tommy;
        const forward = this.keys['w'] || this.keys['arrowup'];
        const backward = this.keys['s'] || this.keys['arrowdown'];
        const left = this.keys['a'] || this.keys['arrowleft'];
        const right = this.keys['d'] || this.keys['arrowright'];
        const sprint = this.keys['shift'];

        let moveX = 0, moveZ = 0;
        if (forward) moveZ -= 1;
        if (backward) moveZ += 1;
        if (left) moveX -= 1;
        if (right) moveX += 1;

        const isMoving = moveX !== 0 || moveZ !== 0;

        if (isMoving) {
            const length = Math.hypot(moveX, moveZ);
            moveX /= length;
            moveZ /= length;

            const targetAngle = Math.atan2(moveX, moveZ) + Math.PI;
            t.angle += (targetAngle - t.angle) * 0.2;

            const curSpeed = sprint ? t.runSpeed : t.walkSpeed;
            t.x -= Math.sin(t.angle) * curSpeed * dt;
            t.z -= Math.cos(t.angle) * curSpeed * dt;

            // Animate Walk Cycle
            t.walkCycle += dt * (sprint ? 14 : 9);
            const swing = Math.sin(t.walkCycle) * 0.65;
            t.data.lLeg.rotation.x = swing;
            t.data.rLeg.rotation.x = -swing;
            t.data.lArm.rotation.x = -swing;
            t.data.rArm.rotation.x = swing;
        } else {
            // Idle stance
            t.data.lLeg.rotation.x *= 0.8;
            t.data.rLeg.rotation.x *= 0.8;
            t.data.lArm.rotation.x *= 0.8;
            t.data.rArm.rotation.x *= 0.8;
        }

        // Clamp boundaries
        t.x = Math.max(-55, Math.min(65, t.x));
        if (t.z < -1400) t.z = 1380;
        if (t.z > 1400) t.z = -1380;

        t.data.mesh.position.set(t.x, t.y, t.z);
        t.data.mesh.rotation.y = t.angle;

        audio.setEngineSpeed(0, false);
    }

    updateTraffic(dt) {
        const playerPos = this.isDriving ? this.car : this.tommy;

        this.traffic.forEach(t => {
            // Traffic moves along Z
            t.z += t.dir * t.speed * dt;

            // Seamless wrap
            if (t.z < -1400) t.z = 1380;
            if (t.z > 1400) t.z = -1380;

            t.data.mesh.position.set(t.x, t.y, t.z);

            // Spin wheels
            t.data.wheels.forEach(w => {
                if (w.children.length > 0) w.children[0].rotation.x += (t.speed * dt * 0.8);
            });

            // Collision with Player Car
            if (this.isDriving) {
                const dist = Math.hypot(this.car.x - t.x, this.car.z - t.z);
                if (dist < 5.2) {
                    audio.playCrash();
                    this.car.speed *= -0.4;
                    t.speed *= 0.3;
                    this.damagePlayer(15);
                    this.wantedLevel = Math.min(5, this.wantedLevel + 1);
                    this.updateWantedHUD();
                }
            } else {
                // Traffic hit Tommy on foot
                const dist = Math.hypot(this.tommy.x - t.x, this.tommy.z - t.z);
                if (dist < 3.2) {
                    audio.playPedHit();
                    this.damagePlayer(35);
                    this.tommy.x += (this.tommy.x > t.x ? 6 : -6);
                }
            }
        });
    }

    updatePedestrians(dt) {
        this.pedestrians.forEach(p => {
            if (!p.alive) return;

            p.z += p.dir * p.speed * dt;
            if (p.z < -1400) p.z = 1380;
            if (p.z > 1400) p.z = -1380;

            p.walkCycle += dt * 6;
            const swing = Math.sin(p.walkCycle) * 0.5;
            p.data.lLeg.rotation.x = swing;
            p.data.rLeg.rotation.x = -swing;
            p.data.lArm.rotation.x = -swing;
            p.data.rArm.rotation.x = swing;

            p.data.mesh.position.set(p.x, p.y, p.z);
            p.data.mesh.rotation.y = p.dir === 1 ? Math.PI : 0;

            // Check collision with Player Car
            if (this.isDriving) {
                const dist = Math.hypot(this.car.x - p.x, this.car.z - p.z);
                if (dist < 3.6 && Math.abs(this.car.speed) > 8) {
                    p.alive = false;
                    audio.playPedHit();
                    p.data.mesh.rotation.x = Math.PI / 2; // Ragdoll fall
                    p.data.mesh.position.y = 0.4;

                    this.cash += 150;
                    this.showBanner(`💥 HIT PEDESTRIAN! +$150`);
                    this.wantedLevel = Math.min(5, this.wantedLevel + 1);
                    this.updateWantedHUD();

                    // Respawn pedestrian after 10s
                    setTimeout(() => {
                        p.alive = true;
                        p.data.mesh.rotation.x = 0;
                        p.data.mesh.position.y = 0;
                        p.z = this.car.z + (Math.random() > 0.5 ? 200 : -200);
                    }, 10000);
                }
            }
        });
    }

    updateCollectibles(dt) {
        const playerPos = this.isDriving ? this.car : this.tommy;

        this.collectibles.forEach(c => {
            if (!c.active) return;

            c.mesh.rotation.y += dt * 2.2;

            const dist = Math.hypot(playerPos.x - c.x, playerPos.z - c.z);
            if (dist < 4.5) {
                c.active = false;
                c.mesh.visible = false;

                if (c.type === 'CASH') {
                    this.cash += c.value;
                    audio.playCashChime();
                    this.showBanner(`💰 COLLECTED CASH STACK! +$${c.value}`);
                } else if (c.type === 'BRIBE') {
                    this.wantedLevel = Math.max(0, this.wantedLevel - 1);
                    audio.playBribeSound();
                    this.updateWantedHUD();
                    this.showBanner(`⭐ POLICE BRIBE! WANTED LEVEL REDUCED`);
                }

                // Respawn collectible after 25s
                setTimeout(() => {
                    c.active = true;
                    c.mesh.visible = true;
                }, 25000);
            }
        });
    }

    updatePolice(dt) {
        // Spawn VCPD Cruiser when Wanted Level >= 1
        if (this.wantedLevel >= 1 && this.policeCars.length === 0) {
            const pData = createVehicleMesh('POLICE');
            const targetZ = (this.isDriving ? this.car.z : this.tommy.z) + (Math.random() > 0.5 ? 140 : -140);
            pData.mesh.position.set(0, 0.6, targetZ);
            this.scene.add(pData.mesh);

            this.policeCars.push({
                data: pData,
                x: 0,
                y: 0.6,
                z: targetZ,
                speed: 0,
                maxSpeed: 78,
                angle: 0
            });

            audio.setSirenActive(true);
            this.showBanner(`🚨 VCPD IN PURSUIT! WANTED LEVEL ${this.wantedLevel}★`);
        } else if (this.wantedLevel === 0 && this.policeCars.length > 0) {
            this.policeCars.forEach(p => this.scene.remove(p.data.mesh));
            this.policeCars = [];
            audio.setSirenActive(false);
        }

        // Update Police Pursuits
        const playerPos = this.isDriving ? this.car : this.tommy;

        this.policeCars.forEach(p => {
            // Flash Lightbar
            if (p.data.lightbar) {
                const flash = (performance.now() % 300) < 150;
                p.data.lightbar.red.visible = flash;
                p.data.lightbar.blue.visible = !flash;
                p.data.lightbar.light.color.setHex(flash ? 0xff0033 : 0x0066ff);
                p.data.lightbar.light.intensity = 1.8;
            }

            // AI Pursuit Steering & Speed
            const dx = playerPos.x - p.x;
            const dz = playerPos.z - p.z;
            const targetAngle = Math.atan2(dx, dz) + Math.PI;

            p.angle += (targetAngle - p.angle) * 0.08;
            p.speed = Math.min(p.maxSpeed + (this.wantedLevel * 8), p.speed + 32 * dt);

            p.x -= Math.sin(p.angle) * p.speed * dt;
            p.z -= Math.cos(p.angle) * p.speed * dt;

            p.data.mesh.position.set(p.x, p.y, p.z);
            p.data.mesh.rotation.y = p.angle;

            // Collision with Player
            const dist = Math.hypot(playerPos.x - p.x, playerPos.z - p.z);
            if (dist < 5.0) {
                audio.playCrash();
                this.damagePlayer(18 * dt);

                // If player is boxed in / stopped by police for too long
                if (Math.abs(this.car.speed) < 3.0 && this.wantedLevel >= 1) {
                    this.bustedTimer = (this.bustedTimer || 0) + dt;
                    if (this.bustedTimer > 2.2) {
                        this.bustedTimer = 0;
                        this.bustedScreen.classList.add('show');
                    }
                } else {
                    this.bustedTimer = 0;
                }
            }
        });

        // Wanted Level Cooldown if away from police
        if (this.wantedLevel > 0) {
            this.wantedCooldown += dt;
            if (this.wantedCooldown > 18) {
                this.wantedLevel = Math.max(0, this.wantedLevel - 1);
                this.wantedCooldown = 0;
                this.updateWantedHUD();
                if (this.wantedLevel === 0) {
                    this.showBanner(`🌴 ESCAPED THE POLICE!`);
                }
            }
        }
    }

    damagePlayer(amount) {
        if (this.armor > 0) {
            this.armor = Math.max(0, this.armor - amount);
        } else {
            this.hp = Math.max(0, this.hp - amount);
            if (this.hp <= 0) {
                this.wastedScreen.classList.add('show');
            }
        }
        this.updateHUD();
    }

    updateCamera(dt) {
        const targetObj = this.isDriving ? this.car : this.tommy;

        let camDist = 18;
        let camHeight = 6.5;
        let targetFOV = 65;

        if (this.car.isNitro && this.isDriving) {
            targetFOV = 78; // High speed warp FOV
        }

        if (this.cameraMode === 1) { // High angle
            camDist = 28;
            camHeight = 18;
        } else if (this.cameraMode === 2) { // Bumper / Hood cam
            camDist = -2;
            camHeight = 2.4;
        }

        this.camera.fov += (targetFOV - this.camera.fov) * 0.12;
        this.camera.updateProjectionMatrix();

        const targetCamX = targetObj.x + Math.sin(targetObj.angle) * camDist;
        const targetCamZ = targetObj.z + Math.cos(targetObj.angle) * camDist;
        const targetCamY = targetObj.y + camHeight;

        this.camera.position.x += (targetCamX - this.camera.position.x) * 0.14;
        this.camera.position.y += (targetCamY - this.camera.position.y) * 0.14;
        this.camera.position.z += (targetCamZ - this.camera.position.z) * 0.14;

        const lookTarget = new THREE.Vector3(
            targetObj.x - Math.sin(targetObj.angle) * 15,
            targetObj.y + 1.2,
            targetObj.z - Math.cos(targetObj.angle) * 15
        );
        this.camera.lookAt(lookTarget);
    }

    updateWantedHUD() {
        for (let i = 1; i <= 5; i++) {
            const star = document.getElementById(`star-${i}`);
            if (star) {
                if (i <= this.wantedLevel) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            }
        }
    }

    updateHUD() {
        this.cashEl.textContent = `$${this.cash.toString().padStart(8, '0')}`;
        this.hpBar.style.width = `${Math.max(0, this.hp)}%`;
        this.armorBar.style.width = `${Math.max(0, this.armor)}%`;
        this.nitroBar.style.width = `${Math.max(0, this.nitro)}%`;

        const curSpd = this.isDriving ? this.car.speed : this.tommy.speed;
        const mph = Math.round(Math.abs(curSpd) * 1.5);
        this.speedEl.textContent = `${mph.toString().padStart(3, '0')} MPH`;
    }

    // --- CIRCULAR NEON RADAR MINIMAP ---
    renderRadar() {
        const rCtx = this.radarCtx;
        const rw = 115;
        const rh = 115;
        rCtx.clearRect(0, 0, rw, rh);

        // Dark radar background
        rCtx.fillStyle = 'rgba(12, 6, 26, 0.95)';
        rCtx.beginPath();
        rCtx.arc(rw/2, rh/2, rw/2 - 2, 0, Math.PI * 2);
        rCtx.fill();

        // Ocean Drive vertical road strip
        rCtx.strokeStyle = 'rgba(255, 42, 141, 0.35)';
        rCtx.lineWidth = 14;
        rCtx.beginPath();
        rCtx.moveTo(rw/2, 0);
        rCtx.lineTo(rw/2, rh);
        rCtx.stroke();

        const playerPos = this.isDriving ? this.car : this.tommy;

        // Draw Police Blips (Flashing Red/Blue)
        this.policeCars.forEach(p => {
            const relX = (p.x - playerPos.x) * 0.45;
            const relZ = (p.z - playerPos.z) * 0.25;
            rCtx.fillStyle = (performance.now() % 400 < 200) ? '#ff0055' : '#0066ff';
            rCtx.beginPath();
            rCtx.arc(rw/2 + relX, rh/2 + relZ, 4, 0, Math.PI * 2);
            rCtx.fill();
        });

        // Draw Collectible Blips (Yellow/Green)
        this.collectibles.forEach(c => {
            if (!c.active) return;
            const relX = (c.x - playerPos.x) * 0.45;
            const relZ = (c.z - playerPos.z) * 0.25;
            rCtx.fillStyle = c.type === 'CASH' ? '#2ecc71' : '#ffd000';
            rCtx.beginPath();
            rCtx.arc(rw/2 + relX, rh/2 + relZ, 2.5, 0, Math.PI * 2);
            rCtx.fill();
        });

        // Player Arrow (Cyan neon triangle centered)
        rCtx.save();
        rCtx.translate(rw/2, rh/2);
        rCtx.rotate(-playerPos.angle);

        rCtx.fillStyle = '#00f0ff';
        rCtx.shadowColor = '#00f0ff';
        rCtx.shadowBlur = 8;
        rCtx.beginPath();
        rCtx.moveTo(0, -7);
        rCtx.lineTo(5, 6);
        rCtx.lineTo(0, 4);
        rCtx.lineTo(-5, 6);
        rCtx.closePath();
        rCtx.fill();

        rCtx.restore();

        // Outer Neon Rim
        rCtx.strokeStyle = '#ff2a8d';
        rCtx.lineWidth = 2.5;
        rCtx.beginPath();
        rCtx.arc(rw/2, rh/2, rw/2 - 2, 0, Math.PI * 2);
        rCtx.stroke();
    }
}

// Start Game on Load
window.addEventListener('load', () => {
    new ViceCity3D();
});
</script>
