<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunter Assassin - MicroVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #080a0f;
            --neon-cyan: #00f0ff;
            --neon-red: #ff2a5f;
            --neon-yellow: #ffd000;
            --neon-green: #00ff88;
            --panel-bg: rgba(13, 17, 26, 0.88);
            --border-glow: rgba(0, 240, 255, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #f0f4f8;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
            background: #0b0d12;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top Bar & HUD */
        .hud-header {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .hud-pill {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
        }

        .hud-label {
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: #8da2b5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-val {
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #fff;
        }

        .val-gems { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
        .val-targets { color: var(--neon-red); text-shadow: 0 0 10px rgba(255,42,95,0.6); }

        /* Health Bar */
        .health-bar-wrap {
            width: 110px;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), #88ff00);
            transition: width 0.2s ease, background 0.3s ease;
        }

        .nav-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 8px 14px;
            border-radius: 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            pointer-events: auto;
        }

        .nav-btn:hover, .nav-btn:active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }

        /* Minimap Overlay */
        #minimap-canvas {
            position: absolute;
            top: 70px;
            right: 16px;
            width: 110px;
            height: 110px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            background: rgba(10, 14, 22, 0.88);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            pointer-events: none;
            z-index: 20;
        }

        /* Floating Controls for Mobile */
        #mobile-dash-btn {
            position: absolute;
            bottom: 28px;
            right: 28px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 240, 255, 0.05));
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            backdrop-filter: blur(8px);
            cursor: pointer;
            z-index: 30;
            transition: transform 0.1s, background 0.1s;
        }

        #mobile-dash-btn:active {
            transform: scale(0.92);
            background: rgba(0, 240, 255, 0.45);
        }

        /* Overlays & Modals */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 8, 14, 0.88);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #121622;
            border: 2px solid var(--border-glow);
            border-radius: 20px;
            padding: 32px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.15);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .title-success { color: var(--neon-cyan); text-shadow: 0 0 25px rgba(0,240,255,0.7); }
        .title-danger { color: var(--neon-red); text-shadow: 0 0 25px rgba(255,42,95,0.7); }
        .title-gold { color: var(--neon-yellow); text-shadow: 0 0 25px rgba(255,208,0,0.7); }

        .modal-subtitle {
            font-size: 16px;
            color: #8da2b5;
            margin-bottom: 24px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 12px;
        }

        .stat-box-label {
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: #7b8e9f;
            text-transform: uppercase;
        }

        .stat-box-val {
            font-size: 22px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #fff;
            margin-top: 4px;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--neon-cyan), #00aaff);
            color: #060810;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .action-btn:hover, .action-btn:active {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: none;
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Operatives Store Modal */
        .roster-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 4px;
        }

        .roster-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: all 0.2s;
            cursor: pointer;
        }

        .roster-card.selected {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .roster-info h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #fff;
        }

        .roster-info p {
            font-size: 12px;
            color: #8da2b5;
            margin-top: 2px;
        }

        .roster-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Virtual Joystick */
        #touch-joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.05);
            display: none;
            pointer-events: none;
            z-index: 25;
            transform: translate(-50%, -50%);
        }

        #touch-stick {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            top: 36px;
            left: 36px;
        }
    </style>
</head>

<script>
/**
 * HUNTER ASSASSIN - TACTICAL STEALTH WEB MINI-GAME (ENHANCED GRAPHICS)
 * Built for RashTek MicroVerse
 * Stylized 2.5D visual design inspired by Ruby Games
 */

// --- AUDIO SYNTHESIZER ---
class SoundSystem {
    constructor() {
        this.ctx = null;
        this.enabled = true;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playFootstep() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
    }

    playSlash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.16;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1600, now);
        filter.frequency.exponentialRampToValueAtTime(350, now + 0.16);
        filter.Q.value = 3.5;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.45, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
    }

    playAlert() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.18);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
    }

    playGunshot() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.14;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.1);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.55, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);

        noise.connect(gain);
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
        osc.start(now);
        osc.stop(now + 0.14);
    }

    playExplosion() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const osc = this.ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(20, now + 0.35);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        noise.connect(gain);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
        osc.start(now);
        osc.stop(now + 0.4);
    }

    playGem() {
        if (!this.enabled || !this.ctx) return;
        const notes = [659.25, 830.61, 1046.50]; // E5, G#5, C6
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + idx * 0.05;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.18, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.2);
        });
    }

    playVictory() {
        if (!this.enabled || !this.ctx) return;
        const chords = [523.25, 659.25, 783.99, 1046.50];
        chords.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + i * 0.08;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.2, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.5);
        });
    }

    playDash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(650, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.16);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
    }
}

// --- GAME ENGINE ---
class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.minimapCanvas = document.getElementById('minimap-canvas');
        this.minimapCtx = this.minimapCanvas.getContext('2d');

        this.width = window.innerWidth;
        this.height = window.innerHeight;

        this.gems = parseInt(localStorage.getItem('rtk_assassin_gems') || '0', 10);
        this.currentOperativeId = localStorage.getItem('rtk_assassin_op') || 'stalker';
        this.loadUnlockedOperatives();

        this.sectorIndex = 0;
        this.player = null;
        this.guards = [];
        this.obstacles = [];
        this.barrels = [];
        this.gemsList = [];
        this.bullets = [];
        this.particles = [];
        this.slashWaves = [];
        this.downedBodies = [];
        this.floatingTexts = [];
        this.tapRipples = [];
        this.ambientDust = [];

        this.worldWidth = 1400;
        this.worldHeight = 1100;

        this.camera = { x: 0, y: 0 };
        this.shakeTime = 0;
        this.shakeMagnitude = 0;

        this.targetPos = null;
        this.keys = {};
        this.touchData = null;
        this.joystickActive = false;
        this.joystickPos = { x: 0, y: 0 };
        this.joystickVector = { x: 0, y: 0 };

        this.isGameOver = false;
        this.isVictory = false;
        this.isPaused = false;
        this.stealthAlarmTriggered = false;

        this.lastTime = performance.now();

        this.initDust();
        this.initDOM();
        this.initEvents();
        this.resize();
        this.loadSector(this.sectorIndex);
        this.loop();
    }

    initDust() {
        this.ambientDust = [];
        for (let i = 0; i < 45; i++) {
            this.ambientDust.push({
                x: Math.random() * this.worldWidth,
                y: Math.random() * this.worldHeight,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                radius: Math.random() * 1.5 + 0.8,
                alpha: Math.random() * 0.4 + 0.1
            });
        }
    }

    loadUnlockedOperatives() {
        const stored = localStorage.getItem('rtk_assassin_unlocked');
        if (stored) {
            try {
                const ids = JSON.parse(stored);
                OPERATIVES.forEach(op => {
                    if (ids.includes(op.id)) op.unlocked = true;
                });
            } catch (e) {}
        }
        OPERATIVES[0].unlocked = true;
    }

    saveUnlockedOperatives() {
        const unlockedIds = OPERATIVES.filter(o => o.unlocked).map(o => o.id);
        localStorage.setItem('rtk_assassin_unlocked', JSON.stringify(unlockedIds));
        localStorage.setItem('rtk_assassin_gems', this.gems.toString());
        localStorage.setItem('rtk_assassin_op', this.currentOperativeId);
    }

    getOperative() {
        return OPERATIVES.find(o => o.id === this.currentOperativeId) || OPERATIVES[0];
    }

    initDOM() {
        this.elGems = document.getElementById('gem-count');
        this.elTargets = document.getElementById('target-count');
        this.elHealth = document.getElementById('health-bar');
        this.modalVictory = document.getElementById('modal-victory');
        this.modalGameOver = document.getElementById('modal-gameover');
        this.modalRoster = document.getElementById('modal-roster');
        this.joystickEl = document.getElementById('touch-joystick');
        this.stickEl = document.getElementById('touch-stick');

        document.getElementById('btn-next-level').addEventListener('click', () => {
            this.modalVictory.classList.remove('active');
            this.sectorIndex++;
            this.loadSector(this.sectorIndex);
        });

        document.getElementById('btn-replay-level').addEventListener('click', () => {
            this.modalVictory.classList.remove('active');
            this.loadSector(this.sectorIndex);
        });

        document.getElementById('btn-retry').addEventListener('click', () => {
            this.modalGameOver.classList.remove('active');
            this.loadSector(this.sectorIndex);
        });

        document.getElementById('btn-roster').addEventListener('click', () => this.openRoster());
        document.getElementById('btn-gameover-roster').addEventListener('click', () => {
            this.modalGameOver.classList.remove('active');
            this.openRoster();
        });
        document.getElementById('btn-close-roster').addEventListener('click', () => {
            this.modalRoster.classList.remove('active');
            this.isPaused = false;
        });

        const btnAudio = document.getElementById('btn-audio');
        btnAudio.addEventListener('click', () => {
            sound.init();
            sound.enabled = !sound.enabled;
            btnAudio.textContent = sound.enabled ? '🔊 Sound' : '🔇 Muted';
        });

        document.getElementById('mobile-dash-btn').addEventListener('click', (e) => {
            e.preventDefault();
            this.dash();
        });
    }

    initEvents() {
        window.addEventListener('resize', () => this.resize());

        window.addEventListener('keydown', (e) => {
            sound.init();
            this.keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                this.dash();
            }
        });

        window.addEventListener('keyup', (e) => {
            this.keys[e.key.toLowerCase()] = false;
        });

        this.canvas.addEventListener('pointerdown', (e) => {
            sound.init();
            if (e.pointerType === 'touch') {
                this.touchData = {
                    id: e.pointerId,
                    startX: e.clientX,
                    startY: e.clientY,
                    startTime: performance.now(),
                    isDragging: false
                };
            } else {
                const worldPos = this.screenToWorld(e.clientX, e.clientY);
                this.setDestination(worldPos.x, worldPos.y);
            }
        });

        this.canvas.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'touch' && this.touchData && e.pointerId === this.touchData.id) {
                const dx = e.clientX - this.touchData.startX;
                const dy = e.clientY - this.touchData.startY;
                const dist = Math.hypot(dx, dy);

                if (!this.touchData.isDragging && dist > 14) {
                    this.touchData.isDragging = true;
                    this.joystickActive = true;
                    this.joystickPos = { x: this.touchData.startX, y: this.touchData.startY };
                    this.joystickEl.style.display = 'block';
                    this.joystickEl.style.left = `${this.touchData.startX}px`;
                    this.joystickEl.style.top = `${this.touchData.startY}px`;
                }

                if (this.touchData.isDragging) {
                    const maxDist = 45;
                    const angle = Math.atan2(dy, dx);
                    const clampDist = Math.min(dist, maxDist);

                    const stickX = Math.cos(angle) * clampDist;
                    const stickY = Math.sin(angle) * clampDist;
                    this.stickEl.style.transform = `translate(${stickX}px, ${stickY}px)`;

                    this.joystickVector = {
                        x: stickX / maxDist,
                        y: stickY / maxDist
                    };
                    this.targetPos = null;
                }
            }
        });

        const endTouch = (e) => {
            if (e.pointerType === 'touch' && this.touchData && e.pointerId === this.touchData.id) {
                if (!this.touchData.isDragging) {
                    const worldPos = this.screenToWorld(e.clientX, e.clientY);
                    this.setDestination(worldPos.x, worldPos.y);
                }
                this.joystickActive = false;
                this.joystickVector = { x: 0, y: 0 };
                this.joystickEl.style.display = 'none';
                this.touchData = null;
            }
        };

        this.canvas.addEventListener('pointerup', endTouch);
        this.canvas.addEventListener('pointercancel', endTouch);
    }

    screenToWorld(sx, sy) {
        return {
            x: sx + this.camera.x,
            y: sy + this.camera.y
        };
    }

    setDestination(wx, wy) {
        wx = Math.max(35, Math.min(this.worldWidth - 35, wx));
        wy = Math.max(35, Math.min(this.worldHeight - 35, wy));

        this.targetPos = { x: wx, y: wy };
        this.tapRipples.push({
            x: wx,
            y: wy,
            radius: 6,
            maxRadius: 38,
            alpha: 1.0,
            color: this.getOperative().color
        });
    }

    dash() {
        if (!this.player || this.player.dashTimer > 0) return;
        sound.playDash();
        const op = this.getOperative();
        this.player.dashTimer = op.dashCooldown;
        this.player.isDashing = true;
        this.player.dashDuration = 0.2;

        for (let i = 0; i < 7; i++) {
            this.particles.push({
                x: this.player.x + (Math.random() * 24 - 12),
                y: this.player.y + (Math.random() * 24 - 12),
                vx: -Math.cos(this.player.angle) * 3,
                vy: -Math.sin(this.player.angle) * 3,
                radius: 12,
                color: op.color,
                alpha: 0.8,
                decay: 0.08
            });
        }
    }

    resize() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;
    }

    // --- GAME LOOP ---
    loop() {
        requestAnimationFrame(() => this.loop());
        const now = performance.now();
        const dt = Math.min((now - this.lastTime) / 1000, 0.05);
        this.lastTime = now;

        if (!this.isPaused) {
            this.update(dt);
        }
        this.render();
        this.renderMinimap();
    }

    // --- UPDATE LOGIC ---
    update(dt) {
        if (!this.player || this.isGameOver || this.isVictory) return;

        const op = this.getOperative();

        if (this.shakeTime > 0) this.shakeTime -= dt;
        if (this.player.dashTimer > 0) this.player.dashTimer -= dt;

        if (this.player.isDashing) {
            this.player.dashDuration -= dt;
            if (this.player.dashDuration <= 0) {
                this.player.isDashing = false;
            }
        }

        // --- AMBIENT DUST UPDATE ---
        this.ambientDust.forEach(d => {
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            if (d.x < 0) d.x = this.worldWidth;
            if (d.x > this.worldWidth) d.x = 0;
            if (d.y < 0) d.y = this.worldHeight;
            if (d.y > this.worldHeight) d.y = 0;
        });

        // --- PLAYER MOVEMENT ---
        let moveX = 0;
        let moveY = 0;

        if (this.keys['w'] || this.keys['arrowup']) moveY -= 1;
        if (this.keys['s'] || this.keys['arrowdown']) moveY += 1;
        if (this.keys['a'] || this.keys['arrowleft']) moveX -= 1;
        if (this.keys['d'] || this.keys['arrowright']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
            this.targetPos = null;
            const len = Math.hypot(moveX, moveY);
            moveX /= len;
            moveY /= len;
        } else if (this.joystickActive && (this.joystickVector.x !== 0 || this.joystickVector.y !== 0)) {
            moveX = this.joystickVector.x;
            moveY = this.joystickVector.y;
        } else if (this.targetPos) {
            const dx = this.targetPos.x - this.player.x;
            const dy = this.targetPos.y - this.player.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 8) {
                this.targetPos = null;
            } else {
                moveX = dx / dist;
                moveY = dy / dist;
            }
        }

        if (moveX !== 0 || moveY !== 0) {
            this.player.isMoving = true;
            const currentSpeed = (this.player.isDashing ? op.speed * 2.8 : op.speed) * 60 * dt;
            this.player.angle = Math.atan2(moveY, moveX);
            this.player.walkCycle += currentSpeed * 0.18;

            const nextX = this.player.x + moveX * currentSpeed;
            if (!this.checkCircleObstacleCollision(nextX, this.player.y, this.player.radius)) {
                this.player.x = nextX;
            }

            const nextY = this.player.y + moveY * currentSpeed;
            if (!this.checkCircleObstacleCollision(this.player.x, nextY, this.player.radius)) {
                this.player.y = nextY;
            }

            this.player.stepDist += currentSpeed;
            if (this.player.stepDist > 32) {
                this.player.stepDist = 0;
                sound.playFootstep();
            }
        } else {
            this.player.isMoving = false;
        }

        // Camera Follow
        const targetCamX = this.player.x - this.width / 2;
        const targetCamY = this.player.y - this.height / 2;
        this.camera.x += (targetCamX - this.camera.x) * 0.1;
        this.camera.y += (targetCamY - this.camera.y) * 0.1;

        this.camera.x = Math.max(0, Math.min(this.worldWidth - this.width, this.camera.x));
        this.camera.y = Math.max(0, Math.min(this.worldHeight - this.height, this.camera.y));

        // --- GUARDS AI & VISION ---
        const playerInSightFactor = (op.id === 'spectre') ? 0.5 : 1.0;

        for (let i = this.guards.length - 1; i >= 0; i--) {
            const g = this.guards[i];

            // 1. Check Melee Strike
            const distToPlayer = Math.hypot(this.player.x - g.x, this.player.y - g.y);
            const strikeRange = this.player.radius + g.radius + 15;

            if (distToPlayer <= strikeRange) {
                this.assassinateGuard(i);
                continue;
            }

            // 2. Line of Sight
            const canSeePlayer = this.checkGuardLineOfSight(g, this.player.x, this.player.y);

            if (canSeePlayer) {
                g.angle = Math.atan2(this.player.y - g.y, this.player.x - g.x);
                g.lastSeenPos = { x: this.player.x, y: this.player.y };
                g.alertProgress += dt * 3.4 * playerInSightFactor;

                if (g.state !== 'combat' && g.alertProgress >= 0.3) {
                    if (g.state !== 'alerting') {
                        g.state = 'alerting';
                        sound.playAlert();
                    }
                }

                if (g.alertProgress >= 1.0) {
                    if (g.state !== 'combat') {
                        g.state = 'combat';
                        this.stealthAlarmTriggered = true;
                        this.triggerAlarmAlertNearbyGuards(g.x, g.y);
                    }

                    g.shootCooldown -= dt;
                    if (g.shootCooldown <= 0) {
                        this.guardShoot(g);
                        g.shootCooldown = (g.type === 'heavy') ? 0.35 : 0.65;
                    }
                }
            } else {
                if (g.state === 'combat') {
                    g.state = 'search';
                    g.searchTimer = 3.8;
                } else if (g.state === 'alerting') {
                    g.alertProgress = Math.max(0, g.alertProgress - dt * 1.5);
                    if (g.alertProgress === 0) g.state = 'patrol';
                }

                if (g.state === 'search') {
                    g.searchTimer -= dt;
                    if (g.lastSeenPos) {
                        const sDist = Math.hypot(g.lastSeenPos.x - g.x, g.lastSeenPos.y - g.y);
                        if (sDist > 15) {
                            const angle = Math.atan2(g.lastSeenPos.y - g.y, g.lastSeenPos.x - g.x);
                            g.angle = angle;
                            g.walkCycle += g.speed * 60 * dt * 0.16;
                            g.x += Math.cos(angle) * g.speed * 60 * dt;
                            g.y += Math.sin(angle) * g.speed * 60 * dt;
                        }
                    }
                    if (g.searchTimer <= 0) {
                        g.state = 'patrol';
                        g.alertProgress = 0;
                    }
                } else if (g.state === 'patrol') {
                    if (g.waypoints && g.waypoints.length > 1) {
                        const wp = g.waypoints[g.currentWp];
                        const wDist = Math.hypot(wp.x - g.x, wp.y - g.y);
                        if (wDist < 8) {
                            g.currentWp = (g.currentWp + 1) % g.waypoints.length;
                        } else {
                            const targetAngle = Math.atan2(wp.y - g.y, wp.x - g.x);
                            g.angle = targetAngle;
                            g.walkCycle += g.speed * 60 * dt * 0.16;
                            g.x += Math.cos(g.angle) * g.speed * 60 * dt;
                            g.y += Math.sin(g.angle) * g.speed * 60 * dt;
                        }
                    }
                }
            }
        }

        // --- BULLETS UPDATE ---
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            const b = this.bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.life -= dt;

            // Check explosive barrels
            for (let j = this.barrels.length - 1; j >= 0; j--) {
                const bar = this.barrels[j];
                if (!bar.exploded && Math.hypot(bar.x - b.x, bar.y - b.y) <= bar.radius + 4) {
                    this.explodeBarrel(j);
                    this.bullets.splice(i, 1);
                    break;
                }
            }
            if (i >= this.bullets.length) continue;

            // Check obstacle collision
            if (this.checkPointObstacleCollision(b.x, b.y)) {
                this.spawnSparks(b.x, b.y, '#ffd000', 5);
                this.bullets.splice(i, 1);
                continue;
            }

            // Check player hit
            const pDist = Math.hypot(this.player.x - b.x, this.player.y - b.y);
            if (pDist <= this.player.radius) {
                const damage = (op.id === 'juggernaut') ? b.damage * 0.5 : b.damage;
                this.player.hp = Math.max(0, this.player.hp - damage);
                this.triggerScreenShake(0.2, 7);
                this.spawnBlood(this.player.x, this.player.y, 8);
                this.spawnFloatingText(`-${Math.round(damage)}`, this.player.x, this.player.y - 18, '#ff2a5f');

                this.bullets.splice(i, 1);
                this.updateHUD();

                if (this.player.hp <= 0) {
                    this.onGameOver();
                    return;
                }
                continue;
            }

            if (b.life <= 0) {
                this.bullets.splice(i, 1);
            }
        }

        // --- GEMS UPDATE ---
        for (let i = this.gemsList.length - 1; i >= 0; i--) {
            const gem = this.gemsList[i];
            gem.angle += dt * 2.8;
            gem.bob += dt * 4;
            const dist = Math.hypot(this.player.x - gem.x, this.player.y - gem.y);

            if (dist < 95) {
                const angle = Math.atan2(this.player.y - gem.y, this.player.x - gem.x);
                gem.x += Math.cos(angle) * 340 * dt;
                gem.y += Math.sin(angle) * 340 * dt;
            }

            if (dist <= this.player.radius + gem.radius) {
                sound.playGem();
                this.gems += gem.val;
                this.spawnFloatingText(`+${gem.val} 💎`, gem.x, gem.y - 12, '#00f0ff');
                this.spawnSparks(gem.x, gem.y, '#00f0ff', 7);
                this.gemsList.splice(i, 1);
                this.updateHUD();
                this.saveUnlockedOperatives();
            }
        }

        // Check Victory
        if (this.guards.length === 0 && !this.isVictory && !this.isGameOver) {
            this.onVictory();
        }

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        // Update Slash Waves
        for (let i = this.slashWaves.length - 1; i >= 0; i--) {
            const sw = this.slashWaves[i];
            sw.alpha -= dt * 3.5;
            if (sw.alpha <= 0) this.slashWaves.splice(i, 1);
        }

        // Update Floating Texts
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const t = this.floatingTexts[i];
            t.y -= t.vy * dt;
            t.life -= dt;
            if (t.life <= 0) this.floatingTexts.splice(i, 1);
        }

        // Update Tap Ripples
        for (let i = this.tapRipples.length - 1; i >= 0; i--) {
            const r = this.tapRipples[i];
            r.radius += (r.maxRadius - r.radius) * 0.18;
            r.alpha -= dt * 2.5;
            if (r.alpha <= 0) this.tapRipples.splice(i, 1);
        }
    }

    assassinateGuard(idx) {
        const g = this.guards[idx];
        sound.playSlash();
        this.triggerScreenShake(0.18, 6);

        // Blade Slash Arc Wave
        this.slashWaves.push({
            x: g.x,
            y: g.y,
            angle: this.player.angle,
            radius: 34,
            alpha: 1.0,
            color: this.getOperative().color
        });

        // Downed guard body persists on floor
        this.downedBodies.push({
            x: g.x,
            y: g.y,
            angle: g.angle,
            type: g.type,
            alpha: 0.85
        });

        this.spawnBlood(g.x, g.y, 22);
        this.spawnSparks(g.x, g.y, '#ffd000', 14);
        this.spawnFloatingText('STEALTH KILL!', g.x, g.y - 25, '#ffd000');

        // Drop Gems
        const gemDropCount = g.type === 'heavy' ? 3 : 2;
        for (let i = 0; i < gemDropCount; i++) {
            this.gemsList.push({
                x: g.x + (Math.random() * 32 - 16),
                y: g.y + (Math.random() * 32 - 16),
                radius: 11,
                val: 50,
                angle: Math.random() * Math.PI,
                bob: Math.random() * 10
            });
        }

        this.guards.splice(idx, 1);
        this.updateHUD();
    }

    explodeBarrel(idx) {
        const bar = this.barrels[idx];
        bar.exploded = true;
        sound.playExplosion();
        this.triggerScreenShake(0.3, 10);

        this.spawnSparks(bar.x, bar.y, '#ff4400', 25);
        this.spawnSparks(bar.x, bar.y, '#ffd000', 20);

        // Blast radius damages guards and player
        const blastRadius = 140;
        for (let i = this.guards.length - 1; i >= 0; i--) {
            const g = this.guards[i];
            if (Math.hypot(g.x - bar.x, g.y - bar.y) <= blastRadius) {
                this.assassinateGuard(i);
            }
        }

        const pDist = Math.hypot(this.player.x - bar.x, this.player.y - bar.y);
        if (pDist <= blastRadius) {
            const dmg = 45;
            this.player.hp = Math.max(0, this.player.hp - dmg);
            this.spawnFloatingText(`-${dmg}`, this.player.x, this.player.y - 18, '#ff2a5f');
            this.updateHUD();
            if (this.player.hp <= 0) this.onGameOver();
        }

        this.barrels.splice(idx, 1);
    }

    guardShoot(g) {
        sound.playGunshot();
        this.triggerScreenShake(0.1, 3);

        const spread = (Math.random() - 0.5) * 0.1;
        const shootAngle = g.angle + spread;
        const speed = 700;

        this.bullets.push({
            x: g.x + Math.cos(g.angle) * (g.radius + 15),
            y: g.y + Math.sin(g.angle) * (g.radius + 15),
            vx: Math.cos(shootAngle) * speed,
            vy: Math.sin(shootAngle) * speed,
            damage: g.type === 'heavy' ? 24 : 16,
            life: 1.8
        });

        this.particles.push({
            x: g.x + Math.cos(g.angle) * (g.radius + 18),
            y: g.y + Math.sin(g.angle) * (g.radius + 18),
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
            radius: 8,
            color: '#ffea75',
            alpha: 0.9,
            decay: 0.12
        });
    }

    triggerAlarmAlertNearbyGuards(gx, gy) {
        this.guards.forEach(g => {
            if (g.state === 'patrol') {
                const dist = Math.hypot(g.x - gx, g.y - gy);
                if (dist <= 380) {
                    g.state = 'search';
                    g.lastSeenPos = { x: gx, y: gy };
                    g.searchTimer = 4.2;
                }
            }
        });
    }

    // --- RAYCASTING LINE OF SIGHT ---
    checkGuardLineOfSight(guard, px, py) {
        const dx = px - guard.x;
        const dy = py - guard.y;
        const dist = Math.hypot(dx, dy);

        if (dist > guard.fovDist) return false;

        let angleToTarget = Math.atan2(dy, dx);
        let diff = angleToTarget - guard.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        if (Math.abs(diff) > guard.fovAngle / 2) return false;

        return !this.lineIntersectsAnyObstacle(guard.x, guard.y, px, py);
    }

    lineIntersectsAnyObstacle(x1, y1, x2, y2) {
        for (let obs of this.obstacles) {
            if (this.lineIntersectsRect(x1, y1, x2, y2, obs)) {
                return true;
            }
        }
        return false;
    }

    lineIntersectsRect(x1, y1, x2, y2, rect) {
        const minX = rect.x;
        const maxX = rect.x + rect.w;
        const minY = rect.y;
        const maxY = rect.y + rect.h;

        if (x1 >= minX && x1 <= maxX && y1 >= minY && y1 <= maxY) return true;
        if (x2 >= minX && x2 <= maxX && y2 >= minY && y2 <= maxY) return true;

        return (
            this.lineLineIntersection(x1, y1, x2, y2, minX, minY, maxX, minY) ||
            this.lineLineIntersection(x1, y1, x2, y2, maxX, minY, maxX, maxY) ||
            this.lineLineIntersection(x1, y1, x2, y2, maxX, maxY, minX, maxY) ||
            this.lineLineIntersection(x1, y1, x2, y2, minX, maxY, minX, minY)
        );
    }

    lineLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
        const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(den) < 0.0001) return false;

        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
        const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;

        return t >= 0 && t <= 1 && u >= 0 && u <= 1;
    }

    checkCircleObstacleCollision(cx, cy, r) {
        for (let obs of this.obstacles) {
            const nearestX = Math.max(obs.x, Math.min(cx, obs.x + obs.w));
            const nearestY = Math.max(obs.y, Math.min(cy, obs.y + obs.h));
            const dist = Math.hypot(cx - nearestX, cy - nearestY);
            if (dist < r) return true;
        }
        for (let bar of this.barrels) {
            if (!bar.exploded) {
                const dist = Math.hypot(cx - bar.x, cy - bar.y);
                if (dist < r + bar.radius) return true;
            }
        }
        return false;
    }

    checkPointObstacleCollision(px, py) {
        for (let obs of this.obstacles) {
            if (px >= obs.x && px <= obs.x + obs.w && py >= obs.y && py <= obs.y + obs.h) {
                return true;
            }
        }
        return false;
    }

    // --- EFFECTS & PARTICLES ---
    triggerScreenShake(duration, magnitude) {
        this.shakeTime = duration;
        this.shakeMagnitude = magnitude;
    }

    spawnBlood(x, y, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 5 + 1;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                radius: Math.random() * 5 + 3,
                color: '#ff2a5f',
                alpha: 0.9,
                decay: 0.03
            });
        }
    }

    spawnSparks(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 6 + 2;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                radius: Math.random() * 3 + 2,
                color,
                alpha: 1.0,
                decay: 0.05
            });
        }
    }

    spawnFloatingText(text, x, y, color) {
        this.floatingTexts.push({
            text, x, y,
            color,
            vy: 36,
            life: 1.2,
            maxLife: 1.2
        });
    }

    // --- GAME OVER & VICTORY ---
    onGameOver() {
        this.isGameOver = true;
        sound.playAlert();
        document.getElementById('gameover-kills').textContent = `${this.guards.length} Left`;
        document.getElementById('gameover-total-gems').textContent = this.gems.toString();
        this.modalGameOver.classList.add('active');
    }

    onVictory() {
        this.isVictory = true;
        sound.playVictory();
        const bonus = this.stealthAlarmTriggered ? 150 : 300;
        this.gems += bonus;
        this.saveUnlockedOperatives();

        document.getElementById('victory-gems').textContent = `+${bonus} 💎`;
        document.getElementById('victory-stealth').textContent = this.stealthAlarmTriggered ? 'DETECTED' : 'PERFECT SHADOW';
        this.modalVictory.classList.add('active');
    }

    updateHUD() {
        if (!this.player) return;
        this.elGems.textContent = this.gems;
        this.elTargets.textContent = `${this.guards.length} Left`;

        const pct = Math.max(0, (this.player.hp / this.player.maxHp) * 100);
        this.elHealth.style.width = `${pct}%`;
        if (pct < 30) {
            this.elHealth.style.background = 'var(--neon-red)';
        } else if (pct < 60) {
            this.elHealth.style.background = 'var(--neon-yellow)';
        } else {
            this.elHealth.style.background = 'linear-gradient(90deg, var(--neon-green), #88ff00)';
        }
    }

    // --- OPERATIVE ROSTER STORE ---
    openRoster() {
        this.isPaused = true;
        const container = document.getElementById('roster-container');
        container.innerHTML = '';

        OPERATIVES.forEach(op => {
            const card = document.createElement('div');
            card.className = `roster-card ${op.id === this.currentOperativeId ? 'selected' : ''}`;

            const info = document.createElement('div');
            info.className = 'roster-info';
            info.innerHTML = `
                <h4>${op.name}</h4>
                <p>${op.desc} • Spd: ${op.speed} • HP: ${op.maxHp}</p>
            `;

            const btn = document.createElement('button');
            btn.className = 'roster-btn';

            if (op.id === this.currentOperativeId) {
                btn.textContent = 'ACTIVE';
                btn.style.background = 'var(--neon-cyan)';
                btn.style.color = '#000';
            } else if (op.unlocked) {
                btn.textContent = 'SELECT';
                btn.style.background = 'rgba(255,255,255,0.15)';
                btn.style.color = '#fff';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    this.currentOperativeId = op.id;
                    this.saveUnlockedOperatives();
                    this.loadSector(this.sectorIndex);
                    this.openRoster();
                };
            } else {
                btn.textContent = `UNLOCK (${op.cost} 💎)`;
                btn.style.background = (this.gems >= op.cost) ? 'var(--neon-yellow)' : 'rgba(255,255,255,0.08)';
                btn.style.color = (this.gems >= op.cost) ? '#000' : '#777';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (this.gems >= op.cost) {
                        this.gems -= op.cost;
                        op.unlocked = true;
                        this.currentOperativeId = op.id;
                        this.saveUnlockedOperatives();
                        this.loadSector(this.sectorIndex);
                        this.openRoster();
                    } else {
                        alert('Not enough gems! Eliminate sentries to earn more.');
                    }
                };
            }

            card.appendChild(info);
            card.appendChild(btn);
            container.appendChild(card);
        });

        this.modalRoster.classList.add('active');
    }

    // --- 2.5D RENDERING PIPELINE ---
    render() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        let offsetX = -this.camera.x;
        let offsetY = -this.camera.y;

        if (this.shakeTime > 0) {
            offsetX += (Math.random() * 2 - 1) * this.shakeMagnitude;
            offsetY += (Math.random() * 2 - 1) * this.shakeMagnitude;
        }

        this.ctx.save();
        this.ctx.translate(offsetX, offsetY);

        // 1. Stylized Concrete Warehouse Floor with Hazard Markings
        this.drawWarehouseFloor();

        // 2. Downed Guard Bodies (Persisting Ground Marks)
        this.downedBodies.forEach(b => this.drawDownedBody(b));

        // 3. Tap Navigation Ripples
        this.tapRipples.forEach(r => {
            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            this.ctx.strokeStyle = r.color;
            this.ctx.globalAlpha = r.alpha;
            this.ctx.lineWidth = 2.5;
            this.ctx.stroke();
            this.ctx.restore();
        });

        // 4. Guard Flashlights (Raycasted Dynamic Light Cones with Soft Edges)
        this.guards.forEach(g => this.drawGuardVisionCone(g));

        // 5. Ambient Dust Particles (Floating In Air / Beams)
        this.drawAmbientDust();

        // 6. 2.5D Pseudo-3D Obstacles (Crates, Containers, Walls)
        this.obstacles.forEach(obs => this.draw3DObstacle(obs));

        // 7. Explosive Red TNT Barrels
        this.barrels.forEach(bar => this.drawBarrel(bar));

        // 8. Glowing 3D Faceted Gems
        this.gemsList.forEach(gem => this.draw3DGem(gem));

        // 9. Bullets
        this.bullets.forEach(b => this.drawBullet(b));

        // 10. Guards (Stylized Armored Sentries with Rifles & Lasers)
        this.guards.forEach(g => this.drawGuard(g));

        // 11. Player (Stylized Operative with Walking Strides & Twin Blades)
        if (this.player) this.drawPlayer(this.player);

        // 12. Crescent Katana Slash Arcs
        this.slashWaves.forEach(sw => this.drawSlashWave(sw));

        // 13. Particles & Sparks
        this.particles.forEach(p => {
            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = Math.max(0, p.alpha);
            this.ctx.fill();
            this.ctx.restore();
        });

        // 14. Floating Combat Damage & Gem Texts
        this.floatingTexts.forEach(t => {
            this.ctx.save();
            this.ctx.font = 'bold 15px Orbitron, sans-serif';
            this.ctx.fillStyle = t.color;
            this.ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
            this.ctx.textAlign = 'center';
            this.ctx.shadowColor = t.color;
            this.ctx.shadowBlur = 8;
            this.ctx.fillText(t.text, t.x, t.y);
            this.ctx.restore();
        });

        this.ctx.restore();

        // 15. Cinematic Ambient Vignette (Dark Moody Stealth Atmosphere)
        this.drawCinematicVignette();
    }

    drawWarehouseFloor() {
        const tileSize = 64;
        const cols = Math.ceil(this.worldWidth / tileSize);
        const rows = Math.ceil(this.worldHeight / tileSize);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const x = c * tileSize;
                const y = r * tileSize;
                const isEven = (c + r) % 2 === 0;

                this.ctx.fillStyle = isEven ? '#12151d' : '#151922';
                this.ctx.fillRect(x, y, tileSize, tileSize);

                // Subtle tile border joint
                this.ctx.strokeStyle = '#0e1017';
                this.ctx.lineWidth = 1;
                this.ctx.strokeRect(x, y, tileSize, tileSize);
            }
        }

        // Perimeter Yellow/Black Caution Stripes
        this.drawHazardBorder(25, 25, this.worldWidth - 50, this.worldHeight - 50);
    }

    drawHazardBorder(x, y, w, h) {
        this.ctx.save();
        this.ctx.strokeStyle = '#ffd000';
        this.ctx.lineWidth = 4;
        this.ctx.strokeRect(x, y, w, h);

        // Corner hazard diagonals
        const drawStripes = (sx, sy, sw, sh) => {
            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.rect(sx, sy, sw, sh);
            this.ctx.clip();
            this.ctx.fillStyle = '#ffd000';
            for (let i = -sw; i < sw + sh; i += 16) {
                this.ctx.beginPath();
                this.ctx.moveTo(sx + i, sy);
                this.ctx.lineTo(sx + i + 8, sy);
                this.ctx.lineTo(sx + i + 8 - sh, sy + sh);
                this.ctx.lineTo(sx + i - sh, sy + sh);
                this.ctx.fill();
            }
            this.ctx.restore();
        };

        drawStripes(x, y, 70, 10);
        drawStripes(x + w - 70, y, 70, 10);
        drawStripes(x, y + h - 10, 70, 10);
        drawStripes(x + w - 70, y + h - 10, 70, 10);
        this.ctx.restore();
    }

    drawDownedBody(b) {
        this.ctx.save();
        this.ctx.translate(b.x, b.y);
        this.ctx.rotate(b.angle);

        // Dark tactical puddle
        this.ctx.fillStyle = 'rgba(15, 6, 10, 0.7)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 0, 24, 15, 0, 0, Math.PI * 2);
        this.ctx.fill();

        // Downed guard silhouette
        this.ctx.fillStyle = b.type === 'heavy' ? '#321d24' : '#1c222d';
        this.ctx.strokeStyle = '#000000';
        this.ctx.lineWidth = 1.5;

        // Torso
        this.ctx.fillRect(-12, -7, 24, 14);
        this.ctx.strokeRect(-12, -7, 24, 14);

        // Helmet
        this.ctx.beginPath();
        this.ctx.arc(14, 0, 7, 0, Math.PI * 2);
        this.ctx.fillStyle = '#2d3748';
        this.ctx.fill();
        this.ctx.stroke();

        this.ctx.restore();
    }

    draw3DObstacle(obs) {
        const depth = 16; // 2.5D perspective height

        this.ctx.save();

        // 1. Projected Floor Drop-Shadow
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        this.ctx.fillRect(obs.x + 8, obs.y + depth, obs.w, obs.h);

        if (obs.type === 'wall') {
            // Concrete Perimeter Blast Wall
            this.ctx.fillStyle = '#1c202a';
            this.ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

            // Top rim
            this.ctx.fillStyle = '#2e3546';
            this.ctx.fillRect(obs.x, obs.y, obs.w, 4);
            this.ctx.strokeStyle = '#10131a';
            this.ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);

        } else if (obs.type === 'wood') {
            // Wooden Cargo Crate (3D Block)
            // Front / South face in shadow
            this.ctx.fillStyle = '#5c3a21';
            this.ctx.fillRect(obs.x, obs.y + obs.h - depth, obs.w, depth);

            // Front planks
            this.ctx.strokeStyle = '#3d2514';
            this.ctx.lineWidth = 1.5;
            for (let px = obs.x + 20; px < obs.x + obs.w; px += 20) {
                this.ctx.beginPath();
                this.ctx.moveTo(px, obs.y + obs.h - depth);
                this.ctx.lineTo(px, obs.y + obs.h);
                this.ctx.stroke();
            }

            // Top face (Illuminated)
            this.ctx.fillStyle = '#a66e3b';
            this.ctx.fillRect(obs.x, obs.y, obs.w, obs.h - depth);

            // Wood slats on top
            this.ctx.strokeStyle = '#825227';
            this.ctx.lineWidth = 1.5;
            for (let py = obs.y + 18; py < obs.y + obs.h - depth; py += 18) {
                this.ctx.beginPath();
                this.ctx.moveTo(obs.x, py);
                this.ctx.lineTo(obs.x + obs.w, py);
                this.ctx.stroke();
            }

            // Cross diagonal bracing
            this.ctx.strokeStyle = '#c4874d';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(obs.x + 3, obs.y + 3, obs.w - 6, obs.h - depth - 6);

            // Metal corner caps
            this.ctx.fillStyle = '#2b2f38';
            const cap = 8;
            this.ctx.fillRect(obs.x, obs.y, cap, cap);
            this.ctx.fillRect(obs.x + obs.w - cap, obs.y, cap, cap);
            this.ctx.fillRect(obs.x, obs.y + obs.h - depth - cap, cap, cap);
            this.ctx.fillRect(obs.x + obs.w - cap, obs.y + obs.h - depth - cap, cap, cap);

        } else {
            // Metal Shipping Container (3D Ribbed Corrugated Steel)
            // Front / South face in shadow
            this.ctx.fillStyle = '#17202f';
            this.ctx.fillRect(obs.x, obs.y + obs.h - depth, obs.w, depth);

            // Vertical ribs on front
            this.ctx.strokeStyle = '#0c121d';
            this.ctx.lineWidth = 2;
            for (let rx = obs.x + 12; rx < obs.x + obs.w; rx += 14) {
                this.ctx.beginPath();
                this.ctx.moveTo(rx, obs.y + obs.h - depth);
                this.ctx.lineTo(rx, obs.y + obs.h);
                this.ctx.stroke();
            }

            // Top face (Illuminated military navy/steel)
            this.ctx.fillStyle = '#2c3c56';
            this.ctx.fillRect(obs.x, obs.y, obs.w, obs.h - depth);

            // Corrugated ribs on top
            this.ctx.strokeStyle = '#394d6e';
            this.ctx.lineWidth = 2;
            for (let rx = obs.x + 14; rx < obs.x + obs.w; rx += 16) {
                this.ctx.beginPath();
                this.ctx.moveTo(rx, obs.y + 4);
                this.ctx.lineTo(rx, obs.y + obs.h - depth - 4);
                this.ctx.stroke();
            }

            // Border frame
            this.ctx.strokeStyle = '#1b2536';
            this.ctx.lineWidth = 2;
            this.ctx.strokeRect(obs.x, obs.y, obs.w, obs.h - depth);

            // White Stencil Marking on container
            if (obs.w > 60 && obs.h > 60) {
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                this.ctx.font = 'bold 9px Orbitron, sans-serif';
                this.ctx.fillText('CARGO-08', obs.x + 8, obs.y + 14);
            }
        }

        this.ctx.restore();
    }

    drawBarrel(bar) {
        if (bar.exploded) return;
        this.ctx.save();
        this.ctx.translate(bar.x, bar.y);

        // Shadow
        this.ctx.fillStyle = 'rgba(0,0,0,0.45)';
        this.ctx.beginPath();
        this.ctx.ellipse(3, 8, bar.radius, bar.radius * 0.6, 0, 0, Math.PI * 2);
        this.ctx.fill();

        // Red Barrel Cylinder
        this.ctx.beginPath();
        this.ctx.arc(0, 0, bar.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = '#c02626';
        this.ctx.strokeStyle = '#7f1d1d';
        this.ctx.lineWidth = 2;
        this.ctx.fill();
        this.ctx.stroke();

        // Inner rim
        this.ctx.beginPath();
        this.ctx.arc(0, 0, bar.radius * 0.7, 0, Math.PI * 2);
        this.ctx.fillStyle = '#dc2626';
        this.ctx.strokeStyle = '#991b1b';
        this.ctx.lineWidth = 1.5;
        this.ctx.fill();
        this.ctx.stroke();

        // Yellow Warning Flame / TNT text
        this.ctx.fillStyle = '#ffd000';
        this.ctx.font = 'bold 9px Orbitron, sans-serif';
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText('TNT', 0, 0);

        this.ctx.restore();
    }

    drawGuardVisionCone(g) {
        const rayCount = 42;
        const startAngle = g.angle - g.fovAngle / 2;
        const angleStep = g.fovAngle / rayCount;

        const points = [{ x: g.x, y: g.y }];

        for (let i = 0; i <= rayCount; i++) {
            const rayAngle = startAngle + i * angleStep;
            let closestDist = g.fovDist;

            const rx2 = g.x + Math.cos(rayAngle) * g.fovDist;
            const ry2 = g.y + Math.sin(rayAngle) * g.fovDist;

            for (let obs of this.obstacles) {
                const dist = this.getRayRectIntersectionDist(g.x, g.y, rx2, ry2, obs);
                if (dist !== null && dist < closestDist) {
                    closestDist = dist;
                }
            }

            points.push({
                x: g.x + Math.cos(rayAngle) * closestDist,
                y: g.y + Math.sin(rayAngle) * closestDist
            });
        }

        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            this.ctx.lineTo(points[i].x, points[i].y);
        }
        this.ctx.closePath();

        let baseColor = '255, 208, 0';
        if (g.state === 'combat') baseColor = '255, 42, 95';
        else if (g.state === 'alerting') baseColor = '255, 140, 0';

        // Outer ambient glow
        const grad = this.ctx.createRadialGradient(g.x, g.y, 14, g.x, g.y, g.fovDist);
        grad.addColorStop(0, `rgba(${baseColor}, 0.65)`);
        grad.addColorStop(0.5, `rgba(${baseColor}, 0.28)`);
        grad.addColorStop(1, `rgba(${baseColor}, 0.0)`);

        this.ctx.fillStyle = grad;
        this.ctx.fill();

        // Edge stroke
        this.ctx.strokeStyle = `rgba(${baseColor}, 0.55)`;
        this.ctx.lineWidth = 2;
        this.ctx.stroke();

        this.ctx.restore();
    }

    drawAmbientDust() {
        this.ctx.save();
        this.ambientDust.forEach(d => {
            this.ctx.beginPath();
            this.ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = '#ffffff';
            this.ctx.globalAlpha = d.alpha;
            this.ctx.fill();
        });
        this.ctx.restore();
    }

    draw3DGem(gem) {
        const floatY = Math.sin(gem.bob) * 3;
        this.ctx.save();
        this.ctx.translate(gem.x, gem.y + floatY);

        // Ground shadow
        this.ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 14, 8, 4, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.rotate(gem.angle);

        // Radiant diamond flare
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 14;

        // Outer Facet
        this.ctx.fillStyle = '#00f0ff';
        this.ctx.beginPath();
        this.ctx.moveTo(0, -gem.radius);
        this.ctx.lineTo(gem.radius, 0);
        this.ctx.lineTo(0, gem.radius);
        this.ctx.lineTo(-gem.radius, 0);
        this.ctx.closePath();
        this.ctx.fill();

        // Inner Light Facet
        this.ctx.fillStyle = '#e0faff';
        this.ctx.beginPath();
        this.ctx.moveTo(0, -gem.radius * 0.45);
        this.ctx.lineTo(gem.radius * 0.45, 0);
        this.ctx.lineTo(0, gem.radius * 0.45);
        this.ctx.lineTo(-gem.radius * 0.45, 0);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.restore();
    }

    drawBullet(b) {
        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        this.ctx.fillStyle = '#ffd000';
        this.ctx.shadowColor = '#ff2a5f';
        this.ctx.shadowBlur = 10;
        this.ctx.fill();

        // Bullet streak trail
        this.ctx.strokeStyle = 'rgba(255, 208, 0, 0.4)';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.moveTo(b.x, b.y);
        this.ctx.lineTo(b.x - b.vx * 0.04, b.y - b.vy * 0.04);
        this.ctx.stroke();
        this.ctx.restore();
    }

    drawSlashWave(sw) {
        this.ctx.save();
        this.ctx.translate(sw.x, sw.y);
        this.ctx.rotate(sw.angle);
        this.ctx.globalAlpha = sw.alpha;

        // Glowing Katana Arc Trail
        this.ctx.beginPath();
        this.ctx.arc(0, 0, sw.radius, -Math.PI * 0.45, Math.PI * 0.45);
        this.ctx.strokeStyle = sw.color;
        this.ctx.lineWidth = 6;
        this.ctx.shadowColor = sw.color;
        this.ctx.shadowBlur = 16;
        this.ctx.stroke();

        this.ctx.beginPath();
        this.ctx.arc(0, 0, sw.radius, -Math.PI * 0.35, Math.PI * 0.35);
        this.ctx.strokeStyle = '#ffffff';
        this.ctx.lineWidth = 2.5;
        this.ctx.stroke();
        this.ctx.restore();
    }

    // --- CHARACTER SPRITE: SENTRY (GUARD) ---
    drawGuard(g) {
        this.ctx.save();
        this.ctx.translate(g.x, g.y);

        // Ground shadow
        this.ctx.fillStyle = 'rgba(0,0,0,0.45)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 5, g.radius * 0.9, g.radius * 0.5, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.rotate(g.angle);

        // 1. Patrolling Boots / Leg Strides
        const legOffset = Math.sin(g.walkCycle) * 6;
        this.ctx.fillStyle = '#0f172a';
        this.ctx.fillRect(-7, 8 + legOffset, 6, 8);
        this.ctx.fillRect(1, 8 - legOffset, 6, 8);

        // 2. Tactical Assault Rifle / Weapon
        this.ctx.fillStyle = '#1e293b';
        this.ctx.fillRect(8, 2, 18, 5); // Rifle barrel
        this.ctx.fillRect(6, 4, 8, 8);  // Rifle stock & grip

        // Flashlight Mounted on Rifle
        this.ctx.fillStyle = '#ffd000';
        this.ctx.fillRect(24, 1, 4, 7);

        // Red Laser Aim Line in Combat
        if (g.state === 'combat') {
            this.ctx.save();
            this.ctx.strokeStyle = 'rgba(255, 42, 95, 0.7)';
            this.ctx.lineWidth = 1.5;
            this.ctx.beginPath();
            this.ctx.moveTo(26, 4);
            this.ctx.lineTo(260, 4);
            this.ctx.stroke();
            this.ctx.restore();
        }

        // 3. Armored Shoulders & Torso
        this.ctx.beginPath();
        this.ctx.ellipse(0, 0, g.radius * 0.85, g.radius * 0.65, 0, 0, Math.PI * 2);
        this.ctx.fillStyle = g.type === 'heavy' ? '#451a24' : '#1e293b';
        this.ctx.strokeStyle = g.type === 'heavy' ? '#ff2a5f' : '#475569';
        this.ctx.lineWidth = 2;
        this.ctx.fill();
        this.ctx.stroke();

        // 4. Combat Helmet & Visor
        this.ctx.beginPath();
        this.ctx.arc(0, 0, g.radius * 0.55, 0, Math.PI * 2);
        this.ctx.fillStyle = g.type === 'heavy' ? '#230e15' : '#0f172a';
        this.ctx.fill();

        // Visor glow
        this.ctx.fillStyle = (g.state === 'combat') ? '#ff2a5f' : '#ffd000';
        this.ctx.fillRect(g.radius * 0.15, -4, 5, 8);

        this.ctx.restore();

        // Alert Indicator Emote
        if (g.state === 'alerting' || g.state === 'combat') {
            this.ctx.save();
            this.ctx.font = '900 24px Orbitron, sans-serif';
            this.ctx.fillStyle = (g.state === 'combat') ? '#ff2a5f' : '#ffd000';
            this.ctx.textAlign = 'center';
            this.ctx.shadowColor = this.ctx.fillStyle;
            this.ctx.shadowBlur = 12;
            this.ctx.fillText('!', g.x, g.y - g.radius - 12);
            this.ctx.restore();
        } else if (g.state === 'search') {
            this.ctx.save();
            this.ctx.font = '900 20px Orbitron, sans-serif';
            this.ctx.fillStyle = '#ffd000';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('?', g.x, g.y - g.radius - 12);
            this.ctx.restore();
        }
    }

    // --- CHARACTER SPRITE: HUNTER (PLAYER OPERATIVE) ---
    drawPlayer(p) {
        const op = this.getOperative();
        this.ctx.save();
        this.ctx.translate(p.x, p.y);

        // Ground shadow
        this.ctx.fillStyle = 'rgba(0,0,0,0.5)';
        this.ctx.beginPath();
        this.ctx.ellipse(0, 6, p.radius * 0.9, p.radius * 0.55, 0, 0, Math.PI * 2);
        this.ctx.fill();

        this.ctx.rotate(p.angle);

        // 1. Animated Running Boots / Strides
        const stride = p.isMoving ? Math.sin(p.walkCycle) * 7 : 0;
        this.ctx.fillStyle = '#0a0e17';
        this.ctx.fillRect(-8, 9 + stride, 6, 8);
        this.ctx.fillRect(2, 9 - stride, 6, 8);

        // 2. Twin Combat Blades / Katanas
        this.ctx.fillStyle = '#cbd5e1'; // Metallic blade
        this.ctx.fillRect(8, -12, 18, 3);
        this.ctx.fillRect(8, 9, 18, 3);

        // Blade Handles
        this.ctx.fillStyle = op.color;
        this.ctx.fillRect(4, -13, 5, 5);
        this.ctx.fillRect(4, 8, 5, 5);

        // 3. Stealth Operative Shoulders & Ballistic Vest
        this.ctx.beginPath();
        this.ctx.ellipse(0, 0, p.radius * 0.9, p.radius * 0.7, 0, 0, Math.PI * 2);
        this.ctx.fillStyle = '#0f172a';
        this.ctx.strokeStyle = op.color;
        this.ctx.lineWidth = 2.5;
        this.ctx.shadowColor = op.color;
        this.ctx.shadowBlur = p.isDashing ? 18 : 6;
        this.ctx.fill();
        this.ctx.stroke();

        // 4. Tactical Hood / Cowl & High-Tech Goggles
        this.ctx.beginPath();
        this.ctx.arc(0, 0, p.radius * 0.52, 0, Math.PI * 2);
        this.ctx.fillStyle = '#060911';
        this.ctx.fill();

        // Glowing Visor
        this.ctx.fillStyle = op.color;
        this.ctx.shadowColor = op.color;
        this.ctx.shadowBlur = 10;
        this.ctx.fillRect(p.radius * 0.12, -4, 6, 8);

        this.ctx.restore();
    }

    drawCinematicVignette() {
        const rad = Math.max(this.width, this.height) * 0.75;
        const grad = this.ctx.createRadialGradient(
            this.width / 2, this.height / 2, rad * 0.45,
            this.width / 2, this.height / 2, rad
        );
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.0)');
        grad.addColorStop(1, 'rgba(4, 6, 10, 0.65)');

        this.ctx.fillStyle = grad;
        this.ctx.fillRect(0, 0, this.width, this.height);
    }

    // --- RAY INTERSECTIONS ---
    getRayRectIntersectionDist(x1, y1, x2, y2, rect) {
        const minX = rect.x;
        const maxX = rect.x + rect.w;
        const minY = rect.y;
        const maxY = rect.y + rect.h;

        let closest = null;
        const lines = [
            [minX, minY, maxX, minY],
            [maxX, minY, maxX, maxY],
            [maxX, maxY, minX, maxY],
            [minX, maxY, minX, minY]
        ];

        for (let [x3, y3, x4, y4] of lines) {
            const pt = this.getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4);
            if (pt) {
                const dist = Math.hypot(pt.x - x1, pt.y - y1);
                if (closest === null || dist < closest) {
                    closest = dist;
                }
            }
        }
        return closest;
    }

    getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
        const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(den) < 0.0001) return null;

        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
        const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;

        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
            return {
                x: x1 + t * (x2 - x1),
                y: y1 + t * (y2 - y1)
            };
        }
        return null;
    }

    // --- MINIMAP RADAR ---
    renderMinimap() {
        const mCtx = this.minimapCtx;
        const mw = 110;
        const mh = 110;
        mCtx.clearRect(0, 0, mw, mh);

        const scaleX = mw / this.worldWidth;
        const scaleY = mh / this.worldHeight;

        mCtx.fillStyle = 'rgba(10, 14, 22, 0.9)';
        mCtx.fillRect(0, 0, mw, mh);

        mCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        this.obstacles.forEach(obs => {
            mCtx.fillRect(obs.x * scaleX, obs.y * scaleY, obs.w * scaleX, obs.h * scaleY);
        });

        mCtx.fillStyle = '#ff4400';
        this.barrels.forEach(bar => {
            if (!bar.exploded) {
                mCtx.beginPath();
                mCtx.arc(bar.x * scaleX, bar.y * scaleY, 2, 0, Math.PI * 2);
                mCtx.fill();
            }
        });

        mCtx.fillStyle = '#00f0ff';
        this.gemsList.forEach(gem => {
            mCtx.fillRect(gem.x * scaleX - 1, gem.y * scaleY - 1, 2, 2);
        });

        this.guards.forEach(g => {
            mCtx.fillStyle = (g.state === 'combat') ? '#ff2a5f' : '#ffd000';
            mCtx.beginPath();
            mCtx.arc(g.x * scaleX, g.y * scaleY, 2.5, 0, Math.PI * 2);
            mCtx.fill();
        });

        if (this.player) {
            mCtx.fillStyle = '#00ff88';
            mCtx.beginPath();
            mCtx.arc(this.player.x * scaleX, this.player.y * scaleY, 3.5, 0, Math.PI * 2);
            mCtx.fill();
        }

        mCtx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
        mCtx.lineWidth = 1;
        mCtx.strokeRect(0, 0, mw, mh);
    }
}

// Start Game
window.addEventListener('load', () => {
    new Game();
});
</script>
