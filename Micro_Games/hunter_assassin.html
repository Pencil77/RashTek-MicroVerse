<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hunter Assassin - MicroVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --neon-cyan: #00f0ff;
            --neon-red: #ff2a5f;
            --neon-yellow: #ffd000;
            --neon-green: #00ff88;
            --panel-bg: rgba(14, 18, 27, 0.85);
            --border-glow: rgba(0, 240, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #f0f4f8;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
            overflow: hidden;
            background: #0d0f14;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top Bar & HUD */
        .hud-header {
            position: absolute;
            top: 14px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 20;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .hud-pill {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .hud-label {
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: #8da2b5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-val {
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #fff;
        }

        .val-gems { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6); }
        .val-targets { color: var(--neon-red); text-shadow: 0 0 10px rgba(255,42,95,0.6); }

        /* Health Bar */
        .health-bar-wrap {
            width: 110px;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-green), #88ff00);
            transition: width 0.2s ease, background 0.3s ease;
        }

        .nav-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 8px 14px;
            border-radius: 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            pointer-events: auto;
        }

        .nav-btn:hover, .nav-btn:active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }

        /* Minimap Overlay */
        #minimap-canvas {
            position: absolute;
            top: 70px;
            right: 16px;
            width: 110px;
            height: 110px;
            border-radius: 12px;
            border: 1px solid var(--border-glow);
            background: rgba(10, 14, 22, 0.85);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            pointer-events: none;
            z-index: 20;
        }

        /* Floating Controls for Mobile */
        #mobile-dash-btn {
            position: absolute;
            bottom: 28px;
            right: 28px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 240, 255, 0.05));
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            backdrop-filter: blur(8px);
            cursor: pointer;
            z-index: 30;
            transition: transform 0.1s, background 0.1s;
        }

        #mobile-dash-btn:active {
            transform: scale(0.92);
            background: rgba(0, 240, 255, 0.45);
        }

        /* Overlays & Modals */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 8, 14, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #121622;
            border: 2px solid var(--border-glow);
            border-radius: 20px;
            padding: 32px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.15);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .title-success { color: var(--neon-cyan); text-shadow: 0 0 25px rgba(0,240,255,0.7); }
        .title-danger { color: var(--neon-red); text-shadow: 0 0 25px rgba(255,42,95,0.7); }
        .title-gold { color: var(--neon-yellow); text-shadow: 0 0 25px rgba(255,208,0,0.7); }

        .modal-subtitle {
            font-size: 16px;
            color: #8da2b5;
            margin-bottom: 24px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 12px;
        }

        .stat-box-label {
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            color: #7b8e9f;
            text-transform: uppercase;
        }

        .stat-box-val {
            font-size: 22px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            color: #fff;
            margin-top: 4px;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--neon-cyan), #00aaff);
            color: #060810;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .action-btn:hover, .action-btn:active {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: none;
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Operatives Store Modal */
        .roster-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 4px;
        }

        .roster-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: all 0.2s;
            cursor: pointer;
        }

        .roster-card.selected {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .roster-info h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #fff;
        }

        .roster-info p {
            font-size: 12px;
            color: #8da2b5;
            margin-top: 2px;
        }

        .roster-btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Virtual Joystick */
        #touch-joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.05);
            display: none;
            pointer-events: none;
            z-index: 25;
            transform: translate(-50%, -50%);
        }

        #touch-stick {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            top: 36px;
            left: 36px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <canvas id="minimap-canvas" width="110" height="110"></canvas>

    <!-- Top HUD -->
    <div class="hud-header">
        <div class="hud-group">
            <a href="index.html" class="nav-btn">← Exit</a>

    <div id="modal-victory" class="modal-overlay">

            <div class="stat-grid">

                <div class="stat-box">

                </div>
            </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title title-danger">MISSION FAILED</h2>
            <p class="modal-subtitle">Operative compromised by sentry fire.</p>
            <div class="stat-grid">
                <div class="stat-box">
                    <div class="stat-box-label">Sentries Taken</div>
                    <div id="gameover-kills" class="stat-box-val">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-box-label">Total Gems</div>
                    <div id="gameover-total-gems" class="stat-box-val val-gems">0</div>
                </div>
            </div>
            <button id="btn-retry" class="action-btn">Deploy Again ↺</button>
            <button id="btn-gameover-roster" class="action-btn secondary">Upgrade Operative</button>
        </div>
    </div>

    <!-- Operatives Roster / Store Modal -->
    <div id="modal-roster" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title title-gold">OPERATIVE VAULT</h2>
            <p class="modal-subtitle">Select or unlock tactical stealth agents.</p>
            <div id="roster-container" class="roster-list"></div>
            <button id="btn-close-roster" class="action-btn">Return To Mission</button>
        </div>
    </div>
</div>

<script>
/**
 * HUNTER ASSASSIN - TACTICAL STEALTH WEB MINI-GAME
 * Built for RashTek MicroVerse
 * Inspired by top-down stealth assassination mechanics
 */

// --- AUDIO SYNTHESIZER (100% Web Audio API, Zero External Assets) ---
class SoundSystem {
    constructor() {
        this.ctx = null;
        this.enabled = true;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playFootstep() {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.06);
    }

    playSlash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.15;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(400, now + 0.15);
        filter.Q.value = 3.0;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
    }

    playAlert() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(750, now + 0.18);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.22);
    }

    playGunshot() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        noise.connect(gain);
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
        osc.start(now);
        osc.stop(now + 0.12);
    }

    playGem() {
        if (!this.enabled || !this.ctx) return;
        const notes = [659.25, 830.61, 1046.50]; // E5, G#5, C6
        notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + idx * 0.05;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.15, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.18);
        });
    }

    playVictory() {
        if (!this.enabled || !this.ctx) return;
        const chords = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        chords.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + i * 0.08;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.2, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.5);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.5);
        });
    }

    playDash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
    }
}

const sound = new SoundSystem();

// --- OPERATIVES DATA ---
const OPERATIVES = [
    {
        id: 'stalker',
        name: 'Shadow Stalker',
        desc: 'Balanced infiltrator with high combat resilience.',
        speed: 3.4,
        maxHp: 100,
        dashCooldown: 2.5,
        color: '#00f0ff',
        cost: 0,
        unlocked: true
    },
    {
        id: 'ninja',
        name: 'Cyber Shinobi',
        desc: 'High velocity assassin with rapid dash recovery.',
        speed: 4.2,
        maxHp: 80,
        dashCooldown: 1.4,
        color: '#ffd000',
        cost: 400,
        unlocked: false
    },
    {
        id: 'juggernaut',
        name: 'Iron Vanguard',
        desc: 'Armored commando with massive HP and bullet shielding.',
        speed: 2.9,
        maxHp: 190,
        dashCooldown: 3.2,
        color: '#ff2a5f',
        cost: 800,
        unlocked: false
    },
    {
        id: 'spectre',
        name: 'Phantom Ghost',
        desc: 'Silent operative. Sentries take 50% longer to spot.',
        speed: 3.8,
        maxHp: 110,
        dashCooldown: 2.0,
        color: '#00ff88',
        cost: 1500,
        unlocked: false
    }
];

// --- GAME STATE ---
class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.minimapCanvas = document.getElementById('minimap-canvas');
        this.minimapCtx = this.minimapCanvas.getContext('2d');

        this.width = window.innerWidth;
        this.height = window.innerHeight;

        // Persistent stats
        this.gems = parseInt(localStorage.getItem('rtk_assassin_gems') || '0', 10);
        this.currentOperativeId = localStorage.getItem('rtk_assassin_op') || 'stalker';
        this.loadUnlockedOperatives();

        this.sectorIndex = 0;
        this.player = null;
        this.guards = [];
        this.obstacles = [];
        this.gemsList = [];
        this.bullets = [];
        this.particles = [];
        this.floatingTexts = [];
        this.tapRipples = [];

        this.worldWidth = 1400;
        this.worldHeight = 1100;

        this.camera = { x: 0, y: 0 };
        this.shakeTime = 0;
        this.shakeMagnitude = 0;

        this.inputMode = 'tap'; // 'tap', 'joystick', 'keyboard'
        this.targetPos = null;
        this.keys = {};
        this.touchStart = null;
        this.joystickActive = false;
        this.joystickPos = { x: 0, y: 0 };
        this.joystickVector = { x: 0, y: 0 };

        this.isGameOver = false;
        this.isVictory = false;
        this.isPaused = false;
        this.stealthAlarmTriggered = false;

        this.lastTime = performance.now();

        this.initDOM();
        this.initEvents();
        this.resize();
        this.loadSector(this.sectorIndex);
        this.loop();
    }

    loadUnlockedOperatives() {
        const stored = localStorage.getItem('rtk_assassin_unlocked');
        if (stored) {
            try {
                const ids = JSON.parse(stored);
                OPERATIVES.forEach(op => {
                    if (ids.includes(op.id)) op.unlocked = true;
                });
            } catch (e) {}
        }
        OPERATIVES[0].unlocked = true;
    }

    saveUnlockedOperatives() {
        const unlockedIds = OPERATIVES.filter(o => o.unlocked).map(o => o.id);
        localStorage.setItem('rtk_assassin_unlocked', JSON.stringify(unlockedIds));
        localStorage.setItem('rtk_assassin_gems', this.gems.toString());
        localStorage.setItem('rtk_assassin_op', this.currentOperativeId);
    }

    getOperative() {
        return OPERATIVES.find(o => o.id === this.currentOperativeId) || OPERATIVES[0];
    }

    initEvents() {
        window.addEventListener('resize', () => this.resize());

        // Keyboard
        window.addEventListener('keydown', (e) => {
            sound.init();
            this.keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                this.dash();
            }
        });

        window.addEventListener('keyup', (e) => {
            this.keys[e.key.toLowerCase()] = false;
        });

        // Pointer & Touch Events (Seamless Tap-to-Move + Drag-to-Steer)
        this.touchData = null;

        this.canvas.addEventListener('pointerdown', (e) => {
            sound.init();
            if (e.pointerType === 'touch') {
                this.touchData = {
                    id: e.pointerId,
                    startX: e.clientX,
                    startY: e.clientY,
                    startTime: performance.now(),
                    isDragging: false
                };
            } else {
                // Desktop Click to move
                const worldPos = this.screenToWorld(e.clientX, e.clientY);
                this.setDestination(worldPos.x, worldPos.y);
            }
        });

        this.canvas.addEventListener('pointermove', (e) => {
            if (e.pointerType === 'touch' && this.touchData && e.pointerId === this.touchData.id) {
                const dx = e.clientX - this.touchData.startX;
                const dy = e.clientY - this.touchData.startY;
                const dist = Math.hypot(dx, dy);

                if (!this.touchData.isDragging && dist > 14) {
                    this.touchData.isDragging = true;
                    this.joystickActive = true;
                    this.joystickPos = { x: this.touchData.startX, y: this.touchData.startY };
                    this.joystickEl.style.display = 'block';
                    this.joystickEl.style.left = `${this.touchData.startX}px`;
                    this.joystickEl.style.top = `${this.touchData.startY}px`;
                }

                if (this.touchData.isDragging) {
                    const maxDist = 45;
                    const angle = Math.atan2(dy, dx);
                    const clampDist = Math.min(dist, maxDist);

                    const stickX = Math.cos(angle) * clampDist;
                    const stickY = Math.sin(angle) * clampDist;
                    this.stickEl.style.transform = `translate(${stickX}px, ${stickY}px)`;

                    this.joystickVector = {
                        x: stickX / maxDist,
                        y: stickY / maxDist
                    };
                    this.targetPos = null;
                }
            }
        });

        const endTouch = (e) => {
            if (e.pointerType === 'touch' && this.touchData && e.pointerId === this.touchData.id) {
                if (!this.touchData.isDragging) {
                    // Quick Tap -> Destination Navigation
                    const worldPos = this.screenToWorld(e.clientX, e.clientY);
                    this.setDestination(worldPos.x, worldPos.y);
                }
                this.joystickActive = false;
                this.joystickVector = { x: 0, y: 0 };
                this.joystickEl.style.display = 'none';
                this.touchData = null;
            }
        };

        this.canvas.addEventListener('pointerup', endTouch);
        this.canvas.addEventListener('pointercancel', endTouch);
    }



    screenToWorld(sx, sy) {
        return {
            x: sx + this.camera.x,
            y: sy + this.camera.y
        };
    }

    setDestination(wx, wy) {
        // Clamp to world
        wx = Math.max(30, Math.min(this.worldWidth - 30, wx));
        wy = Math.max(30, Math.min(this.worldHeight - 30, wy));

        this.targetPos = { x: wx, y: wy };
        this.tapRipples.push({
            x: wx,
            y: wy,
            radius: 5,
            maxRadius: 36,
            alpha: 1.0,
            color: this.getOperative().color
        });
    }

    dash() {
        if (!this.player || this.player.dashTimer > 0) return;
        sound.playDash();
        const op = this.getOperative();
        this.player.dashTimer = op.dashCooldown;
        this.player.isDashing = true;
        this.player.dashDuration = 0.18;

        // Spawn dash ghost trails
        for (let i = 0; i < 6; i++) {
            this.particles.push({
                x: this.player.x + (Math.random() * 20 - 10),
                y: this.player.y + (Math.random() * 20 - 10),
                vx: -Math.cos(this.player.angle) * 3,
                vy: -Math.sin(this.player.angle) * 3,
                radius: 12,
                color: op.color,
                alpha: 0.8,
                decay: 0.08
            });
        }
    }

        this.bullets = [];

            x: 100,

            radius: 18,
            speed: op.speed,
            hp: op.maxHp,
            maxHp: op.maxHp,
            angle: 0,
            dashTimer: 0,
            isDashing: false,
            dashDuration: 0,
            stepDist: 0
        };

        this.obstacles = [];
        this.guards = [];
        this.gemsList = [];

        // Build outer world boundaries
        this.worldWidth = 1400;
        this.worldHeight = 1100;

        // Outer perimeter walls
        this.obstacles.push({ x: 0, y: 0, w: this.worldWidth, h: 20 });

        this.obstacles.push({ x: this.worldWidth - 20, y: 0, w: 20, h: this.worldHeight });

        const sectorCycle = index % 5;
        this.buildLayout(sectorCycle);

        this.updateHUD();
    }

    // --- GAME LOOP ---
    loop() {
        requestAnimationFrame(() => this.loop());
        const now = performance.now();
        const dt = Math.min((now - this.lastTime) / 1000, 0.05);
        this.lastTime = now;

        if (!this.isPaused) {
            this.update(dt);
        }
        this.render();
        this.renderMinimap();
    }

    // --- UPDATE LOGIC ---
    update(dt) {
        if (!this.player || this.isGameOver || this.isVictory) return;

        // Operative stats
        const op = this.getOperative();

        // Screen Shake decay
        if (this.shakeTime > 0) {
            this.shakeTime -= dt;
        }

        // Dash cooldown
        if (this.player.dashTimer > 0) {
            this.player.dashTimer -= dt;
        }

        if (this.player.isDashing) {
            this.player.dashDuration -= dt;
            if (this.player.dashDuration <= 0) {
                this.player.isDashing = false;
            }
        }

        // --- PLAYER MOVEMENT ---
        let moveX = 0;
        let moveY = 0;

        // 1. Keyboard
        if (this.keys['w'] || this.keys['arrowup']) moveY -= 1;
        if (this.keys['s'] || this.keys['arrowdown']) moveY += 1;
        if (this.keys['a'] || this.keys['arrowleft']) moveX -= 1;
        if (this.keys['d'] || this.keys['arrowright']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
            this.targetPos = null; // Keyboard overrides tap
            const len = Math.hypot(moveX, moveY);
            moveX /= len;
            moveY /= len;
        } else if (this.joystickActive && (this.joystickVector.x !== 0 || this.joystickVector.y !== 0)) {
            // 2. Touch Virtual Joystick
            moveX = this.joystickVector.x;
            moveY = this.joystickVector.y;
        } else if (this.targetPos) {
            // 3. Tap to move navigation
            const dx = this.targetPos.x - this.player.x;
            const dy = this.targetPos.y - this.player.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 8) {
                this.targetPos = null;
            } else {
                moveX = dx / dist;
                moveY = dy / dist;
            }
        }

        // Apply Player Movement with Collision Sliding
        if (moveX !== 0 || moveY !== 0) {
            const currentSpeed = (this.player.isDashing ? op.speed * 2.8 : op.speed) * 60 * dt;
            const targetAngle = Math.atan2(moveY, moveX);
            this.player.angle = targetAngle;

            // X axis step
            const nextX = this.player.x + moveX * currentSpeed;
            if (!this.checkCircleObstacleCollision(nextX, this.player.y, this.player.radius)) {
                this.player.x = nextX;
            }

            // Y axis step
            const nextY = this.player.y + moveY * currentSpeed;
            if (!this.checkCircleObstacleCollision(this.player.x, nextY, this.player.radius)) {
                this.player.y = nextY;
            }

            // Footsteps sound
            this.player.stepDist += currentSpeed;
            if (this.player.stepDist > 30) {
                this.player.stepDist = 0;
                sound.playFootstep();
            }
        }

        // Camera Follow
        const targetCamX = this.player.x - this.width / 2;
        const targetCamY = this.player.y - this.height / 2;
        this.camera.x += (targetCamX - this.camera.x) * 0.1;
        this.camera.y += (targetCamY - this.camera.y) * 0.1;

        // Clamp camera
        this.camera.x = Math.max(0, Math.min(this.worldWidth - this.width, this.camera.x));
        this.camera.y = Math.max(0, Math.min(this.worldHeight - this.height, this.camera.y));

        // --- GUARDS AI & VISION ---
        const playerInSightFactor = (op.id === 'spectre') ? 0.5 : 1.0;

        for (let i = this.guards.length - 1; i >= 0; i--) {
            const g = this.guards[i];

            // 1. Check Melee Assassination Strike
            const distToPlayer = Math.hypot(this.player.x - g.x, this.player.y - g.y);
            const strikeRange = this.player.radius + g.radius + 14;

            if (distToPlayer <= strikeRange) {
                // ASSASSINATE!
                this.assassinateGuard(i);
                continue;
            }

            // 2. Vision Check (Can Guard see Player?)
            const canSeePlayer = this.checkGuardLineOfSight(g, this.player.x, this.player.y);

            if (canSeePlayer) {
                // Face player
                g.angle = Math.atan2(this.player.y - g.y, this.player.x - g.x);
                g.lastSeenPos = { x: this.player.x, y: this.player.y };

                // Increment Alert Progress
                g.alertProgress += dt * 3.2 * playerInSightFactor;

                if (g.state !== 'combat' && g.alertProgress >= 0.3) {
                    if (g.state !== 'alerting') {
                        g.state = 'alerting';
                        sound.playAlert();
                    }
                }

                if (g.alertProgress >= 1.0) {
                    // Full Hostile Combat State
                    if (g.state !== 'combat') {
                        g.state = 'combat';
                        this.stealthAlarmTriggered = true;
                        this.triggerAlarmAlertNearbyGuards(g.x, g.y);
                    }

                    // Gunfire Attack
                    g.shootCooldown -= dt;
                    if (g.shootCooldown <= 0) {
                        this.guardShoot(g);
                        g.shootCooldown = (g.type === 'heavy') ? 0.35 : 0.65;
                    }
                }
            } else {
                // Guard cannot see player
                if (g.state === 'combat') {
                    // Lost sight, transition to Search
                    g.state = 'search';
                    g.searchTimer = 3.5;
                } else if (g.state === 'alerting') {
                    // Cooldown alert
                    g.alertProgress = Math.max(0, g.alertProgress - dt * 1.5);
                    if (g.alertProgress === 0) g.state = 'patrol';
                }

                // AI States behavior
                if (g.state === 'search') {
                    g.searchTimer -= dt;
                    // Move toward last seen position
                    if (g.lastSeenPos) {
                        const sDist = Math.hypot(g.lastSeenPos.x - g.x, g.lastSeenPos.y - g.y);
                        if (sDist > 15) {
                            const angle = Math.atan2(g.lastSeenPos.y - g.y, g.lastSeenPos.x - g.x);
                            g.angle = angle;
                            g.x += Math.cos(angle) * g.speed * 60 * dt;
                            g.y += Math.sin(angle) * g.speed * 60 * dt;
                        }
                    }
                    if (g.searchTimer <= 0) {
                        g.state = 'patrol';
                        g.alertProgress = 0;
                    }
                } else if (g.state === 'patrol') {
                    // Normal Patrol along waypoints
                    if (g.waypoints && g.waypoints.length > 1) {
                        const wp = g.waypoints[g.currentWp];
                        const wDist = Math.hypot(wp.x - g.x, wp.y - g.y);
                        if (wDist < 8) {
                            g.currentWp = (g.currentWp + 1) % g.waypoints.length;
                        } else {
                            const targetAngle = Math.atan2(wp.y - g.y, wp.x - g.x);
                            // Smooth angle turn
                            g.angle = targetAngle;
                            g.x += Math.cos(g.angle) * g.speed * 60 * dt;
                            g.y += Math.sin(g.angle) * g.speed * 60 * dt;
                        }
                    }
                }
            }
        }

        // --- BULLETS UPDATE ---
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            const b = this.bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.life -= dt;

            // Obstacle collision
            if (this.checkPointObstacleCollision(b.x, b.y)) {
                this.spawnSparks(b.x, b.y, '#ffd000', 4);
                this.bullets.splice(i, 1);
                continue;
            }

            // Player hit collision
            const pDist = Math.hypot(this.player.x - b.x, this.player.y - b.y);
            if (pDist <= this.player.radius) {
                // Bullet hit player
                const damage = (op.id === 'juggernaut') ? b.damage * 0.55 : b.damage;
                this.player.hp = Math.max(0, this.player.hp - damage);
                this.triggerScreenShake(0.2, 7);
                this.spawnBlood(this.player.x, this.player.y, 8);
                this.spawnFloatingText(`-${Math.round(damage)}`, this.player.x, this.player.y - 15, '#ff2a5f');

                this.bullets.splice(i, 1);
                this.updateHUD();

                if (this.player.hp <= 0) {
                    this.onGameOver();
                    return;
                }
                continue;
            }

            if (b.life <= 0) {
                this.bullets.splice(i, 1);
            }
        }

        // --- GEMS COLLECTION ---
        for (let i = this.gemsList.length - 1; i >= 0; i--) {
            const gem = this.gemsList[i];
            gem.angle += dt * 3;
            const dist = Math.hypot(this.player.x - gem.x, this.player.y - gem.y);

            // Magnetic pickup
            if (dist < 90) {
                const angle = Math.atan2(this.player.y - gem.y, this.player.x - gem.x);
                gem.x += Math.cos(angle) * 320 * dt;
                gem.y += Math.sin(angle) * 320 * dt;
            }

            if (dist <= this.player.radius + gem.radius) {
                sound.playGem();
                this.gems += gem.val;
                this.spawnFloatingText(`+${gem.val} 💎`, gem.x, gem.y - 10, '#00f0ff');
                this.spawnSparks(gem.x, gem.y, '#00f0ff', 6);
                this.gemsList.splice(i, 1);
                this.updateHUD();
                this.saveUnlockedOperatives();
            }
        }

        // Check Victory
        if (this.guards.length === 0 && !this.isVictory && !this.isGameOver) {
            this.onVictory();
        }

        // Update Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;
            if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        // Update Floating Texts
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const t = this.floatingTexts[i];
            t.y -= t.vy * dt;
            t.life -= dt;
            if (t.life <= 0) this.floatingTexts.splice(i, 1);
        }

        // Update Tap Ripples
        for (let i = this.tapRipples.length - 1; i >= 0; i--) {
            const r = this.tapRipples[i];
            r.radius += (r.maxRadius - r.radius) * 0.18;
            r.alpha -= dt * 2.5;
            if (r.alpha <= 0) this.tapRipples.splice(i, 1);
        }
    }

    assassinateGuard(idx) {
        const g = this.guards[idx];
        sound.playSlash();
        this.triggerScreenShake(0.18, 5);

        // Splatter & FX
        this.spawnBlood(g.x, g.y, 18);
        this.spawnSparks(g.x, g.y, '#ff2a5f', 12);
        this.spawnFloatingText('STEALTH STRIKE!', g.x, g.y - 25, '#ffd000');

        // Drop Gems
        const gemDropCount = g.type === 'heavy' ? 3 : 2;
        for (let i = 0; i < gemDropCount; i++) {
            this.gemsList.push({
                x: g.x + (Math.random() * 30 - 15),
                y: g.y + (Math.random() * 30 - 15),
                radius: 10,
                val: 50,
                angle: 0
            });
        }

        this.guards.splice(idx, 1);
        this.updateHUD();
    }

    guardShoot(g) {
        sound.playGunshot();
        this.triggerScreenShake(0.1, 3);

        const spread = (Math.random() - 0.5) * 0.12;
        const shootAngle = g.angle + spread;
        const speed = 650;

        this.bullets.push({
            x: g.x + Math.cos(g.angle) * (g.radius + 10),
            y: g.y + Math.sin(g.angle) * (g.radius + 10),
            vx: Math.cos(shootAngle) * speed,
            vy: Math.sin(shootAngle) * speed,
            damage: g.type === 'heavy' ? 24 : 16,
            life: 1.8
        });

        // Muzzle smoke particle
        this.particles.push({
            x: g.x + Math.cos(g.angle) * (g.radius + 12),
            y: g.y + Math.sin(g.angle) * (g.radius + 12),
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
            radius: 8,
            color: '#ffea75',
            alpha: 0.9,
            decay: 0.12
        });
    }

    triggerAlarmAlertNearbyGuards(gx, gy) {
        this.guards.forEach(g => {
            if (g.state === 'patrol') {
                const dist = Math.hypot(g.x - gx, g.y - gy);
                if (dist <= 380) {
                    g.state = 'search';
                    g.lastSeenPos = { x: gx, y: gy };
                    g.searchTimer = 4.0;
                }
            }
        });
    }

    // --- LINE OF SIGHT & RAYCASTING ---
    checkGuardLineOfSight(guard, px, py) {
        const dx = px - guard.x;
        const dy = py - guard.y;
        const dist = Math.hypot(dx, dy);

        if (dist > guard.fovDist) return false;

        // Angle check
        let angleToTarget = Math.atan2(dy, dx);
        let diff = angleToTarget - guard.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;

        if (Math.abs(diff) > guard.fovAngle / 2) return false;

        // Raycast against all obstacles
        return !this.lineIntersectsAnyObstacle(guard.x, guard.y, px, py);
    }

    lineIntersectsAnyObstacle(x1, y1, x2, y2) {
        for (let obs of this.obstacles) {
            if (this.lineIntersectsRect(x1, y1, x2, y2, obs)) {
                return true;
            }
        }
        return false;
    }

    lineIntersectsRect(x1, y1, x2, y2, rect) {
        const minX = rect.x;
        const maxX = rect.x + rect.w;
        const minY = rect.y;
        const maxY = rect.y + rect.h;

        // Check if either endpoint is inside rect
        if (x1 >= minX && x1 <= maxX && y1 >= minY && y1 <= maxY) return true;
        if (x2 >= minX && x2 <= maxX && y2 >= minY && y2 <= maxY) return true;

        // Check all 4 edges
        return (
            this.lineLineIntersection(x1, y1, x2, y2, minX, minY, maxX, minY) ||
            this.lineLineIntersection(x1, y1, x2, y2, maxX, minY, maxX, maxY) ||
            this.lineLineIntersection(x1, y1, x2, y2, maxX, maxY, minX, maxY) ||
            this.lineLineIntersection(x1, y1, x2, y2, minX, maxY, minX, minY)
        );
    }

    lineLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
        const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(den) < 0.0001) return false;

        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
        const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;

        return t >= 0 && t <= 1 && u >= 0 && u <= 1;
    }

    checkCircleObstacleCollision(cx, cy, r) {
        for (let obs of this.obstacles) {
            const nearestX = Math.max(obs.x, Math.min(cx, obs.x + obs.w));
            const nearestY = Math.max(obs.y, Math.min(cy, obs.y + obs.h));
            const dist = Math.hypot(cx - nearestX, cy - nearestY);
            if (dist < r) return true;
        }
        return false;
    }

    checkPointObstacleCollision(px, py) {
        for (let obs of this.obstacles) {
            if (px >= obs.x && px <= obs.x + obs.w && py >= obs.y && py <= obs.y + obs.h) {
                return true;
            }
        }
        return false;
    }

    // --- EFFECTS & PARTICLES ---
    triggerScreenShake(duration, magnitude) {
        this.shakeTime = duration;
        this.shakeMagnitude = magnitude;
    }

    spawnBlood(x, y, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 5 + 1;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                radius: Math.random() * 5 + 3,
                color: '#ff2a5f',
                alpha: 0.9,
                decay: 0.03
            });
        }
    }

    spawnSparks(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const spd = Math.random() * 6 + 2;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * spd,
                vy: Math.sin(angle) * spd,
                radius: Math.random() * 3 + 2,
                color,
                alpha: 1.0,
                decay: 0.05
            });
        }
    }

    spawnFloatingText(text, x, y, color) {
        this.floatingTexts.push({
            text, x, y,
            color,
            vy: 35,
            life: 1.2,
            maxLife: 1.2
        });
    }

    // --- GAME OVER & VICTORY ---
    onGameOver() {
        this.isGameOver = true;
        sound.playAlert();
        document.getElementById('gameover-kills').textContent = `${this.guards.length} Left`;
        document.getElementById('gameover-total-gems').textContent = this.gems.toString();
        this.modalGameOver.classList.add('active');
    }

    onVictory() {
        this.isVictory = true;
        sound.playVictory();
        const bonus = this.stealthAlarmTriggered ? 150 : 300;
        this.gems += bonus;
        this.saveUnlockedOperatives();

        document.getElementById('victory-gems').textContent = `+${bonus} 💎`;
        document.getElementById('victory-stealth').textContent = this.stealthAlarmTriggered ? 'DETECTED' : 'PERFECT SHADOW';
        this.modalVictory.classList.add('active');
    }

    updateHUD() {
        if (!this.player) return;
        this.elGems.textContent = this.gems;
        this.elTargets.textContent = `${this.guards.length} Left`;

        const pct = Math.max(0, (this.player.hp / this.player.maxHp) * 100);
        this.elHealth.style.width = `${pct}%`;
        if (pct < 30) {
            this.elHealth.style.background = 'var(--neon-red)';
        } else if (pct < 60) {
            this.elHealth.style.background = 'var(--neon-yellow)';
        } else {
            this.elHealth.style.background = 'linear-gradient(90deg, var(--neon-green), #88ff00)';
        }
    }

    // --- OPERATIVE ROSTER STORE ---
    openRoster() {
        this.isPaused = true;
        const container = document.getElementById('roster-container');
        container.innerHTML = '';

        OPERATIVES.forEach(op => {
            const card = document.createElement('div');
            card.className = `roster-card ${op.id === this.currentOperativeId ? 'selected' : ''}`;

            const info = document.createElement('div');
            info.className = 'roster-info';
            info.innerHTML = `
                <h4>${op.name}</h4>
                <p>${op.desc} • Spd: ${op.speed} • HP: ${op.maxHp}</p>
            `;

            const btn = document.createElement('button');
            btn.className = 'roster-btn';

            if (op.id === this.currentOperativeId) {
                btn.textContent = 'ACTIVE';
                btn.style.background = 'var(--neon-cyan)';
                btn.style.color = '#000';
            } else if (op.unlocked) {
                btn.textContent = 'SELECT';
                btn.style.background = 'rgba(255,255,255,0.15)';
                btn.style.color = '#fff';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    this.currentOperativeId = op.id;
                    this.saveUnlockedOperatives();
                    this.loadSector(this.sectorIndex);
                    this.openRoster();
                };
            } else {
                btn.textContent = `UNLOCK (${op.cost} 💎)`;
                btn.style.background = (this.gems >= op.cost) ? 'var(--neon-yellow)' : 'rgba(255,255,255,0.08)';
                btn.style.color = (this.gems >= op.cost) ? '#000' : '#777';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    if (this.gems >= op.cost) {
                        this.gems -= op.cost;
                        op.unlocked = true;
                        this.currentOperativeId = op.id;
                        this.saveUnlockedOperatives();
                        this.loadSector(this.sectorIndex);
                        this.openRoster();
                    } else {
                        alert('Not enough gems! Eliminate sentries to earn more.');
                    }
                };
            }

            card.appendChild(info);
            card.appendChild(btn);
            container.appendChild(card);
        });

        this.modalRoster.classList.add('active');
    }

    // --- RENDERING ---
    render() {
        this.ctx.clearRect(0, 0, this.width, this.height);

        // Screen Shake offset
        let offsetX = -this.camera.x;
        let offsetY = -this.camera.y;

        if (this.shakeTime > 0) {
            offsetX += (Math.random() * 2 - 1) * this.shakeMagnitude;
            offsetY += (Math.random() * 2 - 1) * this.shakeMagnitude;
        }

        this.ctx.save();
        this.ctx.translate(offsetX, offsetY);

        // 1. Draw Tactical Floor Grid
        this.drawFloorGrid();

        // 2. Draw Tap Ripples
        this.tapRipples.forEach(r => {
            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            this.ctx.strokeStyle = r.color;
            this.ctx.globalAlpha = r.alpha;
            this.ctx.lineWidth = 2.5;
            this.ctx.stroke();
            this.ctx.restore();
        });

        // 3. Draw Guard Flashlight Cones (with Raycast Shadow Obstruction)
        this.guards.forEach(g => this.drawGuardVisionCone(g));

        // 4. Draw Obstacles / Crates
        this.obstacles.forEach(obs => this.drawObstacle(obs));

        // 5. Draw Gems
        this.gemsList.forEach(gem => this.drawGem(gem));

        // 6. Draw Bullets
        this.bullets.forEach(b => this.drawBullet(b));

        // 7. Draw Guards
        this.guards.forEach(g => this.drawGuard(g));

        // 8. Draw Player
        if (this.player) this.drawPlayer(this.player);

        // 9. Draw Particles
        this.particles.forEach(p => {
            this.ctx.save();
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            this.ctx.fillStyle = p.color;
            this.ctx.globalAlpha = Math.max(0, p.alpha);
            this.ctx.fill();
            this.ctx.restore();
        });

        // 10. Draw Floating Texts
        this.floatingTexts.forEach(t => {
            this.ctx.save();
            this.ctx.font = 'bold 15px Orbitron, sans-serif';
            this.ctx.fillStyle = t.color;
            this.ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
            this.ctx.textAlign = 'center';
            this.ctx.shadowColor = t.color;
            this.ctx.shadowBlur = 8;
            this.ctx.fillText(t.text, t.x, t.y);
            this.ctx.restore();
        });

        this.ctx.restore();
    }

    drawFloorGrid() {
        const step = 80;
        this.ctx.strokeStyle = '#151923';
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();

        for (let x = 0; x <= this.worldWidth; x += step) {
            this.ctx.moveTo(x, 0);
            this.ctx.lineTo(x, this.worldHeight);
        }
        for (let y = 0; y <= this.worldHeight; y += step) {
            this.ctx.moveTo(0, y);
            this.ctx.lineTo(this.worldWidth, y);
        }
        this.ctx.stroke();

        // Perimeter border
        this.ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
        this.ctx.lineWidth = 3;
        this.ctx.strokeRect(20, 20, this.worldWidth - 40, this.worldHeight - 40);
    }

    drawObstacle(obs) {
        // Metallic Shipping Container / Military Crate
        this.ctx.save();
        this.ctx.fillStyle = '#1e2430';
        this.ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

        // Inner bevel
        this.ctx.strokeStyle = '#2d3748';
        this.ctx.lineWidth = 2;
        this.ctx.strokeRect(obs.x + 2, obs.y + 2, obs.w - 4, obs.h - 4);

        // Cross braces on crates
        if (obs.w > 40 && obs.h > 40) {
            this.ctx.strokeStyle = '#181d27';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.moveTo(obs.x + 4, obs.y + 4);
            this.ctx.lineTo(obs.x + obs.w - 4, obs.y + obs.h - 4);
            this.ctx.moveTo(obs.x + obs.w - 4, obs.y + 4);
            this.ctx.lineTo(obs.x + 4, obs.y + obs.h - 4);
            this.ctx.stroke();
        }

        // Corner metallic bolts
        this.ctx.fillStyle = '#00f0ff';
        this.ctx.globalAlpha = 0.4;
        this.ctx.fillRect(obs.x + 4, obs.y + 4, 3, 3);
        this.ctx.fillRect(obs.x + obs.w - 7, obs.y + 4, 3, 3);
        this.ctx.fillRect(obs.x + 4, obs.y + obs.h - 7, 3, 3);
        this.ctx.fillRect(obs.x + obs.w - 7, obs.y + obs.h - 7, 3, 3);
        this.ctx.restore();
    }

    drawGuardVisionCone(g) {
        // Raycasting vision cone clipped by walls
        const rayCount = 36;
        const startAngle = g.angle - g.fovAngle / 2;
        const angleStep = g.fovAngle / rayCount;

        const points = [{ x: g.x, y: g.y }];

        for (let i = 0; i <= rayCount; i++) {
            const rayAngle = startAngle + i * angleStep;
            let closestDist = g.fovDist;

            // Check ray intersection against obstacles
            const rx2 = g.x + Math.cos(rayAngle) * g.fovDist;
            const ry2 = g.y + Math.sin(rayAngle) * g.fovDist;

            for (let obs of this.obstacles) {
                const dist = this.getRayRectIntersectionDist(g.x, g.y, rx2, ry2, obs);
                if (dist !== null && dist < closestDist) {
                    closestDist = dist;
                }
            }

            points.push({
                x: g.x + Math.cos(rayAngle) * closestDist,
                y: g.y + Math.sin(rayAngle) * closestDist
            });
        }

        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            this.ctx.lineTo(points[i].x, points[i].y);
        }
        this.ctx.closePath();

        // Cone gradient color based on guard state
        let gradColor = 'rgba(255, 208, 0, ';
        if (g.state === 'combat') gradColor = 'rgba(255, 42, 95, ';
        else if (g.state === 'alerting') gradColor = 'rgba(255, 140, 0, ';

        const grad = this.ctx.createRadialGradient(g.x, g.y, 10, g.x, g.y, g.fovDist);
        grad.addColorStop(0, gradColor + '0.55)');
        grad.addColorStop(0.7, gradColor + '0.25)');
        grad.addColorStop(1, gradColor + '0.0)');

        this.ctx.fillStyle = grad;
        this.ctx.fill();

        // Edge stroke
        this.ctx.strokeStyle = gradColor + '0.45)';
        this.ctx.lineWidth = 1.5;
        this.ctx.stroke();

        this.ctx.restore();
    }

    getRayRectIntersectionDist(x1, y1, x2, y2, rect) {
        const minX = rect.x;
        const maxX = rect.x + rect.w;
        const minY = rect.y;
        const maxY = rect.y + rect.h;

        let closest = null;
        const lines = [
            [minX, minY, maxX, minY],
            [maxX, minY, maxX, maxY],
            [maxX, maxY, minX, maxY],
            [minX, maxY, minX, minY]
        ];

        for (let [x3, y3, x4, y4] of lines) {
            const pt = this.getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4);
            if (pt) {
                const dist = Math.hypot(pt.x - x1, pt.y - y1);
                if (closest === null || dist < closest) {
                    closest = dist;
                }
            }
        }
        return closest;
    }

    getLineIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
        const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(den) < 0.0001) return null;

        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
        const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / den;

        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
            return {
                x: x1 + t * (x2 - x1),
                y: y1 + t * (y2 - y1)
            };
        }
        return null;
    }

    drawGem(gem) {
        this.ctx.save();
        this.ctx.translate(gem.x, gem.y);
        this.ctx.rotate(gem.angle);

        // Gem glow
        this.ctx.shadowColor = '#00f0ff';
        this.ctx.shadowBlur = 12;

        this.ctx.fillStyle = '#00f0ff';
        this.ctx.beginPath();
        this.ctx.moveTo(0, -gem.radius);
        this.ctx.lineTo(gem.radius, 0);
        this.ctx.lineTo(0, gem.radius);
        this.ctx.lineTo(-gem.radius, 0);
        this.ctx.closePath();
        this.ctx.fill();

        // Inner highlight
        this.ctx.fillStyle = '#ffffff';
        this.ctx.beginPath();
        this.ctx.moveTo(0, -gem.radius * 0.4);
        this.ctx.lineTo(gem.radius * 0.4, 0);
        this.ctx.lineTo(0, gem.radius * 0.4);
        this.ctx.lineTo(-gem.radius * 0.4, 0);
        this.ctx.closePath();
        this.ctx.fill();

        this.ctx.restore();
    }

    drawBullet(b) {
        this.ctx.save();
        this.ctx.beginPath();
        this.ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        this.ctx.fillStyle = '#ffd000';
        this.ctx.shadowColor = '#ff2a5f';
        this.ctx.shadowBlur = 8;
        this.ctx.fill();
        this.ctx.restore();
    }

    drawGuard(g) {
        this.ctx.save();
        this.ctx.translate(g.x, g.y);
        this.ctx.rotate(g.angle);

        // Flashlight source
        this.ctx.fillStyle = '#ffd000';
        this.ctx.fillRect(g.radius * 0.6, -3, 8, 6);

        // Guard body
        this.ctx.beginPath();
        this.ctx.arc(0, 0, g.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = g.type === 'heavy' ? '#3b1d28' : '#1e293b';
        this.ctx.strokeStyle = g.type === 'heavy' ? '#ff2a5f' : '#64748b';
        this.ctx.lineWidth = 2.5;
        this.ctx.fill();
        this.ctx.stroke();

        // Helmet visor
        this.ctx.fillStyle = (g.state === 'combat') ? '#ff2a5f' : '#ffd000';
        this.ctx.fillRect(g.radius * 0.2, -5, 6, 10);

        this.ctx.restore();

        // Alert Emote / Indicator above head
        if (g.state === 'alerting' || g.state === 'combat') {
            this.ctx.save();
            this.ctx.font = 'bold 22px Orbitron, sans-serif';
            this.ctx.fillStyle = (g.state === 'combat') ? '#ff2a5f' : '#ffd000';
            this.ctx.textAlign = 'center';
            this.ctx.shadowColor = this.ctx.fillStyle;
            this.ctx.shadowBlur = 10;
            this.ctx.fillText('!', g.x, g.y - g.radius - 8);
            this.ctx.restore();
        } else if (g.state === 'search') {
            this.ctx.save();
            this.ctx.font = 'bold 18px Orbitron, sans-serif';
            this.ctx.fillStyle = '#ffd000';
            this.ctx.textAlign = 'center';
            this.ctx.fillText('?', g.x, g.y - g.radius - 8);
            this.ctx.restore();
        }
    }

    drawPlayer(p) {
        const op = this.getOperative();
        this.ctx.save();
        this.ctx.translate(p.x, p.y);
        this.ctx.rotate(p.angle);

        // Stealth operative body
        this.ctx.beginPath();
        this.ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = '#0f172a';
        this.ctx.strokeStyle = op.color;
        this.ctx.lineWidth = 3;
        this.ctx.shadowColor = op.color;
        this.ctx.shadowBlur = p.isDashing ? 18 : 6;
        this.ctx.fill();
        this.ctx.stroke();

        // Direction / Katana weapon sheath
        this.ctx.fillStyle = op.color;
        this.ctx.fillRect(p.radius * 0.4, -4, 8, 8);

        this.ctx.restore();
    }

    // --- MINIMAP RADAR ---
    renderMinimap() {
        const mCtx = this.minimapCtx;
        const mw = 110;
        const mh = 110;
        mCtx.clearRect(0, 0, mw, mh);

        const scaleX = mw / this.worldWidth;
        const scaleY = mh / this.worldHeight;

        // Background
        mCtx.fillStyle = 'rgba(10, 14, 22, 0.9)';
        mCtx.fillRect(0, 0, mw, mh);

        // Obstacles
        mCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        this.obstacles.forEach(obs => {
            mCtx.fillRect(obs.x * scaleX, obs.y * scaleY, obs.w * scaleX, obs.h * scaleY);
        });

        // Gems
        mCtx.fillStyle = '#00f0ff';
        this.gemsList.forEach(gem => {
            mCtx.fillRect(gem.x * scaleX - 1, gem.y * scaleY - 1, 2, 2);
        });

        // Guards
        this.guards.forEach(g => {
            mCtx.fillStyle = (g.state === 'combat') ? '#ff2a5f' : '#ffd000';
            mCtx.beginPath();
            mCtx.arc(g.x * scaleX, g.y * scaleY, 2.5, 0, Math.PI * 2);
            mCtx.fill();
        });

        // Player
        if (this.player) {
            mCtx.fillStyle = '#00ff88';
            mCtx.beginPath();
            mCtx.arc(this.player.x * scaleX, this.player.y * scaleY, 3.5, 0, Math.PI * 2);
            mCtx.fill();
        }

        // Radar grid crosshairs
        mCtx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
        mCtx.lineWidth = 1;
        mCtx.strokeRect(0, 0, mw, mh);
    }
}

// Start Game on load
window.addEventListener('load', () => {
    new Game();
});
</script>
