name: Auto-update game/app index

on:
  push:
    branches: [ main ]
    paths:
      - 'Micro_Games/**'
      - 'Micro_Apps/**'
      - 'update_microverse.py'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run index generator
        run: python update_microverse.py

      - name: Commit updated index files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Micro_Games/index.html Micro_Apps/index.html
          # No "[skip ci]" here on purpose: the follow-up push must trigger the
          # Pages deploy workflow so the fresh index actually goes live. The
          # second run is a no-op because the generator is deterministic.
          git diff --staged --quiet || git commit -m "Auto-update index.html"
          git push

